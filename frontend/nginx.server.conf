# FinMate 운영 서버용 Nginx 설정이다.
# React 정적 파일 제공, HTTPS 종료, Spring API·WebSocket reverse proxy를 담당한다.
# 로컬 HTTP 개발 환경은 frontend/nginx.local.conf를 사용한다.
#
# 전제:
# - finmate-project.com DNS가 이 EC2의 public IP를 가리킨다.
# - Certbot이 발급한 인증서가 EC2 호스트의 /etc/letsencrypt에 존재한다.
# - docker-compose.server.yml이 /etc/letsencrypt를 컨테이너에 read-only mount한다.

# WebSocket 요청에는 Connection: upgrade를, 일반 HTTP 요청에는 Connection: close를 전달한다.
map $http_upgrade $connection_upgrade {
    default upgrade;
    ''      close;
}

# 사용자가 접속한 원래 protocol을 Spring에 전달하기 위한 값이다.
# 현재처럼 Nginx가 직접 HTTPS를 종료하면 $scheme이 https다.
# 향후 신뢰할 수 있는 Load Balancer가 앞에 놓이면 LB가 보낸 X-Forwarded-Proto를 우선한다.
map $http_x_forwarded_proto $external_proto {
    default $scheme;
    http    http;
    https   https;
}

map $http_x_forwarded_port $external_port {
    default '';
    ~^[0-9]+$ $http_x_forwarded_port;
}

# Compose 내부 DNS의 backend 서비스로 요청을 전달한다. 외부에는 8080 포트를 공개하지 않는다.
upstream finmate_backend {
    server backend:8080;
    keepalive 16;
}

# 80번 포트는 내부 Docker healthcheck에 응답하고 일반 HTTP 요청을 HTTPS로 전환한다.
# healthcheck 자체는 컨테이너 내부에서 실행되므로 EC2 Security Group의 inbound 80 규칙과는 무관하다.
# 외부 사용자의 HTTP → HTTPS redirect가 필요하면 Security Group에서 80번 포트를 허용한다.
server {
    listen 80;
    server_name finmate-project.com;

    # docker-compose.server.yml의 Nginx 컨테이너 healthcheck 전용 endpoint다.
    location = /nginx-health {
        access_log off;
        default_type text/plain;
        return 200 "ok\n";
    }

    # healthcheck 이외의 모든 HTTP 요청은 같은 URI의 HTTPS 주소로 영구 redirect한다.
    location / {
        return 301 https://finmate-project.com$request_uri;
    }
}

# 443번 포트에서 TLS를 종료하고 React, API, OAuth, WebSocket 요청을 처리한다.
# React 정적 파일은 Nginx가 직접 반환하고 서버 처리가 필요한 경로만 Spring으로 전달한다.
server {
    listen 443 ssl;
    server_name finmate-project.com;

    # HTTPS 인증과 암호화 통신은 다음 순서로 이루어진다.
    #
    # 1. EC2에서 Certbot을 실행하면 Let's Encrypt가 이 서버가 finmate-project.com을
    #    실제로 관리하는지 확인하고 TLS 인증서를 발급한다.
    #    이 과정에서 인증서와 한 쌍으로 사용되는 개인키도 EC2 내부에 만들어진다.
    #
    # 2. 브라우저가 https://finmate-project.com에 접속하면 Nginx가 TLS 인증서를 전달한다.
    #    브라우저는 이 인증서가 신뢰할 수 있는 기관에서 발급됐는지, 접속한 도메인과 일치하는지,
    #    아직 유효한 인증서인지 확인한다.
    #
    # 3. 인증서만 복사해서 사용하는 가짜 서버가 아닌지도 확인해야 한다.
    #    Nginx는 인증서에 대응하는 개인키를 가지고 있다는 증거로 TLS handshake 내용에 서명하고,
    #    브라우저는 인증서에 포함된 공개키로 그 서명이 올바른지 확인한다.
    #
    # 4. 서버 확인이 끝나면 브라우저와 Nginx는 앞으로 주고받을 내용을 암호화할 준비를 한다.
    #    비밀키를 인터넷으로 직접 전송하면 탈취될 수 있으므로, ECDHE 방식으로 서로만 알 수 있는
    #    같은 값(공유 비밀)을 각자 계산하고 이 값을 바탕으로 실제 통신에 사용할 암호화 키를 만든다.
    #
    # 5. 이후 브라우저와 Nginx는 만들어진 통신용 키로 HTTP 요청과 응답을 암호화해서 주고받는다.
    #    이것이 HTTP에 TLS 암호화가 적용된 HTTPS 통신이다.
    #
    # TLS handshake는 HTTP 요청마다 반복하는 것이 아니라 새로운 TLS 연결을 만들 때 수행한다.
    # 같은 연결을 계속 사용하면 이미 만들어 둔 비밀키로 여러 HTTP 요청과 응답을 처리할 수 있다.

    # fullchain.pem은 도메인 인증서와 중간 인증서 체인이다. Nginx가 TLS handshake에서 브라우저에 제공한다.
    ssl_certificate /etc/letsencrypt/live/finmate-project.com/fullchain.pem;

    # privkey.pem은 인증서의 공개키와 짝을 이루는 서버 개인키다.
    # TLS handshake에서 서버가 해당 개인키를 보유했음을 증명할 때 사용하며 외부에 공개하면 안 된다.
    ssl_certificate_key /etc/letsencrypt/live/finmate-project.com/privkey.pem;

    # TLS 1.2와 1.3만 허용한다. handshake는 HTTP 요청마다가 아니라 새 TLS 연결을 만들 때 수행한다.
    # session cache는 재연결 시 handshake 비용을 줄이고, session ticket은 사용하지 않는다.
    ssl_protocols TLSv1.2 TLSv1.3;
    ssl_session_cache shared:SSL:10m;
    ssl_session_timeout 1d;
    ssl_session_tickets off;

    # frontend Docker build에서 생성한 React 정적 파일 위치다.
    root /usr/share/nginx/html;
    index index.html;

    # Vite가 content hash를 붙인 정적 asset은 파일명이 변경될 때만 내용이 바뀌므로 장기 cache한다.
    location /assets/ {
        try_files $uri =404;
        expires 1y;
        add_header Cache-Control "public, immutable";
    }

    # API, OAuth callback과 WebSocket 요청은 Compose 내부의 Spring backend로 전달한다.
    location ~ ^/(api/|oauth2/|login/oauth2/|ws/) {
        proxy_pass http://finmate_backend;
        proxy_http_version 1.1;

        proxy_set_header Host $http_host;
        proxy_set_header X-Forwarded-Host $http_host;
        proxy_set_header X-Forwarded-Proto $external_proto;
        proxy_set_header X-Forwarded-Port $external_port;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;

        # Upgrade/Connection header는 WebSocket handshake에 필요하다.
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection $connection_upgrade;

        # 장시간 유지되는 WebSocket 연결이 일반 proxy timeout으로 종료되는 것을 막는다.
        proxy_read_timeout 3600s;
    }

    # Spring Security가 처리하는 logout 요청은 React Router로 보내지 않는다.
    location = /logout {
        proxy_pass http://finmate_backend;
        proxy_http_version 1.1;

        proxy_set_header Host $http_host;
        proxy_set_header X-Forwarded-Host $http_host;
        proxy_set_header X-Forwarded-Proto $external_proto;
        proxy_set_header X-Forwarded-Port $external_port;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    }

    # 같은 /login 경로에서 GET은 React 로그인 화면, POST는 Spring Security 인증 요청이다.
    # Nginx의 if는 POST 요청만 named location으로 분기하기 위해 제한적으로 사용한다.
    location = /login {
        error_page 418 = @spring_login;
        if ($request_method = POST) {
            return 418;
        }

        try_files /index.html =404;
    }

    # POST /login을 처리하는 Spring Security endpoint다.
    location @spring_login {
        proxy_pass http://finmate_backend;
        proxy_http_version 1.1;

        proxy_set_header Host $http_host;
        proxy_set_header X-Forwarded-Host $http_host;
        proxy_set_header X-Forwarded-Proto $external_proto;
        proxy_set_header X-Forwarded-Port $external_port;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    }

    # 실제 파일이 없는 React Router 경로는 index.html로 보내 브라우저에서 routing한다.
    location / {
        try_files $uri $uri/ /index.html;
    }
}
