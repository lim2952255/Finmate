# 운영 서버 전용 Nginx 설정이다.
# 로컬 HTTP 실행은 frontend/nginx.local.conf를 사용한다.
#
# 전제:
# - finmate-project.com이 이 EC2를 가리킨다.
# - EC2 호스트의 Certbot 인증서가 /etc/letsencrypt에 존재한다.
# - docker-compose.server.yml이 인증서 디렉터리를 동일한 경로로 mount한다.

map $http_upgrade $connection_upgrade {
    default upgrade;
    ''      close;
}

# 직접 HTTPS 요청을 받을 때는 $scheme이 https다.
# 나중에 Load Balancer를 앞에 두더라도 전달된 X-Forwarded-Proto를 우선한다.
map $http_x_forwarded_proto $external_proto {
    default $scheme;
    http    http;
    https   https;
}

map $http_x_forwarded_port $external_port {
    default '';
    ~^[0-9]+$ $http_x_forwarded_port;
}

upstream finmate_backend {
    server backend:8080;
    keepalive 16;
}

# HTTP는 Docker healthcheck만 직접 처리하고 나머지는 HTTPS로 보낸다.
server {
    listen 80;
    server_name finmate-project.com;

    location = /nginx-health {
        access_log off;
        default_type text/plain;
        return 200 "ok\n";
    }

    location / {
        return 301 https://finmate-project.com$request_uri;
    }
}

# 실제 React, API, OAuth, WebSocket 요청을 처리하는 HTTPS 서버다.
server {
    listen 443 ssl;
    server_name finmate-project.com;

    ssl_certificate /etc/letsencrypt/live/finmate-project.com/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/finmate-project.com/privkey.pem;
    ssl_protocols TLSv1.2 TLSv1.3;
    ssl_session_cache shared:SSL:10m;
    ssl_session_timeout 1d;
    ssl_session_tickets off;

    root /usr/share/nginx/html;
    index index.html;

    location /assets/ {
        try_files $uri =404;
        expires 1y;
        add_header Cache-Control "public, immutable";
    }

    location ~ ^/(api/|oauth2/|login/oauth2/|ws/) {
        proxy_pass http://finmate_backend;
        proxy_http_version 1.1;

        proxy_set_header Host $http_host;
        proxy_set_header X-Forwarded-Host $http_host;
        proxy_set_header X-Forwarded-Proto $external_proto;
        proxy_set_header X-Forwarded-Port $external_port;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;

        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection $connection_upgrade;
        proxy_read_timeout 3600s;
    }

    location = /logout {
        proxy_pass http://finmate_backend;
        proxy_http_version 1.1;

        proxy_set_header Host $http_host;
        proxy_set_header X-Forwarded-Host $http_host;
        proxy_set_header X-Forwarded-Proto $external_proto;
        proxy_set_header X-Forwarded-Port $external_port;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    }

    # GET /login은 React가, POST /login은 Spring Security가 처리한다.
    location = /login {
        error_page 418 = @spring_login;
        if ($request_method = POST) {
            return 418;
        }

        try_files /index.html =404;
    }

    location @spring_login {
        proxy_pass http://finmate_backend;
        proxy_http_version 1.1;

        proxy_set_header Host $http_host;
        proxy_set_header X-Forwarded-Host $http_host;
        proxy_set_header X-Forwarded-Proto $external_proto;
        proxy_set_header X-Forwarded-Port $external_port;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    }

    location / {
        try_files $uri $uri/ /index.html;
    }
}
