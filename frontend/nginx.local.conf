# FinMate 로컬 HTTP 실행에서 브라우저 요청이 처음 도착하는 Nginx 설정 파일이다.
#
# Nginx의 역할은 크게 두 가지다.
# 1. 빌드된 React 화면과 JavaScript/CSS 파일은 직접 제공한다.
# 2. API, 로그인, OAuth, WebSocket 요청은 Spring 컨테이너로 전달한다.
#
# 사용자는 http://localhost:5173 또는 https://실제도메인으로 접속하지만,
# Spring이 컨테이너 내부에서 직접 보는 주소는 http://backend:8080이다.
# Nginx는 사용자가 접속한 원래 Host·프로토콜·포트를 헤더로 Spring에 전달한다.
#
# Docker Compose를 실행하면 기본 전용 네트워크가 하나 만들어지고,
# nginx, backend, mysql, redis 서비스가 모두 그 네트워크에 연결된다.
# 같은 네트워크 안에서는 Docker의 내부 DNS가 서비스 이름을 컨테이너 IP로 변환한다.
# 예: backend -> Spring 컨테이너 IP, mysql -> MySQL 컨테이너 IP

# 일반 HTTP 요청과 WebSocket 요청에 넣을 Connection 헤더 값을 구한다.
# - Upgrade 헤더가 있는 WebSocket 요청 -> connection_upgrade = upgrade
# - Upgrade 헤더가 없는 일반 HTTP 요청 -> connection_upgrade = close
map $http_upgrade $connection_upgrade {
    default upgrade;
    ''      close;
}

# 사용자가 처음 접속할 때 사용한 외부 프로토콜(http/https)을 구한다.
# AWS Load Balancer가 HTTPS를 처리한 뒤 Nginx에는 HTTP로 전달하더라도
# X-Forwarded-Proto: https가 있으므로 원래 HTTPS 정보를 보존할 수 있다.
# Load Balancer 없이 Nginx에 직접 접속하면 현재 요청의 $scheme을 사용한다.
map $http_x_forwarded_proto $external_proto {
    default $scheme;
    http    http;
    https   https;
}

# Load Balancer가 알려준 외부 포트가 숫자인 경우에만 보존한다.
# 로컬에서는 호스트 5173 -> Nginx 컨테이너 80으로 연결되므로
# 외부 포트 헤더를 80으로 만들지 않고 비워 둔다.
# 이 경우 Spring은 Host: localhost:5173에 포함된 포트 5173을 사용한다.
map $http_x_forwarded_port $external_port {
    default '';
    ~^[0-9]+$ $http_x_forwarded_port;
}

# Spring으로 요청을 보낼 내부 목적지를 finmate_backend라는 이름으로 묶는다.
# Docker Compose에서 사용하는 백엔드 서비스이름(backend)에 finmate_backend라는
upstream finmate_backend {
    # backend는 실제로 생성된 긴 컨테이너 이름이 아니라 Compose의 서비스 이름이다.
    # Compose가 nginx와 backend를 같은 기본 네트워크에 연결하고 내부 DNS에
    # backend라는 이름을 등록하므로 Nginx는 Spring 컨테이너 IP를 몰라도 된다.
    #
    # 8080은 호스트의 포트가 아니라 Spring 컨테이너 내부에서
    # Spring Boot(Tomcat)가 HTTP 요청을 기다리는 포트다.
    # 따라서 backend:8080은 "backend 서비스의 8080번 포트"라는 뜻이다.
    server backend:8080;

    # Nginx와 Spring 사이의 연결을 최대 16개까지 재사용한다.
    keepalive 16;
}

# Nginx 서버에 대한 설정
server {
    # Nginx 컨테이너 내부에서는 80번 포트로 요청을 받는다.
    # 아래 listen은 컨테이너 내부 포트만 지정하며, 호스트에 공개하지는 않는다.
    # Compose의 ports: "5173:80"이 로컬 호스트 5173을 이 내부 80에 연결한다.
    #
    # 브라우저 -> localhost:5173 -> Nginx 컨테이너:80
    # Nginx    -> backend:8080    -> Spring 컨테이너의 Spring Boot
    # localhost의 5173 포트와 Nginx 컨테이너의 80포트를 연결한다. 따라서 외부에서 Nginx 서버에 접근할 수 있다.
    listen 80;

    # localhost와 실제 도메인 등 모든 Host를 이 server 설정으로 처리한다.
    server_name _;

    # frontend Dockerfile이 React 빌드 결과(dist)를 복사해 둔 위치다.
    # react 파일 빌드 결과가 저장된 위치들을 지정
    root /usr/share/nginx/html;
    # / 요청(기본 경로 요청)이 들어오면 기본적으로 index.html을 제공해준다.
    index index.html;

    # Nginx가 직접 요청을 처리할 경로(빌드된 리엑트파일(Html, Css, js)등을 사용자에게 전달한다)
    # /assets 아래의 빌드된 JavaScript와 CSS는 Nginx가 직접 제공한다.
    # Vite는 파일 내용이 바뀌면 파일명 해시도 바꾸므로 장기간 캐시해도 안전하다.
    location /assets/ {
        # 요청한 파일이 없으면 React로 넘기지 않고 404를 반환한다.
        try_files $uri =404;
        expires 1y;
        add_header Cache-Control "public, immutable";
    }

    # 다음 경로는 React 화면이 아니라 Spring이 처리한다.
    # 예: /api/session, /oauth2/authorization/google,
    #     /login/oauth2/code/google, /ws/stocks
    location ~ ^/(api/|oauth2/|login/oauth2/|ws/) {
        # Docker 내부 네트워크를 통해 위의 backend:8080으로 원래 URI를 전달한다.
        # 이 연결에는 호스트의 127.0.0.1:8080 포트 매핑을 사용하지 않는다.
        # 예: /api/session -> http://backend:8080/api/session
        # Nginx가 받은 요청을 Spring 컨테이너로 전달한다.
        proxy_pass http://finmate_backend;

        # WebSocket 업그레이드와 연결 재사용을 위해 HTTP/1.1을 사용한다.
        proxy_http_version 1.1;

        # 사용자가 접속한 외부 주소 정보를 Spring에 전달한다.
        # $http_host는 localhost:5173처럼 포트까지 포함한 원래 Host다.
        # 사용자의 원본 요청정보(요청주소, 프로토콜, 포트번호)등을 Spring 컨테이너에게 함께 전달한다.
        proxy_set_header Host $http_host;
        proxy_set_header X-Forwarded-Host $http_host;
        proxy_set_header X-Forwarded-Proto $external_proto;
        proxy_set_header X-Forwarded-Port $external_port;

        # Spring 로그·추적·보안 처리에 사용할 수 있도록 클라이언트 IP를 전달한다.
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;

        # WebSocket 요청이면 HTTP 연결을 WebSocket 연결로 업그레이드한다.
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection $connection_upgrade;

        # 실시간 시세·채팅 연결이 일반 HTTP보다 오래 유지될 수 있게 한다.
        proxy_read_timeout 3600s;
    }

    # /logout은 React 화면이 아니라 Spring Security가 처리한다.
    # Spring이 로그인 세션과 JSESSIONID 쿠키를 정리한다.
    location = /logout {
        proxy_pass http://finmate_backend;
        proxy_http_version 1.1;

        # 로그아웃 후 Spring이 올바른 외부 주소로 redirect하도록 전달한다.
        # 사용자의 원본 요청정보(요청주소, 프로토콜, 포트번호)등을 Spring 컨테이너에게 함께 전달한다.
        proxy_set_header Host $http_host;
        proxy_set_header X-Forwarded-Host $http_host;
        proxy_set_header X-Forwarded-Proto $external_proto;
        proxy_set_header X-Forwarded-Port $external_port;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    }

    # 같은 /login 경로라도 HTTP 메서드에 따라 처리 주체가 다르다.
    # - GET  /login -> React 로그인 화면(index.html)
    # - POST /login -> Spring Security의 아이디·비밀번호 인증
    location = /login {
        # POST일 때 만든 내부 분기 값 418을 @spring_login으로 연결한다.
        # 브라우저에 실제 418 오류를 반환하는 용도가 아니다.
        error_page 418 = @spring_login;
        if ($request_method = POST) {
            return 418;
        }

        # GET /login에는 React 앱의 시작 파일(index.html)을 제공한다.
        try_files /index.html =404;
    }

    # POST /login 요청만 도착하는 Nginx 내부 전용 위치다.
    location @spring_login {
        proxy_pass http://finmate_backend;
        proxy_http_version 1.1;

        # 로그인 성공·실패 후 Spring redirect가 외부 주소를 사용하도록 전달한다.
        proxy_set_header Host $http_host;
        proxy_set_header X-Forwarded-Host $http_host;
        proxy_set_header X-Forwarded-Proto $external_proto;
        proxy_set_header X-Forwarded-Port $external_port;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    }

    # 앞의 Spring 전달 규칙에 해당하지 않는 화면 요청은 React가 처리한다.
    # /home 같은 실제 파일은 없으므로 index.html을 제공하고,
    # 이후 React Router가 현재 URL에 맞는 화면을 선택한다.
    location / {
        try_files $uri $uri/ /index.html;
    }
}
