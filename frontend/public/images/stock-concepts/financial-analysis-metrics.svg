<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 720 360" role="img" aria-labelledby="title desc">
  <title id="title">YoY QoQ TTM 런레이트와 컨센서스</title>
  <desc id="desc">최신 분기 실적을 과거 분기와 비교하고 최근 네 분기를 합하거나 연환산한 뒤 시장 컨센서스와 비교합니다.</desc>
  <rect width="720" height="360" rx="24" fill="#f7faff"/>
  <text x="36" y="42" fill="#1e3a8a" font-family="Pretendard, sans-serif" font-size="21" font-weight="800">실적을 네 가지 기준과 시장 기대에 비춰보기</text>
  <text x="36" y="68" fill="#64748b" font-family="Pretendard, sans-serif" font-size="14">실제 성장, 최근 속도, 시장이 기대한 수준은 서로 다른 질문입니다.</text>
  <g font-family="Pretendard, sans-serif">
    <g fill="#fff" stroke="#bfdbfe">
      <rect x="38" y="105" width="118" height="82" rx="15"/><rect x="170" y="105" width="118" height="82" rx="15"/>
      <rect x="302" y="105" width="118" height="82" rx="15"/><rect x="434" y="105" width="118" height="82" rx="15"/>
    </g>
    <g text-anchor="middle">
      <text x="97" y="133" fill="#2563eb" font-size="17" font-weight="900">YoY</text><text x="97" y="159" fill="#475569" font-size="12" font-weight="700">전년 같은 분기</text><text x="97" y="176" fill="#64748b" font-size="11">와 비교</text>
      <text x="229" y="133" fill="#2563eb" font-size="17" font-weight="900">QoQ</text><text x="229" y="159" fill="#475569" font-size="12" font-weight="700">직전 분기</text><text x="229" y="176" fill="#64748b" font-size="11">와 비교</text>
      <text x="361" y="133" fill="#2563eb" font-size="17" font-weight="900">TTM</text><text x="361" y="159" fill="#475569" font-size="12" font-weight="700">최근 실제</text><text x="361" y="176" fill="#64748b" font-size="11">4개 분기 합계</text>
      <text x="493" y="133" fill="#2563eb" font-size="17" font-weight="900">런레이트</text><text x="493" y="159" fill="#475569" font-size="12" font-weight="700">최신 분기 × 4</text><text x="493" y="176" fill="#64748b" font-size="11">단순 연환산</text>
    </g>
    <path d="M571 146h31" stroke="#60a5fa" stroke-width="3" stroke-linecap="round"/><path d="m594 138 9 8-9 8" fill="none" stroke="#60a5fa" stroke-width="3"/>
    <rect x="612" y="105" width="72" height="82" rx="15" fill="#2563eb"/>
    <text x="648" y="135" text-anchor="middle" fill="#dbeafe" font-size="12" font-weight="800">실제 실적</text>
    <text x="648" y="160" text-anchor="middle" fill="#fff" font-size="14" font-weight="900">420만</text>
    <rect x="76" y="229" width="568" height="86" rx="20" fill="#fff" stroke="#93c5fd"/>
    <text x="112" y="260" fill="#64748b" font-size="13" font-weight="800">시장 컨센서스</text>
    <text x="112" y="290" fill="#0f172a" font-size="22" font-weight="900">380만</text>
    <text x="250" y="281" fill="#2563eb" font-size="28" font-weight="900">→</text>
    <rect x="288" y="248" width="142" height="48" rx="14" fill="#dbeafe"/>
    <text x="359" y="278" text-anchor="middle" fill="#1d4ed8" font-size="15" font-weight="900">예상보다 +40만</text>
    <rect x="455" y="248" width="153" height="48" rx="14" fill="#eff6ff" stroke="#bfdbfe"/>
    <text x="531" y="278" text-anchor="middle" fill="#1e40af" font-size="15" font-weight="900">컨센서스 상회</text>
  </g>
</svg>
