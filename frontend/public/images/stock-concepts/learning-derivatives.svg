<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 420" role="img" aria-labelledby="title desc"><title id="title">공매도, 선물과 옵션</title><desc id="desc">빌린 주식을 먼저 파는 공매도, 미래 거래 의무인 선물, 미래 거래 권리인 옵션 비교</desc><rect width="900" height="420" rx="28" fill="#f8fafc"/><text x="48" y="60" font-size="28" font-weight="700" fill="#0f172a">하락 대응과 미래 가격을 다루는 세 가지 구조</text><g font-family="sans-serif" text-anchor="middle"><rect x="45" y="125" width="250" height="210" rx="24" fill="#fff" stroke="#93c5fd" stroke-width="4"/><text x="170" y="178" font-size="25" font-weight="700" fill="#1d4ed8">공매도</text><text x="170" y="222" font-size="18" fill="#475569">빌려서 먼저 매도</text><text x="170" y="258" font-size="18" fill="#475569">나중에 매수해 상환</text><text x="170" y="306" font-size="18" font-weight="700" fill="#1d4ed8">가격 하락 시 이익 가능</text><rect x="325" y="125" width="250" height="210" rx="24" fill="#fff" stroke="#5eead4" stroke-width="4"/><text x="450" y="178" font-size="25" font-weight="700" fill="#0f766e">선물</text><text x="450" y="222" font-size="18" fill="#475569">미래 가격을 지금 계약</text><text x="450" y="258" font-size="18" fill="#475569">매수·매도자 모두 의무</text><text x="450" y="306" font-size="18" font-weight="700" fill="#0f766e">증거금·일일정산</text><rect x="605" y="125" width="250" height="210" rx="24" fill="#fff" stroke="#c4b5fd" stroke-width="4"/><text x="730" y="178" font-size="25" font-weight="700" fill="#6d28d9">옵션</text><text x="730" y="222" font-size="18" fill="#475569">미래 매매 권리를 거래</text><text x="730" y="258" font-size="18" fill="#475569">매수자는 행사 선택</text><text x="730" y="306" font-size="18" font-weight="700" fill="#6d28d9">권리 가격 = 프리미엄</text></g></svg>
