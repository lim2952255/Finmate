<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 420" role="img" aria-labelledby="title desc"><title id="title">분산, 자산배분과 리밸런싱</title><desc id="desc">서로 다르게 움직이는 여러 자산을 목표 비중으로 배분하고 다시 맞추는 과정</desc><rect width="900" height="420" rx="28" fill="#f0fdfa"/><text x="48" y="60" font-size="28" font-weight="700" fill="#134e4a">한 바구니보다 서로 다른 여러 축으로 나눕니다</text><circle cx="225" cy="225" r="125" fill="#fff" stroke="#99f6e4" stroke-width="4"/><path d="M225 225V100A125 125 0 0 1 333 288Z" fill="#2563eb"/><path d="M225 225 333 288A125 125 0 0 1 125 300Z" fill="#14b8a6"/><path d="M225 225 125 300A125 125 0 0 1 225 100Z" fill="#f59e0b"/><text x="225" y="386" text-anchor="middle" font-size="19" font-weight="700" fill="#334155">주식 · 채권 · 현금</text><path d="M390 220h100" stroke="#0f766e" stroke-width="8"/><path d="m475 200 30 20-30 20" fill="#0f766e"/><rect x="520" y="115" width="330" height="220" rx="25" fill="white" stroke="#5eead4" stroke-width="4"/><text x="685" y="168" text-anchor="middle" font-size="24" font-weight="700" fill="#115e59">목표 비중</text><text x="560" y="217" font-size="18" fill="#475569">① 변한 비중 확인</text><text x="560" y="258" font-size="18" fill="#475569">② 너무 커진 자산 줄이기</text><text x="560" y="299" font-size="18" fill="#475569">③ 부족한 자산 채우기</text></svg>
