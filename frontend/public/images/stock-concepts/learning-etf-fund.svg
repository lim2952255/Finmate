<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 420" role="img" aria-labelledby="title desc"><title id="title">ETF와 펀드, NAV와 시장가격</title><desc id="desc">여러 자산을 담은 바구니의 순자산가치와 거래소에서 형성되는 ETF 시장가격 비교</desc><rect width="900" height="420" rx="28" fill="#f5f3ff"/><text x="48" y="60" font-size="28" font-weight="700" fill="#312e81">같은 자산 바구니도 거래 방식이 다릅니다</text><rect x="60" y="115" width="300" height="210" rx="24" fill="#fff" stroke="#c4b5fd" stroke-width="4"/><text x="210" y="162" text-anchor="middle" font-size="25" font-weight="700" fill="#5b21b6">펀드·ETF 자산 바구니</text><g fill="#ddd6fe"><circle cx="135" cy="230" r="34"/><circle cx="210" cy="230" r="34"/><circle cx="285" cy="230" r="34"/></g><text x="135" y="238" text-anchor="middle" font-size="16">주식</text><text x="210" y="238" text-anchor="middle" font-size="16">채권</text><text x="285" y="238" text-anchor="middle" font-size="16">현금</text><path d="M390 220h90" stroke="#7c3aed" stroke-width="8"/><path d="m465 200 30 20-30 20" fill="#7c3aed"/><rect x="520" y="105" width="320" height="235" rx="24" fill="#fff" stroke="#a78bfa" stroke-width="4"/><text x="680" y="155" text-anchor="middle" font-size="24" font-weight="700" fill="#4c1d95">ETF 가격 확인</text><text x="560" y="210" font-size="19" fill="#475569">NAV: 보유자산의 주당 가치</text><text x="560" y="250" font-size="19" fill="#475569">시장가격: 거래소 체결 가격</text><text x="560" y="296" font-size="19" font-weight="700" fill="#7c3aed">두 값의 차이 = 괴리</text></svg>
