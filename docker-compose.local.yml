# 로컬에서 Nginx + Spring + MySQL + Redis 전체 구성을 확인하는 Compose다.
# Nginx(React) + Spring + MySQL + Redis 컨테이너를 하나로 관리한다.
# Docker Compose를 구성하면 Docker Compose가 내부 사설 네트워클르 생성하고, 해당 네트워크 내부에서 서비스들을 연결한다.
# 이 덕분에 Docker Compose로 묶은 도커 컨테이너끼리 통신이 가능하다.
name: finmate-local

# compose로 관리할 컨테이너들을 지정한다.
services:
  # React 운영 빌드 결과를 제공하고 백엔드 요청을 Spring으로 전달하는 Nginx 컨테이너
  nginx:
    build:
      context: ./frontend
      dockerfile: Dockerfile.local
    restart: unless-stopped

    # 로컬 기본 포트는 기존 Vite 주소와 같은 5173이다.
    # 로컬의 5173 포트를 Nginx 컨테이너의 80 포트와 연결한다.
    # Backend나 Redis, Mysql 컨테이너는 외부 사용자가 접속하지 못하도록 포트를 공개하지않는다.
    # Backend나 Redis, Mysql 컨테이너는 Docker 내부 네트워크를 통해서만 접근할 수 있다.
    ports:
      - "${FINMATE_HTTP_PORT:-5173}:80"

    # backend 컨테이너가 시작된 뒤 Nginx를 실행한다.
    # Spring이 준비되는 짧은 동안에는 502가 날 수 있지만 Nginx는 계속 재시도할 수 있다.
    depends_on:
      backend:
        condition: service_started

    healthcheck:
      test: ["CMD-SHELL", "wget -q -O /dev/null http://127.0.0.1/ || exit 1"]
      interval: 10s
      timeout: 5s
      retries: 10

  # FinMate Spring Boot 애플리케이션 컨테이너
  backend:
    # 로컬용 Dockerfile을 사용해 Spring 이미지를 직접 만든다.
    build:
      context: .
      dockerfile: Dockerfile.local
    # 컨테이너가 꺼졌을때 다시 실행하는 설정
    restart: unless-stopped

    # 직접 백엔드를 확인할 수 있도록 호스트의 loopback에만 공개한다.
    # 실제 사용자 요청은 위 Nginx를 통해 들어온다.
    ports:
      - "127.0.0.1:8080:8080"

    # 로컬 Spring 실행과 공통으로 사용하는 .env의 환경변수를
    # Spring 컨테이너에도 전달한다.
    env_file:
      - .env

    volumes:
      # 호스트에 다운로드한 E5 모델을 컨테이너에서도 같은 경로로 읽을 수 있게 연결한다.
      - ./models/multilingual-e5-small:/app/models/multilingual-e5-small:ro
      # 최종 종목 뉴스의 호재·보통·악재 판정에 사용할 양자화 KR-FinBert-SC 모델이다.
      - ./models/kr-finbert-sentiment:/app/models/kr-finbert-sentiment:ro

    environment:
      # 컨테이너 안의 localhost는 Spring 자신이다.
      # 같은 Compose 네트워크에 있는 MySQL은 서비스 이름 mysql로 찾는다.
      SPRING_DATASOURCE_URL: jdbc:mysql://mysql:3306/${MYSQL_DATABASE}?serverTimezone=Asia/Seoul&useUnicode=true&characterEncoding=UTF-8&connectionCollation=utf8mb4_unicode_ci
      SPRING_DATASOURCE_USERNAME: ${MYSQL_USER}
      SPRING_DATASOURCE_PASSWORD: ${MYSQL_PASSWORD}

      # Redis도 IP 대신 Compose 서비스 이름 redis로 찾는다.
      REDIS_HOST: redis
      REDIS_PORT: 6379
      REDIS_PASSWORD: ${REDIS_PASSWORD}

    # MySQL과 Redis가 단순히 실행 중인 상태를 넘어 healthcheck를 통과한 뒤
    # Spring 컨테이너를 시작한다.
    # Spring 컨테이너는 단독으로 실행되는것이 아니라, MySQL과 Redis가 실제로 실행된 이후에 실행된다.
    depends_on:
      mysql:
        condition: service_healthy
      redis:
        condition: service_healthy

  # Spring이 데이터를 영구 저장하는 MySQL 컨테이너
  mysql:
    image: mysql:8.4
    restart: unless-stopped
    environment:
      MYSQL_ROOT_PASSWORD: ${MYSQL_ROOT_PASSWORD}
      MYSQL_DATABASE: ${MYSQL_DATABASE}
      MYSQL_USER: ${MYSQL_USER}
      MYSQL_PASSWORD: ${MYSQL_PASSWORD}
      TZ: Asia/Seoul
    command:
      - --character-set-server=utf8mb4
      - --collation-server=utf8mb4_unicode_ci
      - --default-time-zone=+09:00

    # IDE에서 Spring을 직접 실행할 때도 이 Compose의 MySQL을 사용한다.
    ports:
      - "127.0.0.1:${MYSQL_PORT:-3306}:3306"

    # 컨테이너를 다시 만들어도 DB 데이터가 남도록 별도 볼륨에 저장한다.
    volumes:
      - mysql-data:/var/lib/mysql

    # MySQL이 실제 연결을 받을 준비가 되었는지 주기적으로 확인한다.
    # Healthcheck는 해당 컨테이너가 실행할 준비가 되었는지를 검사한다.
    healthcheck:
      test: ["CMD-SHELL", "mysqladmin ping -h 127.0.0.1 -u$$MYSQL_USER -p$$MYSQL_PASSWORD --silent"]
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 30s

  # Spring의 캐시 저장소로 사용하는 Redis 컨테이너
  redis:
    image: redis:7.2
    restart: unless-stopped

    # IDE에서 Spring을 직접 실행할 때도 이 Compose의 Redis를 사용한다.
    ports:
      - "127.0.0.1:${REDIS_PORT:-6379}:6379"

    # AOF 영속화를 켜고 비밀번호 인증을 요구한다.
    command:
      - redis-server
      - --appendonly
      - "yes"
      - --requirepass
      - ${REDIS_PASSWORD}

    # 컨테이너를 다시 만들어도 Redis 데이터를 유지한다.
    volumes:
      - redis-data:/data

    # 비밀번호로 Redis에 접속해 PONG이 반환되는지 확인한다.
    healthcheck:
      test: ["CMD-SHELL", "REDISCLI_AUTH=$$REDIS_PASSWORD redis-cli ping | grep PONG"]
      interval: 10s
      timeout: 5s
      retries: 10
    environment:
      REDIS_PASSWORD: ${REDIS_PASSWORD}

# 서비스 수명과 분리된 Docker 관리 볼륨이다.
# `docker compose down`에는 남지만 `docker compose down -v`에는 삭제된다.
volumes:
  mysql-data:
  redis-data:
