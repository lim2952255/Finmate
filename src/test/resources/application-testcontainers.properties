# The container is new for each test JVM and shared by all cached Spring contexts.
# Explicit update creates the schema once without repeated startup/shutdown drops.
spring.jpa.hibernate.ddl-auto=update
spring.sql.init.mode=never

# Scheduled integrations must not reach live KIS services during tests.
finmate.trading.expiration-enabled=false
finmate.stock-master.domestic-sync-cron=-
finmate.stock-master.nasdaq-sync-cron=-
finmate.stock-ranking.initial-delay-millis=86400000
finmate.market-realtime.initial-delay-millis=86400000
finmate.kis.base-url=http://127.0.0.1:1
finmate.kis.web-socket-url=ws://127.0.0.1:1
