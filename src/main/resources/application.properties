spring.application.name=finmate
spring.config.import=optional:file:.env[.properties]

spring.datasource.url=${SPRING_DATASOURCE_URL:jdbc:mysql://localhost:3306/finmate?serverTimezone=Asia/Seoul&useUnicode=true&characterEncoding=utf8mb4&connectionCollation=utf8mb4_unicode_ci}
spring.datasource.username=${SPRING_DATASOURCE_USERNAME:finmate}
spring.datasource.password=${SPRING_DATASOURCE_PASSWORD:finmate-password}
spring.datasource.driver-class-name=com.mysql.cj.jdbc.Driver

spring.data.redis.host=localhost
spring.data.redis.port=6379
spring.data.redis.password=${REDIS_PASSWORD:}
spring.data.redis.repositories.enabled=false

# Google OAuth2/OIDC 로그인
finmate.oauth.google.enabled=${GOOGLE_OAUTH_ENABLED:false}
finmate.oauth.google.client-id=${GOOGLE_CLIENT_ID:}
finmate.oauth.google.client-secret=${GOOGLE_CLIENT_SECRET:}

# Kakao OAuth2/OIDC 로그인
finmate.oauth.kakao.enabled=${KAKAO_OAUTH_ENABLED:false}
finmate.oauth.kakao.client-id=${KAKAO_CLIENT_ID:}
finmate.oauth.kakao.client-secret=${KAKAO_CLIENT_SECRET:}

# Naver OAuth2 로그인
finmate.oauth.naver.enabled=${NAVER_OAUTH_ENABLED:false}
finmate.oauth.naver.client-id=${NAVER_CLIENT_ID:}
finmate.oauth.naver.client-secret=${NAVER_CLIENT_SECRET:}

# 한국투자증권 API
finmate.kis.base-url=${KIS_BASE_URL:https://openapi.koreainvestment.com:9443}
finmate.kis.app-key=${KIS_APP_KEY:}
finmate.kis.app-secret=${KIS_APP_SECRET:}
finmate.kis.request-interval-millis=${KIS_REQUEST_INTERVAL_MILLIS:700}
finmate.kis.web-socket-url=${KIS_WEBSOCKET_URL:ws://ops.koreainvestment.com:21000}
finmate.kis.web-socket-path=${KIS_WEBSOCKET_PATH:/tryitout}
finmate.kis.realtime-unsubscribe-grace-millis=${KIS_REALTIME_UNSUBSCRIBE_GRACE_MILLIS:60000}

# 국내 종목 상세 KIS 데이터의 API 종류별 신선도
# 장중 현재가는 Redis/JVM fallback 캐시에만 저장하고 WebSocket 수신값이 화면에서 우선한다.
finmate.stock-detail.current-quote-cache-seconds=${STOCK_DETAIL_CURRENT_QUOTE_CACHE_SECONDS:10}
finmate.stock-detail.financial-refresh-seconds=${STOCK_DETAIL_FINANCIAL_REFRESH_SECONDS:86400}
finmate.stock-detail.investor-refresh-seconds=${STOCK_DETAIL_INVESTOR_REFRESH_SECONDS:600}

# 종목 마스터 동기화
finmate.stock-master.domestic-sync-cron=${STOCK_MASTER_DOMESTIC_SYNC_CRON:0 0 8 * * MON-FRI}
finmate.stock-master.domestic-sync-zone=${STOCK_MASTER_DOMESTIC_SYNC_ZONE:Asia/Seoul}
finmate.stock-master.nasdaq-sync-cron=${STOCK_MASTER_NASDAQ_SYNC_CRON:0 0 8 * * MON-FRI}
finmate.stock-master.nasdaq-sync-zone=${STOCK_MASTER_NASDAQ_SYNC_ZONE:America/New_York}

# NXT 거래대상 종목 및 세션별 거래 허용 정보 동기화
finmate.nxt.sync-enabled=${NXT_SYNC_ENABLED:true}
finmate.nxt.market-data-url=${NXT_MARKET_DATA_URL:https://www.nextrade.co.kr/brdinfoTime/brdinfoTimeList.do}
finmate.nxt.sync-cron=${NXT_SYNC_CRON:0 50 7 * * MON-FRI}
finmate.nxt.sync-zone=${NXT_SYNC_ZONE:Asia/Seoul}

# 거래량/거래대금 TOP10 캐시
finmate.stock-ranking.refresh-interval-millis=${STOCK_RANKING_REFRESH_INTERVAL_MILLIS:10000}
finmate.stock-ranking.initial-delay-millis=${STOCK_RANKING_INITIAL_DELAY_MILLIS:100}
finmate.stock-ranking.open-cache-ttl-seconds=${STOCK_RANKING_OPEN_CACHE_TTL_SECONDS:30}
finmate.stock-ranking.closed-cache-ttl-seconds=${STOCK_RANKING_CLOSED_CACHE_TTL_SECONDS:86400}

# 실시간 환율/해외지수 캐시
finmate.market-realtime.refresh-interval-millis=${MARKET_REALTIME_REFRESH_INTERVAL_MILLIS:60000}
finmate.market-realtime.initial-delay-millis=${MARKET_REALTIME_INITIAL_DELAY_MILLIS:1000}
finmate.market-realtime.cache-ttl-seconds=${MARKET_REALTIME_CACHE_TTL_SECONDS:120}

# 주문·예약 만료 복구
finmate.trading.expiration-enabled=${TRADING_EXPIRATION_ENABLED:true}
finmate.trading.expiration-interval-millis=${TRADING_EXPIRATION_INTERVAL_MILLIS:10000}
finmate.trading.expiration-initial-delay-millis=${TRADING_EXPIRATION_INITIAL_DELAY_MILLIS:0}

# 엔티티 변경 사항을 DB table에 반영
spring.jpa.hibernate.ddl-auto=update
# 실행 SQL 출력
spring.jpa.show-sql=false
# SQL을 포멧에 맞춰서 출력
spring.jpa.properties.hibernate.format_sql=true

logging.level.org.hibernate.SQL=warn
# logging.level.org.hibernate.orm.jdbc.bind=trace
