<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>FinMate</title>
    <link rel="stylesheet" th:href="@{/css/common.css}">
</head>
<body>
<div class="page">
    <div th:replace="~{/layout/header :: header}"></div>

    <main class="main">
        <section class="auth-card">
            <div class="auth-intro">
                <a class="auth-brand" th:href="@{/home}">
                    <span class="logo-mark" aria-hidden="true">
                        <span></span><span></span><span></span>
                    </span>
                    FinMate
                </a>
                <span class="eyebrow">START FINMATE</span>
                <h1>금융 생활의 흐름을<br>한곳에서 시작하세요.</h1>
                <p>계좌부터 투자 자산과 시장 정보까지, 내 금융 데이터를 이어서 관리할 수 있습니다.</p>
                <div class="auth-highlight-list" aria-label="FinMate 가입 후 이용 기능">
                    <span><i aria-hidden="true">✓</i> 은행·증권 계좌 통합 관리</span>
                    <span><i aria-hidden="true">✓</i> 주문과 포트폴리오 한눈에 확인</span>
                    <span><i aria-hidden="true">✓</i> 실제 종목 데이터로 금융 개념 학습</span>
                </div>
            </div>

            <div class="auth-form-panel">
                <div class="auth-heading">
                    <span class="eyebrow">CREATE ACCOUNT</span>
                    <h2>회원가입</h2>
                    <p>기본 정보를 입력하고 FinMate를 시작하세요.</p>
                </div>

                <!-- 이제 Thymeleaf template에서도 DTO객체를 받는다.-->
                <form class="auth-form" th:action="@{/signup}" th:object="${signupRequest}" method="post">
                    <p class="alert alert-error"
                       th:if="${#fields.hasGlobalErrors()}"
                       th:each="error : ${#fields.globalErrors()}"
                       th:text="${error}">
                        회원가입 오류
                    </p>

                    <div class="field-group">
                        <label for="username">이름</label>
                        <input id="username" type="text" th:field="*{username}"
                               autocomplete="name" placeholder="이름을 입력하세요">
                        <!-- 필드 에러 발생시 해당 오류를 표시-->
                        <p class="field-error" th:if="${#fields.hasErrors('username')}" th:errors="*{username}"></p>
                    </div>

                    <div class="field-group">
                        <label for="telephone">전화번호</label>
                        <input id="telephone" type="tel" th:field="*{telephone}"
                               autocomplete="tel" placeholder="010-0000-0000">
                        <!-- 필드 에러 발생시 해당 오류를 표시-->
                        <p class="field-error" th:if="${#fields.hasErrors('telephone')}" th:errors="*{telephone}"></p>
                    </div>

                    <div class="field-group">
                        <label for="email">이메일</label>
                        <input id="email" type="email" th:field="*{email}"
                               autocomplete="email" placeholder="example@finmate.com">
                        <!-- 필드 에러 발생시 해당 오류를 표시-->
                        <p class="field-error" th:if="${#fields.hasErrors('email')}" th:errors="*{email}"></p>
                    </div>

                    <div class="field-group">
                        <label for="userId">아이디</label>
                        <input id="userId" type="text" th:field="*{userId}"
                               autocomplete="username" placeholder="로그인 아이디를 입력하세요">
                        <!-- 필드 에러 발생시 해당 오류를 표시-->
                        <p class="field-error" th:if="${#fields.hasErrors('userId')}" th:errors="*{userId}"></p>
                    </div>

                    <div class="field-group">
                        <label for="password">비밀번호</label>
                        <input id="password" type="password" th:field="*{password}"
                               autocomplete="new-password" placeholder="비밀번호를 입력하세요">
                        <!-- 필드 에러 발생시 해당 오류를 표시-->
                        <p class="field-error" th:if="${#fields.hasErrors('password')}" th:errors="*{password}"></p>
                    </div>

                    <button class="auth-submit" type="submit">가입하기</button>
                </form>

                <p class="auth-signup">이미 계정이 있나요? <a th:href="@{/login}">로그인</a></p>
            </div>
        </section>
    </main>
</div>
</body>
</html>
