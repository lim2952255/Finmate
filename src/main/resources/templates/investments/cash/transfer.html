<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>FinMate</title>
    <link rel="stylesheet" th:href="@{/css/common.css}">
    <style>
        .transfer-page {
            gap: 18px;
        }

        .transfer-account-panel {
            padding: 22px;
        }

        .transfer-section-header {
            display: flex;
            align-items: flex-end;
            justify-content: space-between;
            gap: 16px;
            margin-bottom: 16px;
        }

        .transfer-section-header h2 {
            margin-bottom: 5px;
        }

        .transfer-section-header p {
            margin: 0;
            font-size: 13px;
        }

        .transfer-account-table {
            min-width: 820px;
        }

        .transfer-account-table th,
        .transfer-account-table td {
            vertical-align: middle;
        }

        .transfer-account-table tbody td {
            padding-top: 14px;
            padding-bottom: 14px;
        }

        .transfer-balance-list {
            display: flex;
            flex-wrap: wrap;
            gap: 7px;
            margin: 0;
            padding: 0;
            list-style: none;
        }

        .transfer-balance-list li {
            display: inline-flex;
            align-items: baseline;
            gap: 5px;
            padding: 6px 9px;
            border: 1px solid #dbe5f0;
            border-radius: 9px;
            background: #f8fafc;
            font-variant-numeric: tabular-nums;
            white-space: nowrap;
        }

        .transfer-balance-list strong {
            color: var(--color-heading);
        }

        .transfer-balance-list small {
            color: var(--color-muted);
            font-weight: 800;
        }

        .transfer-account-number {
            font-variant-numeric: tabular-nums;
            white-space: nowrap;
        }

        .transfer-primary-status {
            display: inline-flex;
            padding: 5px 9px;
            border-radius: 999px;
            background: #eff6ff;
            color: #1d4ed8;
            font-size: 12px;
            font-weight: 850;
        }

        .transfer-table-action {
            text-align: center;
        }
    </style>
</head>
<body>
<div class="page">
    <div th:replace="~{/layout/header :: header}"></div>

    <main class="main">
        <section class="content transfer-page">
            <div class="page-heading">
                <span class="eyebrow">CASH TRANSFER</span>
                <h1>증권계좌 투자금 이체</h1>
                <p>출금할 증권계좌의 사용 가능한 예수금을 확인하고 이체를 시작합니다.</p>
            </div>

            <p class="error-message" th:if="${errorMessage != null}" th:text="${errorMessage}">오류 메시지</p>

            <section class="transfer-account-panel">
                <div class="transfer-section-header">
                    <div>
                        <h2>출금 증권계좌 선택</h2>
                        <p>통화별 사용 가능 잔액을 확인한 뒤 이체할 계좌를 선택하세요.</p>
                    </div>
                </div>

                <div class="empty-state" th:if="${#lists.isEmpty(investmentWithdrawalPageInfo.investments)}">
                    <strong>출금에 사용할 증권계좌가 없습니다</strong>
                    <p>증권계좌를 개설하면 계좌별 예수금을 이체할 수 있습니다.</p>
                    <a th:href="@{/investments/open}">증권 계좌 개설하기</a>
                </div>

                <div class="table-scroll" th:unless="${#lists.isEmpty(investmentWithdrawalPageInfo.investments)}">
                <table class="records-table transfer-account-table">
                    <thead>
                    <tr>
                        <th>증권사</th>
                        <th>계좌번호</th>
                        <th>예수금</th>
                        <th>대표계좌</th>
                        <th>이체</th>
                    </tr>
                    </thead>
                    <tbody>
                    <tr th:each="investment : ${investmentWithdrawalPageInfo.investments}">
                        <td>
                            <span class="primary-line" th:text="${investment.securitiesCompanyCode.displayName}">키움증권</span>
                        </td>
                        <td class="transfer-account-number" th:text="${investment.accountNumber}">000000-00-000000</td>
                        <td>
                            <ul class="transfer-balance-list">
                                <li th:each="cashBalance : ${investment.cashBalances}">
                                    <strong th:text="${#numbers.formatDecimal(cashBalance.availableBalance, 0, 'COMMA', cashBalance.currencyCode.fractionDigits, 'POINT')}">0</strong>
                                    <small th:text="${cashBalance.currencyCode.name()}">KRW</small>
                                </li>
                            </ul>
                        </td>
                        <td>
                            <span class="transfer-primary-status" th:if="${investment.primary}">대표계좌</span>
                            <span class="secondary-line" th:unless="${investment.primary}">일반계좌</span>
                        </td>
                        <td class="transfer-table-action">
                            <a class="table-action-link" th:href="@{/investments/transfer(from=${investment.accountNumber}, fromSecuritiesCompanyCode=${investment.securitiesCompanyCode})}">
                                이체
                            </a>
                        </td>
                    </tr>
                    </tbody>
                </table>
                </div>
            </section>

            <p class="action-row">
                <a th:href="@{/accounts/transfer-investment}">예수금 입금</a>
                <a th:href="@{/investments/currency-exchange}">환전</a>
                <a th:href="@{/investments/currency-exchange/transactions}">환전 내역</a>
                <a th:href="@{/investments/list}">내 증권 계좌 / 예수금</a>
                <a th:href="@{/investments}">투자 홈</a>
            </p>
        </section>
    </main>
</div>
</body>
</html>
