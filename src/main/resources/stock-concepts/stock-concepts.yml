concepts:
  - conceptCode: DAILY_CANDLE_CHART
    title: "일봉 차트 보는 법: 양봉·음봉과 네 가지 가격"
    summary: >-
      일봉 하나에는 하루 동안 형성된 시가·고가·저가·종가가 담깁니다.
      이 화면에서 빨간 양봉은 종가가 시가보다 높았던 날,
      파란 음봉은 종가가 시가보다 낮았던 날을 뜻합니다.
    detailedExplanation: >-
      일봉은 한 거래일의 가격 움직임을 하나의 봉으로 압축한 그림입니다.
      굵은 몸통은 시가와 종가 사이의 범위를, 몸통 위아래의 가는 꼬리는 장중 고가와 저가까지의 범위를 보여줍니다.

      시가는 그 거래일에 처음 체결된 가격이고 종가는 정규시장에서 마지막으로 결정된 가격입니다.
      고가는 그날 체결된 가격 중 가장 높은 값, 저가는 가장 낮은 값입니다.

      빨간 양봉은 종가가 시가보다 높은 경우입니다.
      몸통 아래쪽이 시가, 위쪽이 종가이며 위 꼬리 끝이 고가, 아래 꼬리 끝이 저가입니다.
      하루 동안 가격이 출발점보다 올라서 마감했다는 뜻이지만, 하루 내내 계속 상승했다는 의미는 아닙니다.

      파란 음봉은 종가가 시가보다 낮은 경우입니다.
      몸통 위쪽이 시가, 아래쪽이 종가이며 고가와 저가는 양봉과 마찬가지로 위아래 꼬리 끝에 표시됩니다.
      시가와 종가가 같거나 매우 가까우면 몸통이 가는 십자형에 가까워질 수 있습니다.

      시가와 종가는 보통 동시호가라고 부르는 단일가매매로 결정됩니다.
      여기서 동시는 모든 투자자가 같은 순간에 주문한다는 뜻이 아닙니다.
      일정 시간 동안 들어온 주문을 도착할 때마다 바로 체결하지 않고 한곳에 모아 두었다가,
      정해진 시각에 하나의 가격으로 한꺼번에 체결한다는 뜻입니다.

      KRX 정규시장에서는 오전 8시 30분부터 오전 9시까지 개장 단일가매매 주문을 모읍니다.
      이 시간에는 예상 체결가격이 계속 바뀔 수 있지만 실제 거래는 즉시 성사되지 않습니다.
      오전 9시가 되면 모인 매수·매도 주문을 비교해 하나의 가격을 정하고,
      그 가격으로 첫 거래가 체결되면서 그날의 시가가 됩니다.

      오전 9시부터 오후 3시 20분까지는 매수와 매도 가격이 맞을 때마다 거래가 이어지는 연속매매 구간입니다.
      이후 오후 3시 20분부터 오후 3시 30분까지는 다시 주문을 모으는 마감 단일가매매가 진행됩니다.
      오후 3시 30분에 하나의 가격으로 마지막 거래가 체결되고, 이 가격이 KRX 정규시장의 종가가 됩니다.

      단일가매매에서는 단순히 가장 높은 매수 주문이나 가장 낮은 매도 주문을 가격으로 정하지 않습니다.
      각 후보 가격마다 그 가격 이상에 사겠다는 수량과 그 가격 이하에 팔겠다는 수량을 모아 비교하고,
      매수와 매도가 가장 많이 만날 수 있는 가격을 찾습니다.

      예를 들어 10,000원에서는 30주, 10,100원에서는 70주,
      10,200원에서는 20주가 체결될 수 있다면 가장 많은 70주가 거래되는 10,100원이 유력한 단일가격이 됩니다.
      실제 시장에서는 체결 가능 수량이 같은 가격이 여러 개일 때 적용하는 추가 기준까지 사용해 최종 가격을 정합니다.

      밤사이 호재나 악재가 생기면 개장 전에 특정 방향의 주문이 많이 쌓일 수 있습니다.
      이 때문에 오전 9시에 결정되는 시가가 전일 종가와 크게 벌어지는 갭이 나타나기도 합니다.
    bakeryExample: >-
      이 개념카드는 빵집 예시 대신 위의 양봉·음봉 그림으로 시가·고가·저가·종가의 위치를 설명합니다.
    caution: >-
      국내 주식 화면에서는 일반적으로 상승 봉을 빨간색, 하락 봉을 파란색으로 표시하지만
      해외 서비스나 차트 설정에 따라 색상이 반대로 표시될 수 있으므로 범례를 먼저 확인해야 합니다.

      양봉 하나만으로 매수세가 계속 강하다고 단정하거나 음봉 하나만으로 하락 추세라고 판단할 수는 없습니다.
      봉의 위치와 크기, 거래량, 앞뒤 봉의 흐름을 함께 살펴봐야 합니다.

      시가·종가와 일봉의 집계 범위는 거래시장과 데이터 제공처의 기준에 따라 달라질 수 있습니다.
      위 시간은 KRX 정규시장 기준입니다. KRX와 NXT 통합 시세를 보는 경우에는
      해당 서비스가 어떤 시장과 장전·장후 세션을 일봉에 포함하는지 확인하는 것이 좋습니다.

  - conceptCode: PER
    title: "PER: 이익에 비해 주가가 몇 배인가"
    summary: >-
      PER은 현재 주가를 주당순이익(EPS)으로 나눈 값으로,
      시장이 회사의 이익에 비해 현재 주가를 몇 배 수준으로 평가하고 있는지를 보여주는 지표입니다.
    detailedExplanation: >-
      PER = 주가 ÷ EPS입니다.
      이때 EPS는 당기순이익 ÷ 주식 수이므로,
      PER = (주가 × 주식 수) ÷ 당기순이익 = 시가총액 ÷ 당기순이익으로도 표현할 수 있습니다.

      즉, PER은 회사 전체 기준으로 보면 시가총액이 연간 당기순이익의 몇 배인지를,
      한 주 기준으로 보면 현재 주가가 한 주당 순이익인 EPS의 몇 배인지를 나타냅니다.

      PER에는 현재 실적뿐만 아니라 미래 실적에 대한 시장의 기대도 반영될 수 있습니다.
      예를 들어 현재 EPS가 높더라도 앞으로 이익이 감소할 것으로 예상되면
      투자자들이 더 낮은 가격을 지불하려 할 수 있고, 그 결과 PER이 낮아질 수 있습니다.

      반대로 현재 EPS가 낮더라도 앞으로 이익이 크게 증가할 것으로 기대된다면
      현재 이익에 비해 주가가 높은 수준에서 형성될 수 있고, 그 결과 PER이 높아질 수 있습니다.

      따라서 같은 이익을 내는 회사라도 미래 성장 기대가 크면 더 높은 PER에 거래될 수 있고,
      실적 변동 위험이 크거나 미래 이익에 대한 기대가 낮다면 더 낮은 PER에 거래될 수 있습니다.

      PER이 낮다는 이유만으로 해당 주식이 반드시 저평가되었다고 단정할 수는 없습니다.
      같은 업종의 다른 회사, 회사의 성장률, 이익의 지속 가능성 등을 함께 살펴보는 것이 중요합니다.

    bakeryExample: >-
      빵집의 주식 한 주가 10만 원이고, 상장주식 수가 100개라고 가정해봅시다.

      빵집 전체의 시장가치인 시가총액은
      주가 × 상장주식 수이므로 10만 원 × 100주 = 1,000만 원입니다.

      이 빵집이 1년에 100만 원의 당기순이익을 벌었다면,
      EPS는 당기순이익 ÷ 주식 수이므로
      100만 원 ÷ 100주 = 1만 원입니다.

      따라서 PER은
      주가 ÷ EPS = 10만 원 ÷ 1만 원 = 10배가 됩니다.

      회사 전체 기준으로 계산해도
      시가총액 ÷ 당기순이익 = 1,000만 원 ÷ 100만 원 = 10배로 같은 결과가 나옵니다.

      즉, 현재 시장은 이 빵집 전체를 1년 동안 벌어들이는 당기순이익의 약 10배 가격으로
      평가하고 있다고 볼 수 있습니다.
      한 주 기준으로 보면 현재 주가가 한 주가 벌어들이는 순이익인 EPS의 10배라는 뜻입니다.

      다만 PER이 10배라고 해서 실제로 10년 뒤 투자금을 회수한다는 의미는 아닙니다.
      기업의 이익은 매년 달라질 수 있고, 당기순이익 전부가 주주에게 지급되는 것도 아니기 때문입니다.

      예를 들어 이 빵집이 올해는 100만 원을 벌었지만
      앞으로 경쟁이 심해져 이익이 크게 줄어들 것으로 예상된다면,
      투자자들이 이 빵집에 지불하려는 가격이 낮아질 수 있고 PER도 낮아질 수 있습니다.

      반대로 현재는 이익이 많지 않더라도
      앞으로 매장을 크게 늘리거나 매출과 이익이 빠르게 성장할 것으로 기대된다면,
      투자자들이 현재 이익보다 높은 가격을 지불하려 할 수 있고 PER도 높아질 수 있습니다.

    caution: >-
      EPS가 음수인 적자 기업은 일반적인 PER 해석이 어렵거나 PER이 의미 있게 계산되지 않을 수 있습니다.

      또한 일회성 이익이나 손실로 당기순이익이 크게 변하면
      EPS와 PER도 일시적으로 크게 변해 기업의 정상적인 수익성을 제대로 보여주지 못할 수 있습니다.

      PER은 절대적인 저평가·고평가 기준이 아니며,
      현재 실적과 미래 성장에 대한 시장의 기대가 함께 반영된 지표입니다.
      따라서 PER 하나만 보고 투자 판단을 내리기보다는
      같은 업종의 다른 기업, 성장률, ROE, 재무상태, 이익의 지속 가능성 등을 함께 살펴보는 것이 좋습니다.

      정보 제공처마다 주가 기준일, 연결·별도 재무제표 기준,
      최근 4개 분기 이익을 사용하는지 최근 연간 실적을 사용하는지 등이 다를 수 있으므로
      서로 다른 서비스의 PER을 비교할 때는 산정 기준도 함께 확인하는 것이 좋습니다.

  - conceptCode: PBR
    title: "PBR: 순자산에 비해 주가가 몇 배인가"
    summary: >-
      PBR은 현재 주가를 주당순자산(BPS)으로 나눈 값으로,
      시장이 회사의 장부상 순자산에 비해 주가를 몇 배 수준으로 평가하고 있는지를 보여주는 지표입니다.
    detailedExplanation: >-
      PBR = 주가 ÷ BPS입니다.
      이때 BPS는 자기자본 ÷ 주식 수이므로,
      같은 기준의 주식 수를 사용하면 PBR = 시가총액 ÷ 자기자본으로도 이해할 수 있습니다.

      즉, PBR은 회사 전체 기준으로 보면 시장에서 평가받는 주식가치인 시가총액이
      재무상태표에 기록된 주주 몫인 자기자본의 몇 배인지를 나타냅니다.
      자기자본이란, 회사가 가진 자산중에서 부채를 모두 제외한 순자산, 즉 자산 - 부채입니다.
      한 주 기준으로 보면 현재 주가가 한 주에 해당하는 장부상 순자산인 BPS의 몇 배인지를 보여줍니다.

      PBR이 1배라면 현재 주가와 한 주당 장부상 순자산이 같은 수준이라는 뜻입니다.
      PBR이 1배보다 높다면 시장이 장부상 자기자본보다 더 높은 가치를 인정하고 있는 것이고,
      1배보다 낮다면 시장가치가 장부상 자기자본보다 낮게 형성되어 있다는 뜻입니다.

      하지만 PBR이 높거나 낮은 데에는 이유가 있을 수 있습니다.
      높은 수익성을 오랫동안 유지하고 앞으로도 이익을 잘 낼 것으로 기대되는 회사는
      같은 순자산을 가지고 있어도 더 높은 PBR에 거래될 수 있습니다.

      반대로 현재 자기자본이 많더라도 자산을 효율적으로 활용하지 못하거나,
      앞으로 손실이 발생해 자산가치가 줄어들 것으로 예상되면 낮은 PBR에 거래될 수 있습니다.

      은행, 보험, 제조업처럼 재무상태표의 자산과 자기자본이 사업에서 중요한 업종에서는 PBR이 비교적 유용합니다.
      반면 브랜드, 소프트웨어, 기술, 인력처럼 장부에 충분히 기록되지 않는 경쟁력이 중요한 회사는
      PBR만으로 실제 기업가치를 판단하기 어렵습니다.

      따라서 PBR이 낮다는 이유만으로 반드시 저평가되었다고 단정하지 말고,
      같은 업종의 다른 회사, ROE, 자산의 질, 부채 수준과 미래 수익성을 함께 살펴보는 것이 중요합니다.
    bakeryExample: >-
      빵집의 주식 한 주가 18만 원이고, 주식 수가 100주라고 가정해봅시다.

      빵집 전체의 시장가치인 시가총액은
      주가 × 주식 수이므로 18만 원 × 100주 = 1,800만 원입니다.

      빵집이 보유한 현금, 건물, 오븐, 재료 등 자산이 2,000만 원이고
      대출금과 외상값 등 부채가 800만 원이라면,
      자산에서 부채를 뺀 자기자본은 1,200만 원입니다.

      BPS는 자기자본 ÷ 주식 수이므로
      1,200만 원 ÷ 100주 = 12만 원입니다.

      따라서 PBR은
      주가 ÷ BPS = 18만 원 ÷ 12만 원 = 1.5배가 됩니다.

      회사 전체 기준으로 계산해도
      시가총액 ÷ 자기자본 = 1,800만 원 ÷ 1,200만 원 = 1.5배로 같은 결과가 나옵니다.

      즉, 시장은 장부상 주주 몫이 1,200만 원인 빵집을 1,800만 원으로 평가하고 있으며,
      장부상 자기자본보다 50% 높은 가격을 인정하고 있다고 볼 수 있습니다.

      이 차이는 빵집이 앞으로 높은 이익을 낼 것이라는 기대에서 나올 수도 있지만,
      반대로 현재 주가가 지나치게 높게 형성된 결과일 수도 있습니다.
      PBR 숫자만으로 어느 쪽인지 판단할 수 없기 때문에 빵집의 수익성과 성장 가능성을 함께 확인해야 합니다.
    caution: >-
      자기자본이 음수라면 BPS도 음수가 될 수 있어 일반적인 PBR 비교가 의미를 잃을 수 있습니다.

      PBR이 1배보다 낮다고 해서 회사를 지금 청산하면 주주가 장부상 순자산만큼 받을 수 있다는 뜻은 아닙니다.
      건물과 설비를 실제로 처분하는 가격은 장부금액과 다를 수 있고,
      청산 과정에서 추가 비용이 발생하거나 일부 자산의 가치가 크게 낮아질 수도 있습니다.

      반대로 브랜드, 특허, 소프트웨어와 인력의 경쟁력처럼 장부에 충분히 기록되지 않는 가치가 큰 회사는
      실제 경쟁력이 높아도 PBR이 높게 나타날 수 있습니다.

      자사주 포함 여부, 연결·별도 재무제표 기준, 지배주주 자기자본 사용 여부와 주가 기준일에 따라
      정보 제공처별 PBR과 BPS가 다를 수 있습니다.

      PBR은 절대적인 저평가·고평가 기준이 아니므로
      같은 업종의 기업, ROE, 부채비율, 자산의 실제 수익 창출력과 함께 살펴보는 것이 좋습니다.

  - conceptCode: EPS
    title: "EPS: 한 주에 해당하는 회사의 이익"
    summary: >-
      EPS는 일정 기간 동안 보통주 주주에게 돌아갈 이익을 주식 수로 나눈 값으로,
      주식 한 주가 얼마의 순이익을 만들어 냈는지를 보여주는 지표입니다.
    detailedExplanation: >-
      기본 EPS는 일반적으로 보통주 주주에게 귀속되는 당기순이익을
      해당 기간의 가중평균 유통보통주식 수로 나누어 계산합니다.

      단순하게 표현하면 EPS = 당기순이익 ÷ 주식 수이지만,
      실제 계산에서는 한 해 중간에 주식 수가 달라질 수 있으므로
      각 주식이 실제로 유통된 기간을 반영한 가중평균 주식 수를 사용합니다.

      EPS가 1만 원이라는 것은 회계상 해당 기간에 주식 한 주당 1만 원의 순이익이 대응된다는 뜻입니다.
      이것은 회사가 주주에게 주당 1만 원을 현금으로 지급한다는 뜻은 아닙니다.
      회사는 이익 중 일부를 배당할 수도 있고, 사업 확장이나 부채 상환을 위해 회사 안에 남겨둘 수도 있습니다.

      EPS는 당기순이익이 증가하면 높아질 수 있지만 주식 수의 변화에도 영향을 받습니다.
      다른 조건이 같다면 유상증자처럼 유통주식 수가 늘어날 때 같은 이익이 더 많은 주식에 나뉘어 EPS가 낮아질 수 있습니다.
      반대로 자사주를 매입·소각해 유통주식 수가 줄어들면 전체 이익이 같아도 EPS가 높아질 수 있습니다.

      EPS가 여러 기간에 걸쳐 꾸준히 증가한다면 한 주당 이익 창출력이 커지고 있는 흐름으로 볼 수 있습니다.
      다만 이 증가가 본업의 성장 때문인지, 일회성 이익이나 주식 수 감소 때문인지는 따로 확인해야 합니다.

      EPS는 PER을 계산하는 기준이기도 합니다.
      주가를 EPS로 나누면 PER이 되므로 EPS가 변하면 주가가 그대로여도 PER이 달라질 수 있습니다.

      기본 EPS 외에 희석 EPS도 있습니다.
      희석 EPS는 전환사채, 신주인수권, 주식매수선택권처럼 앞으로 보통주로 바뀔 가능성이 있는 권리가
      실제 주식으로 전환되었다고 가정했을 때 한 주당 이익이 얼마나 낮아질 수 있는지를 보여줍니다.
    bakeryExample: >-
      빵집이 1년 동안 120만 원의 당기순이익을 벌었고,
      1년 내내 유통된 주식이 100주라고 가정해봅시다.

      EPS는 당기순이익 ÷ 주식 수이므로
      120만 원 ÷ 100주 = 1만 2천 원입니다.

      즉, 빵집 전체가 벌어들인 120만 원의 순이익을 주식 100주에 나누어 보면
      주식 한 주당 1만 2천 원의 이익이 대응된다는 뜻입니다.

      이때 빵집이 실제로 주주에게 주당 1만 2천 원을 지급해야 하는 것은 아닙니다.
      빵집은 이익 중 일부만 배당하고 나머지는 새 오븐을 사거나 다음 매장을 준비하는 데 사용할 수 있습니다.

      이번에는 빵집의 순이익은 여전히 120만 원인데,
      새 투자금을 받기 위해 연초부터 주식 수를 200주로 늘렸다고 가정해봅시다.

      이 경우 EPS는
      120만 원 ÷ 200주 = 6천 원으로 낮아집니다.

      빵집 전체가 번 돈은 같지만 이익을 나누는 주식 수가 늘어났기 때문에
      한 주에 돌아가는 이익이 1만 2천 원에서 6천 원으로 줄어든 것입니다.

      만약 주식 수가 연초가 아니라 정확히 연중 중간에 100주에서 200주로 늘었다면,
      실제 기본 EPS 계산에서는 1년 전체를 단순히 200주로 보지 않고
      앞의 절반은 100주, 뒤의 절반은 200주였던 기간을 반영한 가중평균 주식 수를 사용합니다.
    caution: >-
      EPS가 높다고 해서 반드시 주가가 오르거나 그 금액만큼 배당을 받을 수 있는 것은 아닙니다.
      EPS는 회계상 이익을 주당 단위로 나눈 값이며 실제 현금흐름이나 배당금과는 다릅니다.

      자산 매각이익과 같은 일회성 이익이나 대규모 손상차손이 발생하면
      EPS가 일시적으로 크게 높아지거나 낮아져 회사의 정상적인 수익성을 제대로 보여주지 못할 수 있습니다.

      기본 EPS와 희석 EPS는 서로 다를 수 있습니다.
      전환사채나 주식매수선택권 등 잠재적으로 주식 수를 늘릴 수 있는 수단이 많다면
      희석 EPS가 기본 EPS보다 낮게 나타날 수 있습니다.

      연결·별도 재무제표 중 무엇을 사용하는지,
      지배기업 보통주 주주에게 귀속되는 이익을 사용하는지,
      최근 4개 분기와 최근 연간 실적 중 어느 기간을 사용하는지에 따라 EPS가 달라질 수 있습니다.

      따라서 EPS를 비교할 때는 계산 기간과 이익 기준, 가중평균 주식 수,
      기본·희석 여부를 함께 확인하고 여러 기간의 흐름을 살펴보는 것이 좋습니다.

  - conceptCode: BPS
    title: "BPS: 주식 한 주에 해당하는 순자산"
    summary: >-
      BPS는 회사의 장부상 자기자본을 주식 수로 나눈 주당순자산으로,
      특정 시점에 주식 한 주당 얼마의 순자산이 대응되는지를 보여주는 지표입니다.
    detailedExplanation: >-
      BPS = 자기자본 ÷ 주식 수입니다.
      자기자본은 기본적으로 회사의 자산에서 부채를 뺀 뒤 남는 장부상 주주 몫입니다.

      예를 들어 회사가 가진 현금, 건물, 설비와 재고를 모두 합친 자산에서
      대출금, 외상대금 등 갚아야 할 부채를 빼면 자기자본을 이해할 수 있습니다.
      BPS는 이 자기자본을 주식 한 주 단위로 바꾼 값입니다.

      BPS가 10만 원이라는 것은 재무상태표상 주식 한 주에 10만 원의 자기자본이 대응된다는 뜻입니다.
      현재 주가가 10만 원이라는 뜻도 아니고,
      회사를 청산하면 주주가 실제로 주당 10만 원을 돌려받는다는 뜻도 아닙니다.

      EPS가 일정 기간 동안 벌어들인 이익을 보여주는 흐름의 지표라면,
      BPS는 특정 결산시점에 회사 안에 쌓여 있는 장부상 순자산을 보여주는 시점의 지표입니다.

      회사가 이익을 내고 이를 배당하지 않고 이익잉여금으로 쌓으면 자기자본과 BPS가 증가할 수 있습니다.
      반대로 손실이 발생하거나 많은 배당금을 지급하면 자기자본과 BPS가 감소할 수 있습니다.

      유상증자, 감자, 자사주 매입·소각 같은 자본거래도 자기자본과 주식 수를 함께 바꾸므로 BPS에 영향을 줄 수 있습니다.
      따라서 BPS가 변했을 때는 회사가 이익을 쌓았기 때문인지,
      주식 수나 자본구조가 바뀌었기 때문인지 구분해서 살펴봐야 합니다.

      BPS는 PBR을 계산하는 기준입니다.
      주가를 BPS로 나누면 PBR이 되므로 현재 시장가격이 장부상 주당 순자산의 몇 배인지 확인할 수 있습니다.
    bakeryExample: >-
      빵집이 보유한 현금, 건물, 오븐, 재료 등 자산이 모두 2,000만 원이고,
      은행 대출과 아직 지급하지 않은 재료비 등 부채가 800만 원이라고 가정해봅시다.

      빵집의 자기자본은
      자산 - 부채 = 2,000만 원 - 800만 원 = 1,200만 원입니다.

      이 빵집의 유통주식 수가 100주라면 BPS는
      자기자본 ÷ 주식 수 = 1,200만 원 ÷ 100주 = 12만 원입니다.

      즉, 재무상태표에 기록된 빵집의 장부상 자기자본을 주식별로 나누어 보면
      한 주에 12만 원의 순자산이 대응된다는 뜻입니다.

      이후 빵집이 1년 동안 200만 원의 이익을 벌고 배당하지 않아
      다른 조건의 변화 없이 이익이 회사 안에 그대로 쌓였다고 단순하게 가정하면,
      자기자본은 1,400만 원이 되고 BPS는 14만 원으로 증가할 수 있습니다.

      반대로 빵집의 오븐이 낡아 장부가치를 크게 낮추거나 영업손실이 발생하면
      자기자본이 줄어들어 BPS도 낮아질 수 있습니다.

      현재 빵집 주가가 18만 원이라면 BPS 12만 원과 비교한 PBR은 1.5배입니다.
      시장이 장부상 한 주의 순자산보다 더 높은 가격을 인정하고 있다는 뜻이지만,
      그 가격이 적정한지는 빵집의 수익성과 성장 가능성을 함께 살펴봐야 알 수 있습니다.
    caution: >-
      BPS는 장부상 수치이지 회사를 청산했을 때 주주가 실제로 받을 수 있는 금액을 보장하지 않습니다.
      건물, 설비와 재고의 실제 처분가격은 장부금액보다 낮거나 높을 수 있고,
      청산비용과 우선적으로 변제해야 할 채무도 발생할 수 있습니다.

      브랜드, 기술, 인력과 고객관계처럼 회사의 중요한 경쟁력이 재무상태표에 충분히 자산으로 기록되지 않을 수 있습니다.
      반대로 장부에 기록된 자산이 실제로는 충분한 수익을 만들지 못하거나 가치가 하락했을 수도 있습니다.

      자기자본이 음수인 자본잠식 상태에서는 BPS도 음수가 될 수 있으며,
      이 경우 BPS와 이를 이용한 PBR을 일반적인 방식으로 비교하기 어렵습니다.

      정보 제공처마다 연결·별도 재무제표 기준, 지배주주 자기자본 사용 여부,
      자기주식을 제외한 유통주식 수 사용 여부와 결산 기준시점이 다를 수 있습니다.

      따라서 BPS 하나만으로 기업가치를 판단하지 말고
      PBR, ROE, 부채비율, 자산의 질과 회사의 지속적인 이익 창출 능력을 함께 살펴보는 것이 좋습니다.

  - conceptCode: MARKET_CAP
    title: "시가총액: 시장이 평가한 회사의 전체 주식가치"
    summary: >-
      시가총액은 현재 주가에 상장주식 수를 곱한 값으로,
      주식시장이 현재 평가하는 회사 전체 주식의 가격 규모를 보여줍니다.
    detailedExplanation: >-
      시가총액 = 현재 주가 × 상장주식 수입니다.
      한 주의 시장가격을 회사 전체 주식 수로 확장한 값이라고 이해하면 쉽습니다.

      시가총액은 대형주·중형주·소형주처럼 상장회사의 시장 규모를 비교하거나
      주가지수에서 한 회사가 차지하는 비중을 이해할 때 자주 사용합니다.

      시가총액이 변하는 가장 직접적인 이유는 주가가 변하기 때문입니다.
      유상증자, 무상증자, 감자와 주식 소각처럼 상장주식 수가 달라지는 사건도 영향을 줄 수 있습니다.

      시가총액은 매출액, 자산총액이나 회사 통장에 있는 돈이 아닙니다.
      또한 회사를 통째로 인수하는 데 필요한 경제적 가치를 뜻하는 기업가치와도 다릅니다.
      시가총액은 해당 회사에 대한 사람들의 기대가치가 반영되어 있다고 볼 수 있습니다.
      기업가치는 분석 목적에 따라 시가총액에 순차입금 등을 더해 살펴보기도 합니다.

      따라서 시가총액은 회사의 시장 규모를 보여주는 출발점이지,
      그 회사가 싸거나 비싼지를 단독으로 판단하는 지표는 아닙니다.
      이익과 비교하면 PER, 자기자본과 비교하면 PBR처럼 다른 지표로 연결됩니다.
    bakeryExample: >-
      빵집의 주식 한 주가 18만 원이고 주식 수가 100주라고 가정해봅시다.

      시가총액은 주가 × 주식 수이므로
      18만 원 × 100주 = 1,800만 원입니다.

      이는 주식시장이 현재 빵집의 전체 주식을 약 1,800만 원으로 평가한다는 뜻입니다.
      빵집이 실제로 1,800만 원의 현금을 가지고 있다는 뜻은 아닙니다.

      다음 날 기대감으로 주가가 20만 원까지 오르고 주식 수가 그대로라면
      시가총액은 20만 원 × 100주 = 2,000만 원으로 증가합니다.
      빵집의 건물이나 오븐이 하루 만에 늘지 않아도 시장평가가 변하면 시가총액은 달라질 수 있습니다.

      이 빵집의 자기자본이 1,200만 원이고 연간 순이익이 120만 원이라면,
      시가총액을 자기자본과 비교해 PBR을, 순이익과 비교해 PER을 이해할 수 있습니다.
    caution: >-
      시가총액이 큰 회사가 반드시 재무적으로 안전하거나 수익성이 높은 것은 아닙니다.
      반대로 시가총액이 작다고 무조건 성장 가능성이 크거나 저평가된 것도 아닙니다.

      장중에는 주가가 계속 움직이므로 시가총액도 실시간으로 변합니다.
      보통주와 우선주를 따로 계산하는지, 자기주식을 어떻게 처리하는지에 따라 표시값에 차이가 날 수 있습니다.

      시가총액은 시장에서 거래되는 주식가치이므로 회사의 부채와 보유 현금을 직접 반영하지 않습니다.
      서로 자본구조가 다른 회사를 비교할 때는 매출, 이익, 자기자본과 부채도 함께 확인해야 합니다.

  - conceptCode: LISTED_SHARES
    title: "상장주식 수: 거래소에 상장된 주식의 수"
    summary: >-
      상장주식 수는 특정 종목으로 거래소에 등록되어 거래 대상이 되는 주식의 전체 수입니다.
    detailedExplanation: >-
      회사의 소유권을 여러 조각으로 나눈 것이 주식이고,
      그중 특정 종목으로 거래소에 상장된 주식의 총수를 상장주식 수라고 합니다.

      상장주식 수는 주가와 곱해 시가총액을 계산하는 데 사용되고,
      회사 전체 이익과 자기자본을 한 주 단위로 바꾸는 EPS와 BPS를 이해할 때도 중요한 기준입니다.

      상장주식 수는 고정된 값이 아닙니다.
      유상증자와 무상증자는 주식 수를 늘릴 수 있고, 감자와 주식 소각은 줄일 수 있습니다.
      유상증자는 새 주식을 발행하면서 투자자들에게 돈을 받고 파는 방식이고, 무상증자는 새 주식을 발행하면서 투자자들에게 돈을 받지않고 제공하는 방식입니다.
      유상증자와 무상증자를 통해 상장주식 수가 증가하면 EPS, BPS등에 영향을 미칠수도 있습니다.
      주식분할은 한 주를 여러 주로 나누고 주식병합은 여러 주를 한 주로 합칩니다.

      상장주식 수와 실제 시장에서 자주 거래되는 유통주식 수는 다를 수 있습니다.
      최대주주가 장기간 보유한 주식이나 자기주식처럼 시장에 바로 나오기 어려운 주식도
      기준에 따라 상장주식 수에 포함될 수 있습니다.

      또한 EPS는 기간 중 주식 수 변화를 반영한 가중평균 유통주식 수를 사용할 수 있지만,
      시가총액이나 BPS는 특정 기준시점의 주식 수를 사용하므로 지표별 분모가 항상 같지는 않습니다.
    bakeryExample: >-
      빵집의 소유권을 100장의 주식으로 나누어 거래소에 등록했다면 상장주식 수는 100주입니다.

      창업자가 40주를 장기간 보유하고 있어 시장에서 거의 거래하지 않더라도,
      그 주식이 같은 종목으로 상장되어 있다면 상장주식 수에는 포함될 수 있습니다.

      한 주 가격이 18만 원이면 시가총액은
      18만 원 × 100주 = 1,800만 원입니다.

      빵집이 1주를 2주로 나누는 액면분할을 해 주식 수가 200주가 되면,
      다른 조건이 같을 때 한 주 가격은 이론적으로 약 절반 수준으로 조정됩니다.
      주식 조각 수는 늘었지만 기존 주주의 소유 비율과 회사 전체 가치가 분할만으로 두 배가 되는 것은 아닙니다.

      반대로 새 매장을 열 자금을 마련하려고 새로운 주식을 발행하면
      회사로 자금이 들어오는 동시에 기존 주주의 지분율과 주당지표가 달라질 수 있습니다.
    caution: >-
      상장주식 수, 발행주식 수와 유통주식 수는 비슷해 보이지만 같은 개념이 아닙니다.
      상장주식 수는 거래소에 올라가 있는 주식의 수를 의미하며, 발행주식 수는 회사가 발행한 주식의 수를 의미하고, 유통주식 수는 실제 시장에 돌아다니는 주식의 수를 의미합니다.
      자기주식 포함 여부와 종류주식 구분에 따라 정보 제공처의 값이 달라질 수 있습니다.

      주식분할이나 병합 전후의 주가와 EPS를 그대로 비교하면 변화가 과장될 수 있으므로
      수정주가와 소급 조정 여부를 확인해야 합니다.

      EPS는 가중평균 주식 수, BPS와 시가총액은 기준시점 주식 수를 사용하는 경우가 있으므로
      각 지표의 산식을 확인한 뒤 비교하는 것이 좋습니다.

  - conceptCode: FOREIGN_HOLDING_QUANTITY
    title: "외국인 보유수량: 외국인 투자자가 보유한 주식 수"
    summary: >-
      외국인 보유수량은 특정 기준시점에 외국인으로 분류된 투자자들이 보유한 해당 종목의 주식 수입니다.
    detailedExplanation: >-
      외국인 보유수량은 지금까지 쌓인 보유 상태를 나타내는 시점 정보입니다.
      하루 동안 외국인이 얼마나 사고팔았는지를 보여주는 외국인 순매수와는 성격이 다릅니다.

      외국인 보유비율을 단순하게 계산하면 외국인 보유수량 ÷ 상장주식 수로 이해할 수 있습니다.
      다만 실제 제공값은 자기주식 처리와 투자자 분류 기준 등에 따라 차이가 날 수 있습니다.

      외국인이 순매수하면 다른 변동이 없다는 가정에서 보유수량이 늘어날 수 있고,
      순매도하면 줄어들 수 있습니다. 하지만 거래 체결과 결제의 기준시점이 다를 수 있어
      당일 순매수량과 보유수량 변화가 화면에서 즉시 정확히 일치하지 않을 수도 있습니다.

      주식분할, 증자, 합병 같은 권리 변동이 발생하면 매매가 없어도 보유수량 자체가 바뀔 수 있습니다.
      따라서 수량 변화가 실제 매수 때문인지 주식 수 조정 때문인지 함께 확인해야 합니다.

      외국인 보유수량은 투자자 관심을 살펴보는 참고자료이지만,
      외국인이 보유한다는 사실만으로 기업가치나 향후 주가 방향이 결정되는 것은 아닙니다.
    bakeryExample: >-
      빵집의 주식 수가 100주이고 외국인 투자자들이 현재 30주를 보유한다고 가정해봅시다.

      외국인 보유수량은 30주이고, 단순 보유비율은
      30주 ÷ 100주 × 100 = 30%입니다.

      오늘 외국인이 8주를 사고 3주를 팔았다면 외국인 순매수는
      8주 - 3주 = 5주입니다.

      순매수 5주는 오늘의 거래 흐름이고, 보유수량 30주는 특정 시점까지 쌓인 보유 상태입니다.
      두 숫자는 같은 의미가 아닙니다.

      다른 권리 변동과 분류 변경이 없고 결제까지 모두 반영된다는 단순한 가정에서는
      이전 보유수량이 25주였다면 순매수 5주 뒤 30주가 되는 관계를 생각할 수 있습니다.
      실제 화면에서는 집계시점과 결제시차 때문에 정확히 맞지 않을 수 있습니다.
    caution: >-
      외국인 보유수량이 증가했다는 사실만으로 향후 주가 상승을 단정할 수 없습니다.
      보유 목적과 투자 기간을 알 수 없고 외국인 투자자도 하나의 동일한 판단을 하는 집단이 아니기 때문입니다.

      기준시점, 투자자 분류, 결제 시차와 주식분할·증자 같은 권리 변동을 함께 확인해야 합니다.
      수량만 비교하지 말고 상장주식 수 변화까지 고려한 보유비율도 함께 살펴보는 것이 좋습니다.

  - conceptCode: FOREIGN_EXHAUSTION_RATE
    title: "외국인 소진율: 외국인 취득 가능 한도의 사용 정도"
    summary: >-
      외국인 소진율은 외국인이 취득할 수 있는 한도수량 가운데 현재 외국인 보유수량이 얼마나 차지하는지 보여줍니다.
    detailedExplanation: >-
      외국인 소진율 = 외국인 보유수량 ÷ 외국인 한도수량 × 100입니다.

      여기서 외국인 한도수량은 관련 법령과 업종별 규정 등에 따라
      외국인이 해당 종목에서 취득할 수 있는 최대 주식 수를 뜻합니다.

      외국인 소진율과 외국인 보유비율은 분자가 외국인 보유수량이라는 점은 같지만 분모가 다릅니다.
      보유비율은 보통 전체 상장주식 수와 비교하고,
      소진율은 외국인이 취득할 수 있는 한도수량과 비교합니다.

      따라서 외국인 소진율이 80%라고 해서 외국인이 회사 전체 주식의 80%를 보유한다는 뜻은 아닙니다.
      외국인 한도가 전체 주식 수보다 작다면 실제 보유비율은 훨씬 낮을 수 있습니다.

      소진율이 높으면 외국인이 추가로 취득할 수 있는 한도가 많이 남지 않았다는 의미로 참고할 수 있지만,
      그 자체가 매수 신호나 주가 상승 가능성을 뜻하지는 않습니다.
    bakeryExample: >-
      빵집의 전체 주식 수가 100주이고,
      규정상 외국인이 최대 40주까지 보유할 수 있다고 가정해봅시다.

      현재 외국인이 30주를 보유하고 있다면 외국인 소진율은
      30주 ÷ 40주 × 100 = 75%입니다.

      반면 전체 주식 수를 기준으로 계산한 외국인 보유비율은
      30주 ÷ 100주 × 100 = 30%입니다.

      같은 외국인 보유수량 30주를 사용했지만,
      한도수량 40주와 비교한 소진율은 75%이고 전체 주식 100주와 비교한 보유비율은 30%입니다.

      이 경우 외국인이 한도 안에서 추가로 취득할 수 있는 수량은 10주입니다.
      다만 실제 한도와 집계 방식은 종목 및 제공처 기준을 확인해야 합니다.
    caution: >-
      외국인 소진율을 외국인 보유비율이나 외국인 순매수 비율로 오해하면 안 됩니다.
      보유수량, 한도수량과 전체 상장주식 수를 함께 확인해야 합니다.

      모든 종목에 동일한 외국인 취득 한도가 적용되는 것은 아니며 법령과 업종 규정이 바뀌면 한도도 달라질 수 있습니다.
      한도 변경만으로도 소진율이 변할 수 있으므로 변화 원인을 확인해야 합니다.

      소진율이 높다는 이유만으로 주가 방향을 예측하지 말고 실제 기업 실적과 투자자 수급을 함께 살펴보는 것이 좋습니다.

  - conceptCode: VALUATION_AND_PROFITABILITY
    title: "PER·PBR·ROE·EPS·BPS 연결해서 보기"
    summary: >-
      EPS와 BPS는 이익과 자기자본을 한 주 단위로 바꾸고,
      PER·PBR·ROE는 주가·이익·자기자본의 관계를 서로 다른 방향에서 보여줍니다.
    detailedExplanation: >-
      EPS = 당기순이익 ÷ 주식 수이고 BPS = 자기자본 ÷ 주식 수입니다.
      회사 전체 숫자인 이익과 자기자본을 주식 한 주 기준으로 바꾼 값입니다.

      PER = 주가 ÷ EPS이며, 회사 전체 기준으로는 시가총액 ÷ 당기순이익으로 이해할 수 있습니다.
      PBR = 주가 ÷ BPS이며, 회사 전체 기준으로는 시가총액 ÷ 자기자본으로 이해할 수 있습니다.

      ROE = 당기순이익 ÷ 평균 자기자본 × 100입니다.
      주주가 맡긴 자기자본을 이용해 일정 기간에 얼마나 많은 이익을 만들었는지 보여주는 수익성 지표입니다.

      EPS와 BPS는 각각 PER과 PBR의 재료가 되고,
      ROE는 이익과 자기자본을 직접 연결합니다.
      같은 기준으로 단순화하면 PBR ≈ PER × ROE의 관계도 생각할 수 있습니다.
      이때 ROE 10%는 계산에서 0.10으로 사용합니다.

      높은 ROE를 꾸준히 유지하는 회사는 같은 자기자본으로 더 많은 이익을 만들기 때문에
      시장에서 높은 PBR을 인정받을 가능성이 있습니다.
      하지만 미래 성장 기대와 위험, 금리, 업종 특성도 가격에 반영되므로 항상 공식대로 움직이는 것은 아닙니다.

      다섯 지표를 따로 외우기보다 주가·시가총액, 당기순이익, 자기자본이라는
      세 가지 큰 숫자를 한 주 단위와 회사 전체 단위로 연결해 이해하는 것이 중요합니다.
    bakeryExample: >-
      빵집의 주가가 18만 원이고 주식 수가 100주라면 시가총액은 1,800만 원입니다.

      빵집의 연간 당기순이익이 120만 원이면
      EPS = 120만 원 ÷ 100주 = 1만 2천 원입니다.
      PER = 18만 원 ÷ 1만 2천 원 = 15배입니다.

      빵집의 자기자본이 1,200만 원이면
      BPS = 1,200만 원 ÷ 100주 = 12만 원입니다.
      PBR = 18만 원 ÷ 12만 원 = 1.5배입니다.

      평균 자기자본도 1,200만 원이라고 단순하게 가정하면
      ROE = 120만 원 ÷ 1,200만 원 × 100 = 10%입니다.

      회사 전체 기준으로도 PER은 1,800만 원 ÷ 120만 원 = 15배,
      PBR은 1,800만 원 ÷ 1,200만 원 = 1.5배가 됩니다.

      같은 기준이라는 단순한 가정에서는
      PER 15배 × ROE 10%(0.10) = PBR 1.5배라는 관계도 확인할 수 있습니다.
      각각의 공식이 결국 같은 주가·이익·자기자본을 다른 방향으로 연결하고 있기 때문입니다.
    caution: >-
      실제 화면에서는 주가는 특정 시점 값이고 이익은 최근 4개 분기 또는 연간 값이며,
      ROE는 평균 자기자본을 사용할 수 있어 지표 사이의 수학적 관계가 정확히 일치하지 않을 수 있습니다.

      높은 ROE가 항상 좋은 것만은 아닙니다.
      자기자본이 매우 작거나 부채가 많아 분모가 작아진 경우, 또는 일회성 이익이 발생한 경우에도 ROE가 높아질 수 있습니다.

      이익이나 자기자본이 음수이면 PER·PBR·ROE의 일반적인 해석이 어려워질 수 있습니다.
      연결·별도 기준과 주식 수 기준도 맞춰야 합니다.

      다섯 지표는 서로 연결되지만 하나의 숫자만으로 적정 주가를 결정할 수는 없습니다.
      성장성, 부채비율, 현금흐름과 이익의 지속 가능성을 함께 살펴보는 것이 좋습니다.

  - conceptCode: FINANCIAL_ANALYSIS_METRICS
    title: "재무 분석 기준: YoY·QoQ·TTM·런레이트·컨센서스"
    summary: >-
      YoY와 QoQ는 실적이 얼마나 변했는지를 비교하고,
      TTM과 런레이트는 최근 실적을 연간 규모로 바라보는 서로 다른 방법입니다.
      여기에 시장의 예상치인 컨센서스를 함께 보면 실제 실적뿐 아니라 시장의 기대를 얼마나 충족했는지도 살펴볼 수 있습니다.
    detailedExplanation: >-
      YoY는 Year over Year의 약자로 최신 분기를 전년 같은 분기와 비교한 변화율입니다.
      계절이 같은 기간끼리 비교하므로 계절성이 있는 회사의 성장 흐름을 볼 때 유용합니다.

      QoQ는 Quarter over Quarter의 약자로 최신 분기를 바로 직전 분기와 비교한 변화율입니다.
      최근 성장 속도가 빨라지거나 둔화되는 모습을 빠르게 볼 수 있지만 계절 변화에 영향을 받기 쉽습니다.

      변화율은 일반적으로 (현재 값 - 비교 값) ÷ 비교 값 × 100으로 계산합니다.
      비교 기준이 0에 가깝거나 음수이면 변화율이 지나치게 커지거나 직관적인 의미를 잃을 수 있습니다.

      TTM은 Trailing Twelve Months의 약자로 최근 실제 4개 분기 실적을 합한 최근 12개월 값입니다.
      이미 발생한 실적을 합친 것이므로 현재 사업 규모를 연간 단위로 이해할 때 도움이 됩니다.

      런레이트는 최신 한 분기 실적이 앞으로도 같은 수준으로 유지된다고 단순 가정해 4배로 연환산한 값입니다.
      실제 4개 분기를 더한 TTM과 달리 최신 분기만으로 만든 가정값이며 공식적인 실적 전망치가 아닙니다.

      런레이트가 TTM보다 높다면 최신 분기의 연환산 속도가 최근 12개월의 실제 실적보다 높다는 뜻입니다.
      계절성과 일회성 이익이 없고 이런 흐름이 지속될 근거가 있다면 최근 실적이 가속되는 단서로 볼 수 있습니다.
      반대로 런레이트가 TTM보다 낮다면 최신 분기의 속도가 최근 12개월보다 낮다는 뜻이므로 둔화 가능성을 살펴볼 수 있습니다.
      다만 성수기와 비수기, 일회성 계약과 비용, 환율 등의 영향으로도 차이가 생기므로 높고 낮다는 사실만으로 좋고 나쁨을 단정하면 안 됩니다.

      컨센서스는 증권사 애널리스트들이 예상한 매출액, 영업이익, 당기순이익이나 EPS 등의 전망치를 모아 만든 시장 예상치입니다.
      일반적으로 여러 전망치의 평균이나 대표값으로 제공되며, 회사가 반드시 달성하겠다고 약속한 공식 수치나 확정된 미래 실적은 아닙니다.

      실제 실적이 컨센서스보다 높으면 시장에서는 어닝 서프라이즈 또는 컨센서스 상회라고 표현하고,
      낮으면 컨센서스 하회나 어닝 미스라고 표현합니다.
      같은 실적이라도 시장이 얼마나 기대했는지에 따라 받아들이는 결과가 달라질 수 있습니다.

      주가는 실적 발표 전부터 투자자들의 기대를 반영해 선반영되어 움직일 수 있습니다.
      만약 컨센서스가 높게 나온다면 투자자들의 해당 회사에 대한 기대가 선반영되어 주가가 오를 수 있고, 컨센서스가 낮게 나온다면 투자자들의 해당 회사에 대한 우려가 선반영되어 주가가 하락할 수 있습니다.
      
      따라서 YoY와 QoQ가 높고 실적이 성장했더라도 이미 더 높은 성장을 기대해 주가가 올랐거나
      실제 실적이 컨센서스에 미치지 못하면 발표 뒤 주가가 하락할 수 있습니다.
      반대로 실적의 절대 수준이 좋지 않아도 시장의 낮은 예상보다 덜 나쁘거나 향후 전망이 개선되면 주가가 상승할 수 있습니다.

      네 지표를 함께 보면 전년 동기 대비 성장, 직전 분기 대비 속도,
      최근 실제 1년 성과와 최신 분기 수준의 단순 연환산을 구분할 수 있습니다.
      여기에 컨센서스를 더하면 회사가 실제로 성장했는지와 그 성장이 시장의 기대보다 높았는지를 나누어 판단할 수 있습니다.
    bakeryExample: >-
      빵집의 최신 분기 매출이 420만 원이라고 가정해봅시다.
      전년 같은 분기 매출은 300만 원이고 바로 직전 분기 매출은 360만 원입니다.

      YoY는 (420만 원 - 300만 원) ÷ 300만 원 × 100 = 40%입니다.
      작년 같은 계절보다 매출이 40% 증가했다는 뜻입니다.

      QoQ는 (420만 원 - 360만 원) ÷ 360만 원 × 100 ≈ 16.7%입니다.
      바로 직전 분기보다 매출이 약 16.7% 증가했다는 뜻입니다.

      최근 실제 4개 분기 매출이 차례로 300만 원, 330만 원, 360만 원, 420만 원이라면
      TTM은 300 + 330 + 360 + 420 = 1,410만 원입니다.

      최신 분기 420만 원이 앞으로 네 분기 동안 그대로 유지된다고 단순 가정한 런레이트는
      420만 원 × 4 = 1,680만 원입니다.

      TTM 1,410만 원은 실제 최근 4개 분기의 합계이고,
      런레이트 1,680만 원은 최신 분기의 높은 매출이 계속된다고 가정한 값이라는 차이가 있습니다.

      런레이트가 TTM보다 270만 원 높으므로 최신 분기의 매출 속도는 최근 12개월 평균보다 빨라진 모습입니다.
      하지만 최신 분기가 크리스마스 같은 빵집 성수기였거나 단체 주문이 한 번 들어온 결과라면
      다음 분기에도 420만 원을 유지한다고 보기 어렵습니다.
      따라서 최근 성장의 원인이 반복 가능한지 확인한 뒤에야 가속 신호로 해석하는 것이 좋습니다.

      이번에는 실적 발표 전 시장의 매출 컨센서스가 450만 원이었다고 가정해봅시다.
      실제 매출 420만 원은 전년 같은 분기보다 40%, 직전 분기보다 약 16.7% 증가한 좋은 실적이지만
      컨센서스보다는 30만 원, 약 6.7% 낮습니다.
      투자자들이 이미 450만 원 이상의 매출을 기대해 빵집 주식 가격을 올려두었다면
      성장한 실적이 발표되어도 기대에 못 미쳤다는 실망으로 주가가 하락할 수 있습니다.

      반대로 시장의 컨센서스가 380만 원이었다면 실제 매출 420만 원은 예상보다 40만 원,
      약 10.5% 높은 결과입니다. 이 경우에는 같은 420만 원의 실적도 기대를 웃돈 서프라이즈로 받아들여질 수 있습니다.

      다만 컨센서스를 웃돌았다고 주가가 반드시 오르는 것은 아닙니다.
      다음 분기 전망이 나빠졌거나 이미 높은 기대가 주가에 선반영되었다면 주가는 하락할 수 있고,
      컨센서스를 밑돌아도 향후 전망이 좋아지면 주가가 상승할 수 있습니다.
    caution: >-
      QoQ는 계절성에 취약하므로 성수기와 비수기가 뚜렷한 회사는 YoY를 함께 봐야 합니다.
      YoY도 전년 같은 분기의 일회성 사건이나 기저효과 때문에 크게 보일 수 있습니다.

      런레이트는 최신 실적이 유지된다는 단순 가정일 뿐 회사가 제시한 전망치가 아닙니다.
      TTM 역시 과거 12개월의 합계이므로 미래 실적을 보장하지 않습니다.

      런레이트와 TTM을 비교할 때는 같은 회계 기준과 같은 항목을 사용해야 합니다.
      런레이트가 TTM보다 높거나 낮다는 사실은 최근 속도의 변화 가능성을 보여줄 뿐,
      계절성, 일회성 손익과 사업환경을 확인하지 않으면 지속 가능한 성장이나 둔화를 판단할 수 없습니다.

      컨센서스는 분석기관, 참여 애널리스트 수와 집계 시점에 따라 달라지며 시간이 지나면서 수정될 수 있습니다.
      실제 실적과 비교할 때도 연결·별도, 누적·개별 분기, 회계상 실적·조정 실적 등 산정 기준을 맞춰야 합니다.
      컨센서스는 시장 기대를 이해하는 참고값이지 정답이나 투자수익을 보장하는 수치가 아닙니다.

      주가는 실제 실적과 컨센서스의 차이뿐 아니라 향후 실적 전망, 실적의 질, 금리와 환율 같은 시장환경,
      현재 가치평가 수준과 발표 전 주가 움직임에도 영향을 받습니다.
      따라서 실적이 좋으면 주가가 반드시 오르고 나쁘면 반드시 내린다고 단순하게 연결하면 안 됩니다.

      이 카드는 컨센서스의 개념을 설명하는 학습 자료입니다.
      화면에 표시된 TTM과 런레이트만으로 애널리스트 컨센서스를 계산하거나 제공하는 것은 아닙니다.

      비교 기준이 적자이거나 0에 가까우면 성장률의 부호와 크기가 오해를 만들 수 있으므로 원래 금액을 함께 확인해야 합니다.
      누적 재무 응답에서 직전 누적값을 빼 개별 분기로 환산했다면 그 환산 기준도 확인하는 것이 좋습니다.

  - conceptCode: REVENUE
    title: "매출액: 상품과 서비스를 판매해 얻은 수익"
    summary: >-
      매출액은 회사가 고객에게 상품이나 서비스를 제공하면서 인식한 수익으로,
      본업의 전체 판매 규모를 보여주는 손익계산서의 출발점입니다.
    detailedExplanation: >-
      매출액은 회사가 일정 기간 동안 얼마나 많은 상품과 서비스를 판매했는지를 금액으로 보여줍니다.
      흔히 회사의 외형이나 사업 규모를 살펴보는 가장 기본적인 지표로 사용합니다.

      매출은 단순히 현금이 통장에 들어온 시점과 항상 같지 않습니다.
      회계에서는 고객에게 약속한 상품이나 서비스가 이전되어 수익을 인식할 조건을 충족했는지를 기준으로 판단합니다.
      외상으로 판매하면 현금을 아직 받지 않았어도 매출과 매출채권이 기록될 수 있습니다.

      매출은 판매수량이 늘거나 판매가격이 오르면 증가할 수 있습니다.
      신규 매장과 신제품, 인수합병, 환율 변화도 매출 증가에 영향을 줄 수 있으므로
      기존 사업이 실제로 성장한 것인지 증가 원인을 나누어 보는 것이 중요합니다.

      매출액은 재료비, 상품 매입비, 직원 급여와 임대료 등을 빼기 전의 금액입니다.
      따라서 매출이 늘어도 원가와 판매관리비가 더 빠르게 늘면 영업이익은 오히려 감소할 수 있습니다.

      매출 성장률은 외형의 변화 속도를 보여주지만 수익성을 직접 보여주지는 않습니다.
      영업이익, 영업이익률, 현금흐름과 매출채권의 변화를 함께 봐야 매출의 질을 이해할 수 있습니다.
    bakeryExample: >-
      빵집이 1년 동안 빵을 판매해 800만 원,
      음료와 케이크를 판매해 400만 원의 수익을 인식했다고 가정해봅시다.

      빵집의 연간 매출액은
      800만 원 + 400만 원 = 1,200만 원입니다.

      이 1,200만 원은 고객에게 판매한 전체 규모이지 빵집 주인에게 최종적으로 남은 돈이 아닙니다.
      밀가루와 버터 같은 재료비, 직원 급여, 임대료와 광고비를 아직 빼지 않았기 때문입니다.

      지난해 매출이 1,000만 원이었다면 매출 성장률은
      (1,200만 원 - 1,000만 원) ÷ 1,000만 원 × 100 = 20%입니다.

      하지만 비용이 지난해 700만 원에서 올해 950만 원으로 더 빠르게 늘었다면
      매출은 성장했어도 본업에서 남는 이익의 개선 폭은 작을 수 있습니다.

      또 단골에게 외상으로 케이크를 넘겼다면 매출은 인식되었어도 현금은 아직 들어오지 않았을 수 있으므로
      매출액과 실제 현금 유입을 구분해서 봐야 합니다.
    caution: >-
      매출 증가가 반드시 이익 증가나 현금 증가를 의미하지는 않습니다.
      과도한 할인이나 외상판매로 매출만 늘었다면 수익성과 현금흐름은 나빠질 수 있습니다.

      회사가 상품이나 서비스의 주된 제공자인지 단순 중개자인지에 따라 거래금액을 총액 또는 수수료 순액으로 인식할 수 있습니다.
      업종과 계약구조가 다른 회사의 매출을 단순 비교할 때 주의해야 합니다.

      환율, 인수합병과 회계정책 변경으로 증가한 매출은 기존 사업의 자체 성장과 구분해서 보는 것이 좋습니다.
      연결·별도 기준과 누적·개별 분기 기준도 맞춰 비교해야 합니다.

  - conceptCode: OPERATING_PROFIT
    title: "영업이익: 본업에서 남긴 이익"
    summary: >-
      영업이익은 매출액에서 상품·서비스를 만들고 판매하는 데 든 영업비용을 차감한 금액으로,
      회사의 본업이 얼마나 이익을 남겼는지를 보여줍니다.
    detailedExplanation: >-
      단순하게 표현하면 영업이익 = 매출액 - 매출원가 - 판매비와관리비입니다.

      매출원가는 판매한 상품이나 서비스를 만드는 데 직접 들어간 원가이고,
      판매비와관리비는 직원 급여, 임대료, 광고비와 관리비처럼 영업활동을 유지하는 비용입니다.

      영업이익은 회사의 주된 사업에서 얼마를 남겼는지 보여주므로 본업의 수익성을 살펴보는 대표 지표입니다.
      대출이자 같은 금융비용, 영업과 직접 관련이 적은 기타손익과 법인세는 보통 그 이후 단계에서 반영됩니다.

      영업이익률 = 영업이익 ÷ 매출액 × 100입니다.
      매출 100원 중 본업을 통해 몇 원을 남겼는지를 보여주므로 규모가 다른 회사의 수익구조를 비교할 때 도움이 됩니다.

      매출과 영업이익이 함께 성장하는지, 매출보다 영업이익이 더 빠르게 증가해 이익률이 개선되는지 살펴보는 것이 좋습니다.
      매출은 늘지만 영업이익이 줄어든다면 원가나 고정비 부담이 커졌을 가능성이 있습니다.

      영업이익은 회계상 이익이므로 실제 현금흐름과 같지 않습니다.
      감가상각비, 매출채권과 재고 변화 때문에 영업이익과 영업현금흐름은 서로 다를 수 있습니다.
    bakeryExample: >-
      빵집의 연간 매출액이 1,200만 원이라고 가정해봅시다.

      판매한 빵과 음료에 사용된 재료비 등 매출원가가 650만 원이고,
      직원 급여, 임대료와 광고비 등 판매비와관리비가 300만 원이라면 영업이익은
      1,200만 원 - 650만 원 - 300만 원 = 250만 원입니다.

      영업이익률은
      250만 원 ÷ 1,200만 원 × 100 ≈ 20.8%입니다.
      매출 100원당 본업에서 약 20.8원을 남긴 셈입니다.

      지난해 매출이 1,000만 원이고 영업이익이 180만 원이었다면
      올해는 매출뿐 아니라 영업이익과 영업이익률도 함께 개선된 흐름으로 볼 수 있습니다.

      다만 이 250만 원에는 은행 대출이자와 영업 외 손익, 법인세가 아직 반영되지 않았습니다.
      이 항목들을 차례로 반영하면 최종 당기순이익으로 이어집니다.
    caution: >-
      회사마다 비용을 매출원가와 판매비와관리비로 분류하는 방식이 다를 수 있으므로 같은 업종 중심으로 비교하는 것이 좋습니다.

      구조조정비용과 일회성 충당금처럼 반복되지 않을 비용이 영업비용에 포함되면 영업이익이 일시적으로 크게 변할 수 있습니다.
      반대로 비용을 자산으로 처리하면 당장의 영업이익이 높아 보일 수도 있습니다.

      영업이익은 대출이자와 세금을 반영하기 전 단계이며 실제 현금 유입과도 다릅니다.
      당기순이익, 영업현금흐름과 비용의 지속 가능성을 함께 확인해야 합니다.

  - conceptCode: NET_INCOME
    title: "당기순이익: 모든 손익과 세금을 반영한 최종 이익"
    summary: >-
      당기순이익은 본업의 손익에 금융손익·기타손익과 법인세까지 반영한 뒤
      일정 회계기간에 최종적으로 남은 회계상 이익입니다.
    detailedExplanation: >-
      손익계산서는 매출액에서 영업비용을 빼 영업이익을 계산하고,
      이후 이자수익·이자비용, 자산매각손익과 기타손익을 반영한 뒤 법인세를 차감해 당기순이익에 도달합니다.

      당기순이익은 회사의 본업뿐 아니라 금융과 투자활동, 세금까지 포함한 전체적인 최종 성과를 보여줍니다.
      영업이익이 증가했는데 당기순이익이 감소했다면 이자비용, 기타손실이나 세금이 늘었는지 확인할 필요가 있습니다.

      당기순이익은 EPS와 PER 계산의 중요한 기초입니다.
      다만 연결재무제표의 전체 당기순이익과 지배기업 보통주 주주에게 귀속되는 이익은 다를 수 있으므로
      실제 EPS 산식에서는 어떤 이익을 사용했는지 확인해야 합니다.

      당기순이익이 회사 안에 남으면 이익잉여금과 자기자본을 늘릴 수 있고,
      일부가 배당으로 지급되면 주주에게 현금으로 돌아갈 수 있습니다.
      하지만 당기순이익 전체가 현금이거나 모두 배당되는 것은 아닙니다.

      여러 기간의 당기순이익과 영업이익을 함께 비교하면
      본업의 성장과 영업 외 일회성 요인을 구분하는 데 도움이 됩니다.
    bakeryExample: >-
      빵집의 연간 매출액이 1,200만 원이고 본업 비용을 차감한 영업이익이 250만 원이라고 가정해봅시다.

      은행 대출이자 비용이 40만 원이고 중고 장비 처분 등 기타이익이 10만 원이라면,
      법인세차감전이익은 250만 원 - 40만 원 + 10만 원 = 220만 원입니다.

      여기에서 법인세비용 100만 원을 반영하면 당기순이익은
      220만 원 - 100만 원 = 120만 원입니다.

      빵집의 주식 수가 100주라면 단순 EPS는
      120만 원 ÷ 100주 = 1만 2천 원입니다.

      주가가 18만 원이라면 PER은
      18만 원 ÷ 1만 2천 원 = 15배가 됩니다.

      이처럼 손익계산서의 마지막에 도달한 당기순이익이
      주식 한 주 기준의 EPS와 시장가격 비교 지표인 PER로 이어집니다.
    caution: >-
      자산매각이익과 평가이익 같은 일회성 항목으로 당기순이익이 급증할 수 있으므로
      본업에서 반복적으로 만들어진 이익인지 확인해야 합니다.

      당기순이익은 회계상 이익이며 실제 현금 증가액과 같지 않습니다.
      감가상각, 매출채권, 재고와 부채 변화가 현금흐름에 영향을 줄 수 있습니다.

      연결 당기순이익과 지배주주 귀속 순이익은 다를 수 있습니다.
      EPS와 PER을 연결할 때는 이익의 귀속 기준과 계산 기간을 맞춰야 합니다.

      적자에서 흑자로 전환하거나 반대로 흑자에서 적자로 바뀐 경우 단순 성장률이 오해를 만들 수 있으므로
      성장률뿐 아니라 실제 이익 금액과 여러 기간의 흐름을 함께 확인하는 것이 좋습니다.

  - conceptCode: FINANCIAL_RATIOS
    title: "재무비율: 성장성·수익성·안정성을 함께 읽기"
    summary: >-
      재무비율은 재무제표의 큰 금액들을 서로 나누거나 기간별로 비교해
      회사의 성장성·수익성·안정성과 주당 가치를 읽기 쉽게 바꾼 지표입니다.
    detailedExplanation: >-
      성장성 지표는 회사 규모와 이익이 이전 기간보다 얼마나 변했는지 보여줍니다.
      매출 성장률은 외형, 영업이익 성장률은 본업 성과, 순이익 성장률은 최종 이익의 변화 속도를 나타냅니다.

      수익성 지표인 ROE는 당기순이익을 평균 자기자본과 비교해
      주주가 맡긴 자본으로 얼마나 효율적으로 이익을 냈는지 보여줍니다.

      EPS와 BPS는 회사 전체의 당기순이익과 자기자본을 주식 한 주 단위로 바꾼 값입니다.
      EPS는 PER, BPS는 PBR과 연결되어 시장가격을 이익 및 순자산과 비교하는 재료가 됩니다.

      안정성 지표인 부채비율은 일반적으로 총부채 ÷ 자기자본 × 100으로 계산해
      주주자본에 비해 갚아야 할 부채가 어느 정도인지 보여줍니다.

      유보율은 일반적으로 회사 내부에 축적된 자본잉여금과 이익잉여금을 자본금과 비교한 값입니다.
      축적 정도를 보는 참고지표지만 현금 보유액과 같은 뜻은 아닙니다.

      재무비율은 큰 숫자를 비교하기 쉽게 만들지만 정보를 압축한 결과입니다.
      한 지표만 보기보다 여러 분기의 방향, 실제 금액과 지표 사이의 원인을 함께 살펴봐야 합니다.
    bakeryExample: >-
      빵집의 지난해 매출이 1,000만 원이고 올해 매출이 1,200만 원이라면
      매출 성장률은 (1,200만 원 - 1,000만 원) ÷ 1,000만 원 × 100 = 20%입니다.

      올해 당기순이익이 120만 원이고 평균 자기자본이 1,200만 원이라면
      ROE는 120만 원 ÷ 1,200만 원 × 100 = 10%입니다.

      총부채가 800만 원이고 자기자본이 1,200만 원이라면 부채비율은
      800만 원 ÷ 1,200만 원 × 100 ≈ 66.7%입니다.

      주식 수가 100주라면 EPS는 1만 2천 원이고 BPS는 12만 원입니다.
      주가 18만 원과 연결하면 PER은 15배, PBR은 1.5배가 됩니다.

      이 숫자들을 함께 보면 빵집의 매출 성장 속도, 자기자본을 활용한 이익 효율,
      부채 부담과 주당 이익·순자산을 하나의 흐름으로 이해할 수 있습니다.

      매출만 늘고 영업비용과 부채가 더 빠르게 늘어난다면 성장성은 좋아 보여도
      수익성과 안정성은 나빠질 수 있으므로 여러 비율을 함께 봐야 합니다.
    caution: >-
      적정한 재무비율은 업종과 성장 단계마다 다릅니다.
      은행과 제조업, 초기 성장기업과 성숙기업을 같은 기준으로 단순 비교하면 오해할 수 있습니다.

      비교 기준이 음수이거나 0에 가까우면 성장률이 매우 크게 나타나거나 직관적인 의미를 잃을 수 있습니다.
      비율과 함께 실제 금액을 확인해야 합니다.

      높은 ROE가 과도한 부채나 일회성 이익에서 나온 것은 아닌지,
      높은 유보율이 실제 현금 여력을 뜻하는 것은 아닌지 원인을 살펴봐야 합니다.

      증가율의 기준기간, 연결·별도 기준과 누적값의 개별 분기 환산 여부를 맞추고
      특정 한 분기보다 여러 기간의 일관된 흐름을 보는 것이 좋습니다.

  - conceptCode: INCOME_STATEMENT
    title: "손익계산서: 일정 기간 동안 얼마나 벌고 남겼는가"
    summary: >-
      손익계산서는 회사가 일정 기간 동안 얼마를 팔고 어떤 비용을 사용해
      본업의 이익과 최종 이익을 남겼는지 단계별로 보여주는 재무제표입니다.
    detailedExplanation: >-
      손익계산서는 특정 시점의 잔액이 아니라 한 분기나 한 해처럼 일정 기간에 발생한 성과를 보여줍니다.

      매출액은 상품과 서비스를 판매한 전체 규모입니다.
      여기에서 매출원가와 판매비와관리비를 차감하면 본업의 성과인 영업이익으로 이어집니다.

      영업이익 이후에는 이자수익·이자비용, 자산 처분손익과 기타 영업 외 손익이 반영됩니다.
      화면의 경상이익은 KIS 제공 항목의 분류를 따르므로 공시 재무제표의 세전이익과 명칭이나 범위가 다를 수 있습니다.

      마지막으로 법인세비용 등을 반영하면 당기순이익에 도달합니다.
      당기순이익은 EPS와 PER의 기초가 되고 회사 안에 남으면 자기자본에도 영향을 줄 수 있습니다.

      손익계산서는 위에서 아래로 내려가며 읽는 것이 좋습니다.
      매출은 늘었는지, 본업 비용을 제외한 영업이익은 얼마나 남았는지,
      영업 외 항목과 세금이 최종 이익을 얼마나 바꾸었는지 단계별로 비교할 수 있습니다.

      여러 분기를 나란히 보면 매출 성장과 이익률 개선이 지속되는지,
      특정 분기의 일회성 손익 때문에 최종 이익만 크게 변했는지 파악하는 데 도움이 됩니다.
    bakeryExample: >-
      빵집이 1년 동안 빵과 음료를 판매해 매출액 1,200만 원을 기록했다고 가정해봅시다.

      재료비 등 매출원가 650만 원과 직원 급여·임대료 등 판매비와관리비 300만 원을 차감하면
      영업이익은 1,200만 원 - 650만 원 - 300만 원 = 250만 원입니다.

      영업이익에서 대출이자 40만 원을 빼고 중고 장비 처분이익 10만 원을 더하면
      단순화한 법인세차감전이익은 250만 원 - 40만 원 + 10만 원 = 220만 원입니다.

      여기에서 법인세비용 100만 원을 반영하면
      당기순이익은 220만 원 - 100만 원 = 120만 원입니다.

      매출액 1,200만 원이 전부 주주에게 남는 것이 아니라
      본업 비용, 금융손익과 세금을 차례로 반영한 뒤 120만 원이 최종 이익으로 남는 흐름입니다.

      어느 단계에서 금액이 크게 줄었는지 살펴보면
      빵집의 재료비 부담이 큰지, 대출이자가 큰지, 세금이나 일회성 손익의 영향이 컸는지 이해할 수 있습니다.
    caution: >-
      손익계산서의 이익은 회계상 성과이며 같은 기간의 현금 증가액과 일치하지 않습니다.
      매출채권과 재고, 감가상각 등의 영향은 현금흐름표와 함께 확인해야 합니다.

      KIS의 경상이익 항목은 제공처의 분류를 따르므로
      기업 공시 재무제표의 세전이익 등과 명칭이나 범위가 다를 수 있습니다.

      연결·별도 기준과 지배주주 귀속 여부를 맞춰야 하며,
      누적 손익에서 직전 누적값을 빼 개별 분기로 환산했다면 원본 누적 공시와 환산 기준도 확인하는 것이 좋습니다.

      한 분기의 일회성 이익이나 손실만 보고 회사의 지속적인 수익성을 판단하지 말고 여러 기간을 함께 살펴봐야 합니다.

  - conceptCode: BALANCE_SHEET
    title: "재무상태표: 기준시점의 자산·부채·자본"
    summary: >-
      재무상태표는 특정 기준일에 회사가 가진 경제적 자원인 자산,
      갚아야 할 의무인 부채와 자산에서 부채를 뺀 주주 몫인 자기자본을 보여줍니다.
    detailedExplanation: >-
      재무상태표의 기본 관계는 자산 = 부채 + 자기자본입니다.
      회사가 보유한 모든 자산은 채권자에게 빌린 자금인 부채와 주주가 제공하거나 회사가 축적한 자기자본으로 조달됩니다.

      자산에는 현금, 매출채권, 재고, 건물과 설비 등이 포함될 수 있습니다.
      유동자산은 보통 정상영업주기나 1년 안에 현금화·사용될 항목을 중심으로 분류하고,
      비유동자산은 장기간 사용하는 건물과 설비 등을 포함합니다.

      부채에는 매입채무, 미지급금과 대출금처럼 회사가 부담하는 의무가 포함됩니다.
      유동부채는 비교적 가까운 시점에 결제할 의무를 중심으로 분류해 단기 지급 부담을 살펴보는 데 활용합니다.

      자기자본은 자산에서 부채를 뺀 장부상 주주 몫입니다.
      자본금은 주식의 액면과 발행 구조에 따른 법정 자본 항목이고,
      이익잉여금은 회사가 벌어들인 이익 중 배당하지 않고 누적한 부분입니다.
      자기자본 전체가 현금으로 보관되어 있다는 뜻은 아닙니다.

      재무상태표는 특정 날짜의 사진과 같습니다.
      손익계산서가 일정 기간 동안의 성과를 보여준다면 재무상태표는 그 결과가 쌓인 재무구조를 보여줍니다.
    bakeryExample: >-
      빵집의 결산일 현재 총자산이 2,000만 원이라고 가정해봅시다.

      현금, 외상매출금과 재료 등 유동자산이 600만 원이고,
      건물과 오븐 같은 비유동자산이 1,400만 원이면 총자산은 2,000만 원입니다.

      곧 지급할 재료비와 단기대출 등 유동부채가 300만 원이고,
      장기대출 등 비유동부채가 500만 원이면 총부채는 800만 원입니다.

      자기자본은 자산 - 부채이므로
      2,000만 원 - 800만 원 = 1,200만 원입니다.

      따라서 자산 = 부채 + 자기자본 관계도
      2,000만 원 = 800만 원 + 1,200만 원으로 일치합니다.

      자기자본 1,200만 원이 자본금 100만 원, 이익잉여금 900만 원과 기타 자본항목 200만 원으로 구성되었다고 해봅시다.
      이익잉여금 900만 원은 과거 이익이 누적된 회계상 항목이지 빵집 금고에 현금 900만 원이 있다는 뜻은 아닙니다.

      주식 수가 100주라면 BPS는
      1,200만 원 ÷ 100주 = 12만 원으로 연결됩니다.
    caution: >-
      재무상태표는 결산일 한 시점의 사진이므로 계절성과 결산일 전후의 일시적인 거래에 영향을 받을 수 있습니다.
      여러 분기 흐름과 함께 보는 것이 좋습니다.

      장부에 기록된 자산가치와 실제 처분 가능한 시장가치는 다를 수 있습니다.
      재고가 팔리지 않거나 설비가 낡았다면 장부금액만으로 자산의 질을 판단하기 어렵습니다.

      자기자본과 이익잉여금은 현금 잔액이 아닙니다.
      이익이 건물, 재고와 설비에 재투자되어 있을 수도 있습니다.

      금융업은 일반 제조업과 자산·부채의 의미와 구조가 크게 다르므로 부채비율과 유동성 지표를 같은 기준으로 단순 비교하면 안 됩니다.
      연결·별도 기준과 자산 평가방법도 함께 확인해야 합니다.

  - conceptCode: INVESTOR_TRADING_FLOW
    title: "투자자별 매매 수급: 누가 사고팔았는가"
    summary: >-
      투자자별 매매 수급은 거래일마다 외국인·개인·기관 등이 얼마나 사고팔았는지를 보여주는 거래 흐름으로,
      현재 보유 지분이나 기업의 실적과는 다른 정보입니다.
    detailedExplanation: >-
      순매수 = 매수 수량 - 매도 수량입니다.
      양수이면 해당 투자자 그룹이 그날 판 수량보다 더 많이 샀고,
      음수이면 산 수량보다 더 많이 팔았다는 뜻입니다.

      매수와 매도 수량은 거래 활동의 규모를 보여주고 순매수는 그날 어느 방향의 거래가 더 많았는지를 압축해서 보여줍니다.
      같은 순매수 10주라도 10주를 사고 하나도 팔지 않은 경우와 1,000주를 사고 990주를 판 경우의 거래 강도는 다릅니다.

      투자자별 매매 수급은 하루 또는 여러 거래일 동안의 흐름입니다.
      외국인 보유수량처럼 특정 시점까지 누적된 보유 상태와는 구분해야 합니다.

      모든 거래에는 매수자와 매도자가 있으므로 전체 투자자 분류가 완전하고 기준이 같다면 순매수 합계는 서로 상쇄됩니다.

      한 투자자 집단의 연속 순매수는 시장 관심을 이해하는 참고자료가 될 수 있지만
      매수 목적과 투자 기간을 알 수 없으므로 그 자체로 미래 주가를 예측할 수는 없습니다.
    bakeryExample: >-
      하루 동안 빵집 주식이 투자자들 사이에서 거래되었다고 가정해봅시다.

      외국인이 8주를 사고 3주를 팔았다면
      외국인 순매수는 8주 - 3주 = +5주입니다.

      개인이 2주를 사고 6주를 팔았다면
      개인 순매수는 2주 - 6주 = -4주입니다.

      기관이 1주를 사고 2주를 팔았다면
      기관 순매수는 1주 - 2주 = -1주입니다.

      이 단순한 예에서는 +5주 - 4주 - 1주 = 0주가 되어
      외국인이 더 산 5주를 개인과 기관이 더 판 수량이 공급한 관계를 볼 수 있습니다.

      외국인 순매수 +5주는 오늘의 흐름일 뿐 외국인이 빵집 주식 총 5주만 보유한다는 뜻은 아닙니다.
      외국인 보유수량이 30주라면 30주는 누적 상태이고 +5주는 오늘의 변화 방향입니다.
    caution: >-
      매매 수급은 보유수량이나 보유 지분율이 아닙니다.
      순매수량을 현재 보유량으로 해석하지 않도록 주의해야 합니다.

      외국인·개인·기관은 각각 다양한 투자자를 묶은 큰 분류이므로 집단 내부의 투자 목적과 기간도 서로 다릅니다.
      특정 집단이 샀다는 사실만으로 기업가치가 좋아졌다고 단정할 수 없습니다.

      대량매매, 프로그램매매, 투자자 분류, 결제 시차와 장 마감 후 정정 때문에
      제공처와 조회시점에 따라 값이 달라질 수 있습니다.

      하루의 큰 순매수보다 여러 거래일의 누적 흐름과 거래량을 함께 보고,
      재무실적·공시와 가격 변화도 함께 확인하는 것이 좋습니다.

  - conceptCode: SHORT_SELLING_AND_SECURITIES_LENDING
    title: "공매도·대차: 빌린 주식과 실제 매도 흐름"
    summary: >-
      대차거래는 주식을 빌리고 돌려주는 거래이고, 공매도는 빌린 주식 등을 시장에서 먼저 판 뒤
      나중에 다시 사서 갚는 거래입니다. 대차잔고와 공매도 거래량은 서로 관련될 수 있지만 같은 값은 아닙니다.
    detailedExplanation: >-
      대차거래에서는 주식을 보유한 사람이 수수료를 받고 주식을 빌려주며,
      빌린 사람은 약속한 시점에 같은 종목과 수량의 주식을 돌려줘야 합니다.
      아직 반환되지 않은 수량을 대차잔고라고 합니다.

      공매도는 주가 하락을 예상하거나 보유 위험을 헤지하려는 투자자가 빌린 주식 등을 먼저 시장에 팔고,
      이후 주식을 다시 사서 빌린 주식을 반환하는 거래입니다. 먼저 판 가격보다 낮게 다시 사면 차익이 생길 수 있지만,
      주가가 오르면 더 비싼 가격에 사서 갚아야 하므로 손실이 커질 수 있습니다.

      공매도 거래량은 특정 거래일에 실제 공매도로 체결된 수량입니다.
      공매도 거래비중은 그날 전체 거래량 가운데 공매도 거래량이 차지한 비율입니다.
      반면 대차잔고는 과거부터 빌린 뒤 아직 반환하지 않은 수량이 누적된 상태입니다.

      주식을 빌렸다고 반드시 바로 공매도하는 것은 아닙니다. 결제, 시장조성, 차익거래와 헤지 등 다른 목적으로
      빌릴 수도 있고, 빌린 시점과 실제 공매도 시점도 다를 수 있습니다. 따라서 대차잔고 증가를 곧바로
      공매도 증가나 주가 하락 신호로 단정하면 안 됩니다.

      공매도 포지션을 정리하려면 시장에서 주식을 다시 사야 합니다. 이를 숏커버링이라고 합니다.
      공매도 투자자가 한꺼번에 주식을 되사면 매수세가 강해져 주가가 빠르게 오르는 숏스퀴즈가 발생할 수도 있습니다.
    bakeryExample: >-
      빵집 주식 보유자가 20주를 다른 투자자에게 빌려줬다고 가정해봅시다.
      아직 한 주도 돌려받지 않았다면 대차잔고는 20주입니다.

      빌린 투자자가 그중 12주를 주당 10만 원에 시장에 팔았다면 그날 공매도 거래량은 12주입니다.
      대차잔고 20주와 공매도 거래량 12주는 서로 다른 값입니다.

      이후 주가가 8만 원으로 내려갔을 때 12주를 다시 사서 돌려주면,
      단순 차이는 (10만 원 - 8만 원) × 12주 = 24만 원입니다.
      실제 손익에서는 대차 수수료와 거래비용도 빼야 합니다.

      반대로 주가가 13만 원으로 오르면 12주를 되사는 데 더 많은 돈이 필요합니다.
      여러 공매도 투자자가 손실 확대를 피하려 동시에 사들이면 주가 상승이 더 빨라질 수 있습니다.
    marketImpact: >-
      공매도 거래비중과 대차잔고가 함께 증가하면 하락 예상이나 헤지 수요가 강해졌을 가능성을 살펴볼 수 있습니다.
      그러나 신규 대차가 실제 공매도로 이어졌는지, 공매도가 가격 하락 전에 발생했는지는 별도로 확인해야 합니다.

      대차잔고가 줄면 빌린 주식이 반환되었을 가능성이 있고, 공매도 잔고가 줄면서 주가가 오르면
      숏커버링이 일부 영향을 주었을 가능성도 있습니다. 이는 가능성에 대한 해석이지 원인을 확정하는 증거는 아닙니다.
    caution: >-
      공매도 거래량, 공매도 잔고와 대차잔고를 혼동하지 않아야 합니다.
      거래량은 해당 날짜의 흐름이고 잔고는 특정 기준일에 남아 있는 누적 상태입니다.

      공매도가 많다는 이유만으로 현재가 고점이거나 앞으로 반드시 하락한다고 판단할 수 없습니다.
      헤지·시장조성·차익거래 목적도 있으며, 강한 호재가 나오면 숏커버링 때문에 오히려 상승이 확대될 수 있습니다.

      공매도와 대차 데이터는 결제·집계·정정 시차로 최근 거래일 값이 늦게 반영될 수 있습니다.
      가격, 거래량, 투자자 수급과 공시를 함께 보고 하루 값보다 여러 거래일의 추세를 확인하는 것이 좋습니다.

  - conceptCode: CASH_MARGIN_RECEIVABLE_RELATIONSHIP
    title: "예수금·증거금·미수금: 주문과 결제 사이의 돈"
    summary: >-
      예수금은 계좌에 맡긴 현금, 증거금은 주문을 위해 우선 확보되는 금액,
      미수금은 결제일까지 채우지 못한 부족액입니다.
    detailedExplanation: >-
      주식을 주문할 수 있는 금액과 지금 바로 출금할 수 있는 현금은 항상 같지 않습니다.
      국내주식은 주문이 체결된 날과 실제 대금이 결제되는 날 사이에 시차가 있기 때문입니다.

      예수금은 증권계좌에 맡겨 둔 현금입니다. 매수 주문을 내면 증권사는 주문 이행을 위해
      종목별 증거금률에 해당하는 금액을 먼저 묶습니다. 이 금액이 증거금입니다.

      증거금률이 100%보다 낮으면 계좌 현금보다 큰 주문이 가능할 수 있습니다.
      그러나 결제일에는 매수대금 전액이 필요합니다. 결제대금이 부족하면 부족액이 미수금이 되고,
      정해진 기한까지 입금하거나 보유주식을 매도해 갚아야 합니다.

      따라서 예수금은 출발점, 증거금은 주문 단계의 보증금,
      미수금은 결제 단계에서 실제 돈이 부족할 때 생기는 채무라고 연결해서 이해하면 쉽습니다.

      핵심 흐름: 예수금 확인 → 주문 시 증거금 확보 → 매매 체결 → 결제일에 대금 전액 결제 → 부족하면 미수금 발생입니다.
      증거금률이 낮다는 것은 주식을 싸게 산다는 뜻이 아니라, 결제일까지 낼 돈 일부를 나중에 준비할 수 있다는 뜻입니다.

      주문 가능 금액과 출금 가능 금액도 구분해야 합니다. 이미 체결된 매수대금이나 다른 주문의 증거금으로 잡힌 돈은
      계좌 화면에 보이더라도 자유롭게 다시 주문하거나 출금할 수 없을 수 있습니다.
    bakeryExample: >-
      빵집 지분을 100만 원어치 사고 싶은데 계좌 예수금이 40만 원이고 증거금률이 40%라고 가정해봅시다.
      주문 시점에는 40만 원이 증거금으로 확보되어 주문이 체결될 수 있습니다.

      하지만 결제일까지 나머지 60만 원을 계좌에 넣어야 합니다.
      넣지 못하면 60만 원이 미수금이 됩니다. 처음 40만 원만 내면 거래가 끝나는 것이 아닙니다.

      공식: 필요한 증거금 = 주문금액 × 증거금률
      숫자 대입: 100만 원 × 40% = 40만 원
      공식: 결제일까지 준비할 금액 = 전체 매수대금 - 이미 확보한 증거금
      숫자 대입: 100만 원 - 40만 원 = 60만 원

      주가가 주문 뒤 80만 원으로 떨어져도 갚아야 할 매수대금이 자동으로 80만 원이 되는 것은 아닙니다.
      이미 100만 원에 체결된 거래이므로 결제 의무는 그대로 남는다는 점이 중요합니다.
    marketImpact: >-
      증거금률이 낮아지면 같은 현금으로 더 큰 주문을 낼 수 있어 단기 매수세가 늘어날 수 있습니다.
      반대로 증거금률이 높아지거나 미수 사용이 제한되면 투자자의 주문 여력이 줄어 매수세가 약해질 수 있습니다.

      시장 영향: 증거금으로 만들어진 매수는 결제일까지 실제 현금이 들어와야 완성됩니다.
      돈을 채우지 못한 주문이 많으면 며칠 뒤 매도나 반대매매로 되돌아와 가격 변동을 키울 수 있습니다.

      초보자 핵심: 거래량과 주가가 갑자기 늘었다고 해서 모두 장기 투자자금이 들어온 것은 아닙니다.
      일부는 짧게 사용한 미수 자금일 수 있으므로 결제 이후에도 매수세가 이어지는지 함께 보는 것이 좋습니다.
    caution: >-
      증거금률, 결제일, 미수 발생 기준과 주문 가능 금액 산식은 시장·상품·증권사에 따라 다를 수 있습니다.
      화면의 주문 가능 금액만 보고 감당할 수 있는 투자금이라고 판단하지 말고 결제 예정금액을 확인해야 합니다.

  - conceptCode: MARGIN_TRADING_AND_FORCED_LIQUIDATION
    title: "미수거래와 반대매매: 부족한 결제대금의 결과"
    summary: >-
      미수거래는 결제대금 일부가 부족한 상태로 주식을 산 것이고,
      부족액을 갚지 못하면 증권사가 주식을 강제로 파는 반대매매가 발생할 수 있습니다.
    detailedExplanation: >-
      미수거래는 낮은 증거금률을 이용해 현재 현금보다 큰 금액을 매수하고
      결제일까지 부족한 돈을 채우는 매우 짧은 자금 사용 방식입니다.

      결제일까지 현금을 입금하거나 보유주식을 매도해 부족액을 해소하지 못하면 미수금이 남습니다.
      증권사는 채권 회수를 위해 고객의 별도 매도 주문 없이 보유주식을 처분할 수 있는데 이를 반대매매라고 합니다.

      반대매매는 내가 원하는 가격을 기다려 주는 손절매가 아닙니다.
      증권사의 규정과 시장 상황에 따라 주문이 나가므로 급락장에서는 예상보다 낮은 가격에 체결될 수 있고,
      주식을 팔고도 채무가 모두 상환되지 않으면 남은 부족액을 추가로 갚아야 할 수 있습니다.

      핵심 흐름: 증거금으로 매수 → 결제대금 부족 → 미수금 발생 → 기한 내 미해소 → 반대매매 가능입니다.
      반대매매는 손실을 제한해 주는 서비스가 아니라 증권사가 빌려준 돈을 회수하기 위한 절차입니다.

      가격이 급락하거나 거래량이 부족하면 예상 가격보다 낮게 체결될 수 있습니다.
      매도대금은 먼저 미수금과 비용을 갚는 데 사용되므로, 주식을 팔았다고 해서 항상 남는 현금이 생기는 것도 아닙니다.
    bakeryExample: >-
      40만 원으로 빵집 주식 100만 원어치를 샀지만 결제일까지 60만 원을 넣지 못했다고 가정해봅시다.
      그사이 주식 가치가 80만 원으로 하락했고 증권사가 반대매매로 처분하면 손실이 확정됩니다.

      처분대금과 계좌의 다른 현금을 합쳐도 미수금과 비용을 갚지 못하면 채무가 남을 수 있습니다.

      예를 들어 100만 원에 산 지분을 70만 원에 반대매매하고 미수금이 60만 원이라면,
      단순히 10만 원이 남는다고 끝나는 것이 아닙니다. 이미 낸 40만 원 중 30만 원의 가격 손실이 발생했고
      여기에 수수료와 세금 등 거래비용도 더해질 수 있습니다.

      손익 계산: 반대매매 후 남는 금액 = 처분대금 70만 원 - 미수금 60만 원 = 10만 원
      손익 계산: 자기자금 손실 = 처음 낸 40만 원 - 남은 10만 원 = 30만 원
      결과: 거래비용을 제외해도 자기 돈 40만 원 중 75%를 잃은 셈입니다.
    marketImpact: >-
      주가가 빠르게 떨어질 때 미수금이 많은 계좌에서 반대매매가 동시에 나오면 매도 물량이 한꺼번에 늘 수 있습니다.
      이 매도는 기업이 갑자기 나빠져서가 아니라 결제대금을 갚기 위해 강제로 나오는 물량일 수 있습니다.

      시장 영향: 사려는 사람보다 강제 매도 물량이 많아지면 가격이 더 내려가고,
      추가 반대매매가 발생하는 악순환으로 이어져 장중 변동성이 커질 수 있습니다.

      초보자 핵심: 급락과 거래량 급증이 함께 나타날 때에는 뉴스뿐 아니라 미수·신용 계좌의 강제 처분 가능성도 생각해야 합니다.
      다만 반대매매 물량만으로 적정 주가를 판단할 수는 없습니다.
    caution: >-
      반대매매 시점과 주문 가격 방식, 미수동결계좌 적용은 증권사 약관과 시장 규정에 따라 달라집니다.
      미수거래는 짧은 기간에도 손실이 확대될 수 있으므로 단순히 수익률을 키우는 기능으로 보면 안 됩니다.

  - conceptCode: CREDIT_TRADING_VS_MARGIN_TRADING
    title: "신용거래와 미수거래: 빌린 기간과 관리 방식의 차이"
    summary: >-
      미수거래는 결제일까지의 매우 짧은 부족액이고,
      신용거래는 증권사에서 매수자금이나 주식을 빌려 약정 기간 동안 사용하는 거래입니다.
    detailedExplanation: >-
      두 거래 모두 자기 돈보다 큰 포지션을 만들 수 있지만 계약 구조가 다릅니다.
      미수거래는 결제대금 부족에서 발생하며 상환 기간이 매우 짧고, 미수금에 대한 반대매매 위험이 빠르게 나타납니다.

      신용거래는 증권사와 신용 약정을 맺고 매수자금을 빌리는 신용융자나
      주식을 빌려 매도하는 신용대주 형태로 이루어집니다. 약정 기간, 이자나 대주료,
      담보유지비율과 만기 등 별도의 관리 조건이 붙습니다.

      신용거래도 담보가치가 떨어져 유지비율을 지키지 못하면 추가 담보 요구나 반대매매가 발생할 수 있습니다.
      기간이 더 길다고 안전한 것이 아니라 이자비용과 가격 변동 위험이 누적된다는 차이가 있습니다.

      핵심 차이: 미수는 결제일까지 생긴 단기 부족액이고, 신용은 미리 약정한 대출 거래입니다.
      미수는 결제일과 미수 해소가 중심이고, 신용은 이자·만기·담보유지비율 관리가 중심입니다.

      둘 다 레버리지 효과가 있습니다. 주가가 오르면 자기자본 대비 수익률이 커질 수 있지만,
      주가가 내리면 같은 원리로 손실률도 커지고 강제 처분 가능성까지 생깁니다.
    bakeryExample: >-
      오늘 빵집 주식을 사고 이틀 뒤 결제대금 60만 원이 부족한 상태는 미수에 가깝습니다.
      반면 증권사와 약정을 맺어 60만 원을 한 달 동안 빌리고 이자를 내기로 했다면 신용융자에 가깝습니다.

      빵집 지분이 10% 오르면 100만 원의 지분은 110만 원이 되지만, 빌린 60만 원은 사라지지 않습니다.
      반대로 지분이 20% 내려 80만 원이 되면 자기 돈 40만 원을 기준으로 본 손실 부담은 훨씬 크게 느껴집니다.

      손익 계산: 상승 뒤 자기자금 = 110만 원 - 빌린 돈 60만 원 = 50만 원
      결과: 자기 돈 40만 원이 50만 원이 되었으므로 자기자본 수익률은 (50만 원 - 40만 원) ÷ 40만 원 × 100 = +25%입니다.

      손익 계산: 하락 뒤 자기자금 = 80만 원 - 빌린 돈 60만 원 = 20만 원
      결과: 자기 돈 40만 원이 20만 원이 되었으므로 자기자본 수익률은 (20만 원 - 40만 원) ÷ 40만 원 × 100 = -50%입니다.
    marketImpact: >-
      상승장에서 신용거래가 늘면 빌린 돈까지 매수에 사용되어 상승세가 강해질 수 있습니다.
      그러나 주가가 하락하면 담보비율을 맞추기 위한 추가 입금이나 반대매매가 필요해져 하락 압력도 커질 수 있습니다.

      시장 영향: 신용잔고가 높은 종목은 좋은 소식에 매수가 더 붙을 수도 있지만,
      나쁜 소식에는 빚을 줄이려는 매도가 겹쳐 가격이 더 크게 흔들릴 수 있습니다.

      초보자 핵심: 신용잔고가 많다는 사실만으로 곧 하락한다고 단정할 수는 없습니다.
      다만 하락할 때 강제 매도로 바뀔 수 있는 잠재 물량이 어느 정도 쌓였는지를 보여주는 위험 신호로 참고할 수 있습니다.
    caution: >-
      신용 가능 종목, 한도, 이자율, 담보유지비율과 만기는 증권사와 고객 등급에 따라 다릅니다.
      빌린 자금은 상승 수익뿐 아니라 하락 손실도 확대하고 비용이 계속 발생합니다.

  - conceptCode: HEDGING_VS_SPECULATION
    title: "헤지와 투기: 같은 상품, 다른 목적"
    summary: >-
      헤지는 이미 가진 위험을 줄이기 위한 거래이고,
      투기는 가격 방향을 예상해 새로운 위험을 감수하고 수익을 노리는 거래입니다.
    detailedExplanation: >-
      헤지는 보험과 비슷합니다. 보유 주식, 환율, 원자재 가격처럼 이미 노출된 위험과
      반대 방향으로 움직이는 포지션을 만들어 전체 손익의 흔들림을 줄입니다.

      투기는 가격이 오르거나 내릴 것이라는 전망을 바탕으로 포지션을 새로 만듭니다.
      선물·옵션·공매도는 헤지에도 투기에도 사용할 수 있으며 상품 이름이 목적을 결정하지 않습니다.

      같은 지수선물 매도라도 주식 포트폴리오 하락 위험을 줄이기 위해 사용하면 헤지이고,
      보유 주식 없이 지수 하락만 예상해 매도하면 투기적 성격이 강합니다.

      핵심 질문은 "이 거래가 기존 위험을 줄이는가, 새로운 방향 위험을 만드는가"입니다.
      헤지는 손실 가능성과 함께 이익 가능성도 일부 줄일 수 있고, 투기는 예상이 맞을 때의 이익을 위해 손실 가능성을 새로 받아들입니다.

      헤지 수단과 보호하려는 자산이 완전히 똑같이 움직이지 않으면 기초위험이 남습니다.
      따라서 헤지 여부는 상품 이름보다 대상 금액, 방향, 기간과 비율을 함께 보고 판단해야 합니다.
    bakeryExample: >-
      밀 가격 상승이 걱정되는 빵집이 미리 밀 구매가격을 고정하면 원가 위험을 줄이는 헤지입니다.
      빵집 운영과 관계없이 밀 가격 상승만 예상해 큰 선물 포지션을 산다면 투기에 가깝습니다.

      빵집이 세 달 뒤 밀가루 100포대를 사야 하고 현재 예상 비용이 500만 원이라면,
      비슷한 규모의 가격을 미리 고정하는 거래는 실제 원가 상승 위험을 줄이는 목적이 분명합니다.
      반면 필요한 물량은 100포대인데 1,000포대 규모를 거래한다면 초과한 부분은 새로운 가격 위험을 만드는 투기에 가까워집니다.

      공식: 헤지 비율 = 헤지한 물량 ÷ 실제 필요한 물량 × 100
      숫자 대입: 100포대 ÷ 100포대 × 100 = 100%
      결과: 필요한 100포대를 모두 보호하므로 단순화한 완전 헤지에 가깝습니다.

      숫자 대입: 1,000포대 ÷ 100포대 × 100 = 1,000%
      결과: 필요한 물량을 900포대 초과한 부분은 원가를 보호하는 헤지가 아니라 새로운 가격 위험을 만드는 투기에 가깝습니다.
    marketImpact: >-
      국민연금·보험사·자산운용사 같은 대형기관은 주식을 모두 팔지 않고도 지수선물이나 옵션을 매도해 하락 위험을 줄일 수 있습니다.
      그래서 파생상품에서 큰 매도가 보여도 반드시 모든 주식을 부정적으로 본다는 뜻은 아닙니다.

      시장 영향: 기관의 대규모 헤지는 선물가격과 현물가격의 차이인 베이시스를 움직이고,
      차익거래 프로그램을 통해 현물 주식의 매수·매도로 이어질 수 있습니다. 헤지를 풀 때에는 반대 방향 주문이 나올 수 있습니다.

      초보자 핵심: 같은 선물 매도라도 주식을 이미 많이 가진 기관에게는 보험일 수 있고,
      보유자산 없이 하락만 예상한 투자자에게는 투기일 수 있습니다. 주문의 방향보다 거래 목적과 기존 보유자산을 함께 봐야 합니다.
    caution: >-
      헤지는 위험을 완전히 없애지 못하며 보호 비용, 추적 오차와 기회비용이 생길 수 있습니다.
      헤지 비율이 너무 크면 오히려 반대 방향의 새로운 위험이 만들어질 수 있습니다.

  - conceptCode: DIVERSIFICATION
    title: "분산투자: 한 번의 실패가 전부가 되지 않게"
    summary: >-
      분산투자는 자산·업종·지역·시점을 나누어 특정 위험이 전체 포트폴리오에 미치는 충격을 줄이는 방법입니다.
    detailedExplanation: >-
      한 회사에 모든 돈을 투자하면 그 회사의 실적 악화가 전체 자산의 손실로 이어집니다.
      여러 자산에 나누면 특정 기업이나 업종에서 발생한 고유 위험의 영향을 줄일 수 있습니다.

      종목 수만 많다고 충분히 분산된 것은 아닙니다. 같은 업종의 기업이나 같은 위험요인에 민감한 자산은
      동시에 움직일 수 있으므로 업종, 국가, 통화와 자산군까지 함께 살펴봐야 합니다.

      분산은 수익을 보장하거나 시장 전체 하락을 막는 방법이 아니라
      한 곳에 위험이 과도하게 집중되는 것을 줄이는 위험관리 방법입니다.

      기업 하나에만 생기는 문제처럼 분산으로 줄일 수 있는 위험을 고유위험이라고 합니다.
      반면 경기침체나 금융위기처럼 시장 전체에 영향을 주는 위험은 여러 종목을 보유해도 완전히 사라지지 않습니다.

      핵심은 자산의 개수가 아니라 손실 원인이 얼마나 다른가입니다.
      이름이 다른 반도체 회사 열 곳보다 주식·채권·현금처럼 서로 다른 위험에 반응하는 자산의 조합이 더 분산될 수 있습니다.
    bakeryExample: >-
      빵집 한 곳에만 투자하면 그 가게의 화재나 상권 변화가 전체 투자에 영향을 줍니다.
      빵집, 물류회사, 채권과 현금에 나누면 빵집만의 문제가 전체 자산을 무너뜨릴 가능성이 줄어듭니다.

      1,000만 원을 한 빵집에 모두 투자하면 그 빵집 가치가 30% 하락할 때 전체 자산도 300만 원 줄어듭니다.
      빵집 400만 원, 물류회사 300만 원, 채권 200만 원, 현금 100만 원으로 나누었다면
      같은 빵집 하락이 전체 자산에 미치는 직접 손실은 120만 원으로 줄어듭니다.

      손익 계산: 집중투자의 손실 = 1,000만 원 × 30% = 300만 원
      손익 계산: 분산 후 빵집에서 발생한 손실 = 400만 원 × 30% = 120만 원
      결과: 다른 자산 가격이 그대로라는 단순 가정에서는 한 빵집의 충격이 전체 자산에 미치는 손실이 180만 원 줄어듭니다.

      다만 물류회사도 같은 지역과 소비경기에 크게 의존한다면 함께 나빠질 수 있습니다.
      그래서 숫자만 나누는 것이 아니라 각 자산이 무엇 때문에 오르고 내리는지를 살펴봐야 합니다.
    marketImpact: >-
      여러 투자자가 같은 업종에 지나치게 몰렸다고 판단해 동시에 분산을 시작하면,
      인기 업종에서는 매도 물량이 나오고 상대적으로 덜 보유한 업종이나 채권·현금성 자산에는 자금이 들어갈 수 있습니다.

      시장 영향: 개인 한 명의 분산투자는 가격을 거의 움직이지 않지만 대형 펀드와 기관이 같은 방향으로 비중을 바꾸면
      업종 전체의 수급과 주가에 영향을 줄 수 있습니다. 시가총액이 작은 종목일수록 같은 금액에도 가격 충격이 더 클 수 있습니다.

      초보자 핵심: 어떤 종목이 내려갔다고 기업가치가 나빠진 것만은 아닙니다.
      펀드가 위험을 나누기 위해 기계적으로 비중을 줄인 결과일 수도 있으므로 기업 뉴스와 수급 변화를 구분해서 봐야 합니다.
    caution: >-
      금융위기처럼 시장 전체가 함께 하락할 때는 평소 낮았던 상관관계가 높아질 수 있습니다.
      지나친 분산은 관리 복잡성과 비용을 늘리고 좋은 판단의 효과도 희석할 수 있습니다.

  - conceptCode: CORRELATION
    title: "상관관계: 두 자산이 함께 움직이는 정도"
    summary: >-
      상관계수는 두 자산 수익률이 같은 방향으로 움직이는 정도를 -1에서 +1 사이로 나타냅니다.
    detailedExplanation: >-
      +1에 가까우면 두 자산이 같은 방향으로, -1에 가까우면 반대 방향으로 움직이는 경향이 강합니다.
      0에 가깝다면 관찰 기간에 뚜렷한 선형 관계가 적었다는 뜻입니다.

      분산투자는 서로 상관관계가 낮거나 다른 위험요인에 반응하는 자산을 조합할 때 효과가 커질 수 있습니다.
      다만 상관관계는 과거 데이터를 계산한 값이며 시장 상황과 기간에 따라 계속 변합니다.

      상관관계가 높다는 사실은 한 자산이 다른 자산의 움직임을 원인으로 만들었다는 뜻이 아닙니다.

      상관계수는 가격 자체보다 같은 간격의 수익률을 이용해 계산하는 것이 일반적입니다.
      +1은 늘 같은 비율로 움직인다는 보장이 아니라 관찰 기간에 같은 방향의 선형 움직임이 매우 강했다는 뜻입니다.

      핵심 해석: +1에 가까움 = 함께 움직이는 경향, 0에 가까움 = 뚜렷한 선형 관계가 약함,
      -1에 가까움 = 반대 방향으로 움직이는 경향입니다.
    bakeryExample: >-
      밀 가격이 오를 때 제분회사 매출과 빵집 원가가 함께 영향을 받더라도 손익 방향은 다를 수 있습니다.
      반면 같은 상권의 두 빵집은 경기와 유동인구 변화에 비슷하게 반응할 가능성이 큽니다.

      여름마다 아이스크림 빵 매출은 늘고 뜨거운 수프 매출은 줄어드는 경향이 있다면 둘의 상관관계는 낮거나 음수일 수 있습니다.
      두 메뉴를 함께 팔면 한 메뉴의 계절 부진을 다른 메뉴가 일부 보완할 수 있습니다.

      그러나 갑자기 상권 전체가 폐쇄되면 두 메뉴 매출이 모두 감소할 수 있습니다.
      평소의 상관관계가 위기 상황에서도 그대로 유지된다고 장담할 수 없는 이유입니다.
    marketImpact: >-
      시장이 불안해지면 평소 서로 다르게 움직이던 자산도 투자자들이 현금을 확보하려고 함께 팔면서 상관관계가 갑자기 높아질 수 있습니다.
      이때 분산했다고 생각한 포트폴리오가 동시에 하락할 수 있습니다.

      시장 영향: 여러 기관의 위험관리 모델이 비슷한 상관관계와 변동성 수치를 사용하면,
      같은 시점에 위험자산을 줄이는 주문이 겹쳐 주식·채권·환율이 평소보다 크게 함께 움직일 수 있습니다.

      초보자 핵심: 과거에 반대로 움직였다는 이유만으로 위기 때도 반드시 보호해 주는 것은 아닙니다.
      상관관계는 고정된 성질이 아니라 시장 상황에 따라 달라지는 관찰값입니다.
    caution: >-
      계산 기간과 수익률 주기에 따라 상관계수가 달라집니다.
      과거의 낮은 상관관계가 위기에도 유지된다고 가정하지 말고 손실 규모와 유동성도 함께 봐야 합니다.

  - conceptCode: ASSET_ALLOCATION
    title: "자산배분: 투자 성과의 큰 틀을 정하는 비중"
    summary: >-
      자산배분은 주식·채권·현금·원자재 등 서로 다른 자산군에 얼마씩 투자할지 정하는 과정입니다.
    detailedExplanation: >-
      자산배분은 먼저 투자 목표, 사용할 시점, 감당 가능한 손실과 필요한 유동성을 정하는 데서 시작합니다.
      그 다음 기대수익과 위험 특성이 다른 자산군의 목표 비중을 설계합니다.

      주식 비중이 높으면 장기 성장 가능성과 가격 변동이 함께 커질 수 있고,
      채권과 현금은 변동 완화와 유동성에 도움을 줄 수 있지만 금리·물가 위험이 있습니다.

      좋은 배분은 모두에게 같은 정답이 아니라 투자자의 목적과 시간에 맞는 구조입니다.

      자산배분은 어떤 종목을 살지보다 먼저 포트폴리오 전체가 어느 정도 흔들릴 수 있는지를 정합니다.
      가까운 시일에 쓸 돈은 변동성이 큰 자산에 과도하게 두지 않고, 장기간 묶어 둘 수 있는 돈은 성장자산 비중을 검토할 수 있습니다.

      같은 10% 비중이라도 자산마다 위험 기여도는 다릅니다. 가격 변동이 큰 자산은 적은 금액만 담아도
      포트폴리오 전체 위험에 큰 영향을 줄 수 있으므로 금액 비중과 위험 비중을 구분해 보는 것이 좋습니다.
    bakeryExample: >-
      1,000만 원 중 장기 성장용 주식 600만 원, 변동 완화용 채권 300만 원,
      비상자금용 현금 100만 원으로 나누는 것은 60:30:10 자산배분입니다.

      공식: 자산 비중 = 해당 자산 금액 ÷ 전체 투자금액 × 100
      비중 계산: 주식 600만 원 ÷ 1,000만 원 × 100 = 60%
      비중 계산: 채권 300만 원 ÷ 1,000만 원 × 100 = 30%
      비중 계산: 현금 100만 원 ÷ 1,000만 원 × 100 = 10%

      빵집을 3년 뒤 확장할 자금이라면 성장 가능성을 위해 일부를 빵집 지분에 투자하되,
      다음 달 임대료와 재료비처럼 반드시 써야 할 돈은 현금으로 남겨야 합니다.
      수익률이 높아 보이는 자산에 운영자금까지 넣으면 가격 하락 때 필요한 돈을 손실 상태로 팔아야 할 수 있습니다.
    marketImpact: >-
      국민연금과 같은 대형 연기금은 주식·채권·대체자산 등에 둘 목표 비중을 정해 운용합니다.
      주식이 많이 올라 목표 비중을 넘으면 주식을 일부 팔고, 반대로 주식이 크게 내려 비중이 부족해지면 다시 살 수 있습니다.

      시장 영향: 운용금액이 매우 크기 때문에 목표 비중을 몇 퍼센트만 바꿔도 실제 매수·매도 금액은 커질 수 있습니다.
      이런 주문은 지수에 포함된 대형주와 거래 마감 무렵의 수급에 특히 눈에 띌 수 있습니다.

      초보자 핵심: 대형기관의 매도는 반드시 그 회사가 나쁘다고 판단한 결과가 아닙니다.
      전체 포트폴리오의 주식 비중을 약속한 수준으로 맞추기 위한 기계적인 매도일 수도 있습니다.
    caution: >-
      자산군 이름이 다르더라도 실제 위험요인이 겹칠 수 있습니다.
      세금, 환율, 투자기간과 현금 사용 계획을 무시한 배분은 실제 상황에 맞지 않을 수 있습니다.

  - conceptCode: PORTFOLIO_REBALANCING
    title: "포트폴리오 리밸런싱: 목표 비중으로 되돌리기"
    summary: >-
      리밸런싱은 가격 변화로 달라진 자산 비중을 원래 정한 목표 비중으로 조정하는 과정입니다.
    detailedExplanation: >-
      주식 60%, 채권 40%로 시작해 주식 가격이 크게 오르면 주식 비중이 70%가 될 수 있습니다.
      이때 일부 주식을 줄이고 채권을 늘려 60:40으로 돌아가는 것이 리밸런싱입니다.

      일정 기간마다 점검하는 정기 방식과 목표 비중에서 일정 범위 이상 벗어났을 때 조정하는 밴드 방식이 있습니다.
      새로운 입금과 배당금을 부족한 자산에 배분하면 매도와 세금을 줄일 수도 있습니다.

      리밸런싱은 단기 고점을 정확히 맞히는 전략이 아니라 처음 정한 위험 수준을 유지하는 규칙입니다.

      목표금액 = 전체 포트폴리오 금액 × 목표 비중으로 계산할 수 있습니다.
      현재 금액과 목표금액의 차이를 구하면 어떤 자산을 얼마나 줄이거나 늘릴지 판단하기 쉬워집니다.

      일정한 날짜에 조정하는 정기 리밸런싱은 단순하고, 목표에서 5%p처럼 정한 범위를 벗어날 때만 조정하는 밴드 방식은
      불필요한 거래를 줄일 수 있습니다. 어느 방식이든 미리 규칙을 정해야 감정적인 추격매매를 줄일 수 있습니다.
    bakeryExample: >-
      빵집 주식 600만 원과 채권 400만 원이었는데 주식이 올라 800만 원, 채권이 400만 원이 되면 비중은 약 67:33입니다.
      60:40으로 맞추려면 일부 주식을 줄이고 채권을 늘립니다.

      공식: 목표 자산금액 = 전체 포트폴리오 금액 × 목표 비중
      숫자 대입: 목표 주식금액 = 1,200만 원 × 60% = 720만 원
      숫자 대입: 목표 채권금액 = 1,200만 원 × 40% = 480만 원
      결과: 현재 주식 800만 원에서 80만 원을 줄여 채권으로 옮기면 주식 720만 원, 채권 480만 원으로 다시 60:40이 됩니다.

      새로 들어온 80만 원을 채권에만 넣어도 비슷한 효과를 낼 수 있습니다.
      이처럼 신규 입금이나 배당을 활용하면 기존 자산을 매도하지 않고도 비중을 조정할 수 있습니다.
    marketImpact: >-
      국민연금 같은 대형 연기금이나 인덱스펀드는 목표 비중과 기준지수를 맞추기 위해 정기적으로 리밸런싱합니다.
      운용자산이 매우 크면 비중을 1%만 조정해도 시장에는 큰 매수·매도 주문으로 나타날 수 있습니다.

      시장 영향: 주가가 많이 올라 목표 비중을 초과한 자산은 매도하고, 비중이 부족한 자산은 매수합니다.
      여러 기관의 정기 변경일이 겹치면 장 마감 무렵 거래량이 늘고 일부 종목의 가격이 평소보다 크게 움직일 수 있습니다.
      기관은 시장 충격을 줄이기 위해 주문을 여러 날에 나누거나 알고리즘으로 집행하기도 합니다.

      초보자 핵심: 기관이 대량 매도했다고 해서 반드시 하락을 예상했다는 뜻은 아닙니다.
      수익이 많이 난 자산을 줄여 원래 비중으로 돌아가는 과정일 수 있으므로 기관 수급과 함께 리밸런싱 일정·지수 편입 변경 여부를 확인해야 합니다.
    caution: >-
      너무 자주 조정하면 수수료와 세금이 늘고 추세 수익을 일찍 줄일 수 있습니다.
      목표 비중 자체가 현재의 목적과 위험 감수 수준에 맞는지도 정기적으로 검토해야 합니다.

  - conceptCode: ETF_VS_FUND
    title: "ETF와 펀드: 같은 바구니, 다른 거래 방식"
    summary: >-
      펀드와 ETF는 여러 자산을 모아 운용하지만 ETF는 거래소에서 주식처럼 장중 거래된다는 차이가 있습니다.
    detailedExplanation: >-
      일반 펀드는 투자자가 판매사를 통해 가입·환매하고 보통 기준가격을 바탕으로 거래됩니다.
      실제 적용 가격을 주문 순간 정확히 알기 어려울 수 있으며 환매에 시간이 걸립니다.

      ETF는 펀드의 한 종류이지만 거래소에 상장되어 장중 호가로 사고팔 수 있습니다.
      시장가격과 보유자산 가치인 NAV 사이에 차이가 생길 수 있고 매매수수료와 호가 스프레드도 고려해야 합니다.

      두 상품 모두 액티브·패시브 전략이 가능하므로 ETF가 항상 지수를 그대로 따르고 일반 펀드가 항상 적극 운용되는 것은 아닙니다.

      핵심 관계: ETF는 펀드라는 큰 범주 안에 있는 거래소 상장형 상품입니다.
      일반 펀드는 하루 한 번 계산되는 기준가격으로 가입·환매하는 경우가 많고,
      ETF는 장중 시장가격을 보면서 지정가나 시장가 주문을 낼 수 있다는 차이가 있습니다.

      ETF는 가격을 즉시 확인하고 거래하기 쉽지만 호가 차이와 거래량을 봐야 합니다.
      일반 펀드는 장중 매매가 어렵지만 자동이체나 장기 적립처럼 판매사의 서비스가 편리할 수 있습니다.
    bakeryExample: >-
      여러 빵집 지분을 한 바구니에 담은 상품을 운용사에 가입해 기준가격으로 사고팔면 일반 펀드에 가깝습니다.
      그 바구니 자체가 거래소에 상장되어 장중 가격으로 거래되면 ETF에 가깝습니다.

      바구니 안에 빵집 50곳의 지분이 들어 있고 순자산이 1억 원이라면 투자자는 작은 금액으로도 여러 빵집에 나누어 투자할 수 있습니다.
      일반 펀드는 오늘 신청해 나중에 계산된 기준가격을 적용받을 수 있고,
      ETF는 거래 화면에서 10,000원 매도호가와 10,010원 매수호가를 확인한 뒤 바로 주문하는 식입니다.
    marketImpact: >-
      ETF에 큰돈이 들어오면 운용사는 ETF가 추종하는 주식 바구니를 실제로 사야 할 수 있습니다.
      반대로 ETF에서 자금이 대규모로 빠져나가면 바구니에 담긴 주식을 팔아야 할 수 있습니다.
      그래서 개별 기업에 특별한 뉴스가 없어도 ETF 자금의 유입과 유출 때문에 주가와 거래량이 움직일 수 있습니다.

      시장 영향: 시가총액 비중이 큰 종목은 여러 지수형 ETF에 많이 포함되므로 ETF 자금 흐름의 영향을 더 크게 받을 수 있습니다.
      지수 정기변경으로 종목이 ETF 바구니에 새로 들어가거나 빠질 때에도 편입일 전후로 매수·매도 주문이 몰릴 수 있습니다.

      초보자 핵심: 어떤 종목의 주가가 움직였다고 해서 반드시 그 회사의 실적이나 전망이 바뀐 것은 아닙니다.
      ETF의 자금 흐름과 지수 편입·편출처럼 여러 종목을 한꺼번에 사고파는 수급도 함께 확인해야 합니다.
    caution: >-
      총보수 외에도 매매수수료, 기타비용, 추적오차, 세금과 환매 조건을 함께 비교해야 합니다.
      ETF도 거래량이 적으면 원하는 가격에 사고팔기 어려울 수 있습니다.

  - conceptCode: ETF_NAV_AND_PREMIUM_DISCOUNT
    title: "ETF의 NAV와 괴리율: 바구니 가치와 시장가격"
    summary: >-
      NAV는 ETF가 보유한 순자산의 주당 가치이고, 괴리율은 ETF 시장가격이 NAV와 얼마나 다른지 보여줍니다.
    detailedExplanation: >-
      NAV는 ETF가 가진 자산가치에서 부채와 비용을 뺀 순자산을 발행좌수로 나눈 값입니다.
      거래소의 ETF 시장가격은 투자자의 매수·매도에 따라 장중 계속 변합니다.

      시장가격이 NAV보다 높으면 할증, 낮으면 할인 상태입니다.
      괴리율은 보통 (시장가격 - NAV) ÷ NAV × 100으로 계산합니다.

      장중에는 실시간 추정 순자산가치인 iNAV가 참고값으로 제공될 수 있지만
      해외자산의 거래시간 차이와 환율, 기초자산 가격 지연 때문에 추정치에도 오차가 생길 수 있습니다.

      괴리율 = (ETF 시장가격 - NAV) ÷ NAV × 100입니다.
      양수이면 순자산가치보다 비싸게 거래되는 할증, 음수이면 더 싸게 거래되는 할인 상태입니다.

      지정참가회사 등 시장 참여자의 설정·환매와 차익거래는 시장가격을 NAV 근처로 되돌리는 역할을 할 수 있습니다.
      다만 거래가 뜸하거나 기초시장이 닫혀 있으면 이 기능이 느려져 괴리가 커질 수 있습니다.
    bakeryExample: >-
      빵집 지분 바구니의 주당 순자산가치가 10,000원인데 ETF가 10,200원에 거래되면 약 2% 할증입니다.
      9,800원에 거래되면 약 2% 할인입니다.

      공식: 괴리율 = (ETF 시장가격 - NAV) ÷ NAV × 100
      숫자 대입: (10,200원 - 10,000원) ÷ 10,000원 × 100 = +2%
      결과: NAV보다 2% 비싸게 거래되는 할증 상태입니다.
      바구니 속 빵집 지분 가치는 10,000원인데 시장에서 200원을 더 내고 사는 셈입니다.

      반대로 9,800원이라고 무조건 200원의 이익이 확정되는 것은 아닙니다.
      실제 매도할 때까지 NAV와 시장가격이 모두 움직이고 거래비용도 들기 때문입니다.
    marketImpact: >-
      ETF 시장가격이 NAV보다 지나치게 높아지면 시장참여자는 기초자산 바구니를 사서 ETF를 만들고 비싼 ETF를 파는 거래를 할 수 있습니다.
      반대로 ETF가 NAV보다 지나치게 싸면 ETF를 사서 기초자산 바구니로 바꾸는 거래를 할 수 있습니다.
      이런 차익거래는 ETF 시장가격이 NAV에서 너무 멀어지지 않도록 되돌리는 힘으로 작용합니다.

      시장 영향: 해외 기초시장이 닫혀 있거나 거래가 적은 ETF는 정확한 기초자산 가격을 바로 알기 어려워 괴리율이 커질 수 있습니다.
      이때 ETF 가격 변동이 실제 자산가치 변화보다 더 크게 보일 수 있고, 장이 다시 열리면 가격이 빠르게 조정될 수도 있습니다.

      초보자 핵심: 양의 괴리율은 비싸게, 음의 괴리율은 싸게 거래된다는 뜻이지만 확정 수익 기회라는 뜻은 아닙니다.
      NAV의 기준시각, 해외시장 개장 여부, 환율, 호가 간격과 거래량을 함께 봐야 합니다.
    caution: >-
      괴리율이 크다고 바로 차익이 확정되는 것은 아닙니다. NAV 기준시각, 환율, 거래비용과 유동성을 확인해야 합니다.
      장 마감 무렵이나 해외시장 휴장일에는 괴리가 더 크게 보일 수 있습니다.

  - conceptCode: LEVERAGED_AND_INVERSE_ETF
    title: "레버리지·인버스 ETF: 일간 수익률을 따라가는 상품"
    summary: >-
      레버리지 ETF는 기초지수의 일간 수익률을 배수로,
      인버스 ETF는 반대 방향으로 추종하도록 설계된 상품입니다.
    detailedExplanation: >-
      중요한 단어는 일간입니다. 2배 레버리지 ETF는 하루 수익률의 약 2배를 목표로 하며
      여러 날의 누적 수익률이 기초지수 누적 수익률의 정확한 2배가 되는 상품이 아닙니다.

      매일 기준금액을 다시 맞추는 재조정과 복리 효과 때문에 상승과 하락이 반복되는 시장에서는
      기초지수가 제자리로 돌아와도 상품 가치가 감소할 수 있습니다. 이를 경로 의존성이라고 합니다.

      인버스 상품도 하락장에서 이익을 낼 수 있지만 시장이 상승하면 손실이 발생하며,
      장기 보유 시 일간 추종 구조와 비용의 영향을 받습니다.

      핵심은 매일 전날의 자산가치를 기준으로 목표 배수를 다시 맞춘다는 점입니다.
      방향이 한쪽으로 꾸준하면 복리효과가 유리하게 나타날 수도 있지만,
      오르내림이 반복되면 손실 뒤 더 작은 원금에 수익률이 적용되어 가치가 깎일 수 있습니다.

      인버스 ETF는 지수 하락 위험을 단기간 줄이는 도구가 될 수 있지만,
      장기적으로 시장이 상승할 경우 손실과 비용이 누적될 수 있어 단순한 장기 보험으로 보기 어렵습니다.
    bakeryExample: >-
      지수가 100에서 10% 올라 110이 된 뒤 10% 내려 99가 되면 누적 -1%입니다.
      일간 2배 상품은 100에서 20% 올라 120, 다음 날 20% 내려 96이 되어 누적 -4%가 됩니다.

      계산식: 기초지수 = 100 × (1 + 10%) × (1 - 10%) = 99
      결과: 기초지수의 이틀 누적수익률 = (99 - 100) ÷ 100 × 100 = -1%

      계산식: 일간 2배 ETF = 100 × (1 + 20%) × (1 - 20%) = 96
      결과: 일간 2배 ETF의 이틀 누적수익률 = (96 - 100) ÷ 100 × 100 = -4%

      빵집 바구니 지수가 이틀 동안 출발점과 거의 비슷해졌는데도 2배 상품은 4만 원을 잃었습니다.
      "지수가 결국 제자리니까 2배 상품도 제자리"가 아닌 이유가 바로 일간 재조정과 복리효과입니다.
    marketImpact: >-
      레버리지·인버스 ETF는 매일 목표 배율을 맞추기 위해 장중이나 장 마감 무렵 선물과 주식 등의 보유량을 조정합니다.
      예를 들어 지수가 크게 올라 레버리지 ETF의 자산이 늘어나면 다음 날에도 2배 수준을 유지하려고 추가 매수가 필요할 수 있습니다.
      반대로 지수가 크게 내리면 보유 노출을 줄이기 위한 매도가 필요할 수 있습니다.

      시장 영향: 상품 규모가 크고 시장 변동이 큰 날에는 이러한 재조정 주문이 장 마감 부근의 거래량과 변동성을 키우는 한 요인이 될 수 있습니다.
      인버스 상품은 지수와 반대 방향의 노출을 맞추므로 조정 방향도 일반 레버리지 상품과 다를 수 있습니다.

      초보자 핵심: 레버리지 ETF의 매수·매도 주문만 보고 다음 날 지수 방향을 예측하면 안 됩니다.
      상당 부분은 전망에 따른 선택이 아니라 약속한 일간 배율을 맞추기 위한 기계적인 거래이기 때문입니다.
    caution: >-
      이름의 배수를 장기 수익률 배수로 오해하면 안 됩니다.
      변동성이 클수록 괴리가 커질 수 있으므로 투자기간, 재조정 구조, 비용과 추적오차를 확인해야 합니다.

  - conceptCode: CURRENCY_HEDGED_VS_UNHEDGED
    title: "환헤지와 환노출: 해외투자의 환율 선택"
    summary: >-
      환노출 상품은 해외자산 수익과 환율 변동을 함께 반영하고,
      환헤지 상품은 파생계약 등을 이용해 환율 영향을 줄이려 합니다.
    detailedExplanation: >-
      원화 투자자가 달러 자산을 보유하면 자산가격뿐 아니라 달러·원 환율도 원화 수익률에 영향을 줍니다.
      달러가 강해지면 원화 환산수익에 도움이 될 수 있고 약해지면 반대가 될 수 있습니다.

      환헤지는 선물환 등의 계약으로 환율 변동 영향을 상쇄하려는 방식입니다.
      그러나 헤지 비용, 금리 차이, 계약 갱신과 추적오차 때문에 환율 영향을 완전히 없애지는 못합니다.

      환헤지가 항상 우월한 선택은 아닙니다. 투자기간과 환율 전망보다
      해외자산을 포트폴리오에서 어떤 역할로 보유하는지가 더 중요할 수 있습니다.

      원화 기준 수익은 해외자산 가격과 환율이 함께 결정합니다.
      단순하게는 원화 환산가치 = 해외자산의 외화가치 × 원화 환율로 이해할 수 있습니다.
      두 변화가 동시에 일어나므로 정확한 전체 수익률은 각각의 수익률을 단순히 더한 값과 조금 다를 수 있습니다.

      환노출은 환율 상승의 이익과 하락의 손실을 모두 받아들이는 선택입니다.
      환헤지는 이 흔들림을 줄이지만 계약 비용이 들고, 환율이 유리하게 움직일 때 얻을 수 있었던 이익도 줄어듭니다.
    bakeryExample: >-
      달러로 산 해외 빵집 주식이 10% 올라도 달러가 원화 대비 10% 약해지면 원화 수익은 크게 줄 수 있습니다.
      환헤지는 이 환율 변동을 줄이려는 장치이고 환노출은 그대로 받아들이는 선택입니다.

      해외 빵집 지분이 100달러이고 환율이 달러당 1,400원이면 원화가치는 14만 원입니다.
      지분 가격이 그대로인데 환율이 1,260원으로 내려가면 원화가치는 12만 6천 원이 됩니다.
      사업가치는 변하지 않았어도 원화 투자자는 1만 4천 원의 환율 영향을 받은 셈입니다.

      공식: 원화 환산가치 = 해외자산의 달러 가치 × 원/달러 환율
      숫자 대입: 처음 원화가치 = 100달러 × 1,400원 = 14만 원
      숫자 대입: 환율 하락 뒤 원화가치 = 100달러 × 1,260원 = 12만 6천 원
      결과: 환율 영향 = 12만 6천 원 - 14만 원 = -1만 4천 원

      환헤지 상품은 이 차이를 줄이는 계약을 함께 보유하지만 헤지 비용과 오차가 있어 정확히 14만 원을 고정하는 상품은 아닐 수 있습니다.
    marketImpact: >-
      연기금과 자산운용사 같은 대형기관은 해외자산의 환율 위험을 줄이려고 선물환이나 통화스왑 계약을 대규모로 이용합니다.
      계약 만기가 다가오면 기존 계약을 정리하고 새 계약으로 넘기는 롤오버가 필요해 외환 선도·스왑 시장의 수급에 영향을 줄 수 있습니다.

      시장 영향: 원화가 빠르게 강해지거나 약해지면 외국인 투자자가 한국 주식에서 얻는 자국 통화 기준 수익률도 달라집니다.
      이 변화는 외국인 자금의 유입·유출과 수출기업의 이익 전망을 통해 국내 주가에도 영향을 줄 수 있습니다.

      초보자 핵심: 기관의 대규모 환헤지 거래가 보였다고 해서 해외자산 전망을 나쁘게 본다고 단정하면 안 됩니다.
      자산을 계속 보유하면서 환율 위험만 줄이기 위한 관리 거래일 수 있기 때문입니다.
    caution: >-
      상품명의 H 표기 등만 보지 말고 실제 헤지 비율과 기준 통화를 확인해야 합니다.
      환헤지 비용은 시장 금리와 기간에 따라 달라지고 환율 이익 가능성도 함께 줄입니다.

  - conceptCode: SIDECAR
    title: "사이드카: 프로그램매매 충격을 잠시 늦추는 장치"
    summary: >-
      사이드카는 선물가격이 급변할 때 프로그램매매 호가의 효력을 잠시 정지해 현물시장 충격을 완화하는 제도입니다.
    detailedExplanation: >-
      선물가격이 급격히 움직이면 선물과 현물의 가격 차이를 이용하는 프로그램매매 주문이 한꺼번에 나올 수 있습니다.
      사이드카는 정해진 발동 요건이 충족되면 프로그램매매 호가 효력을 일정 시간 정지합니다.

      시장 전체 거래를 모두 멈추는 것이 아니라 프로그램매매의 충격 전달을 잠시 늦추는 장치라는 점이 핵심입니다.
      투자자에게 정보를 확인하고 주문 불균형이 완화될 시간을 주려는 목적입니다.

      발동 기준은 시장별 선물가격 변동률과 지속시간 등으로 구성되며 제도 변경 가능성이 있어 최신 거래소 규정을 확인해야 합니다.

      핵심 흐름: 선물 급변 → 프로그램매매 주문 급증 우려 → 프로그램매매 호가 효력 일시 정지 → 일정 시간 뒤 재개입니다.
      일반 투자자의 모든 주식 주문이 멈추는 서킷브레이커와 달리, 선물 충격이 프로그램매매를 통해 현물시장으로 번지는 속도를 늦춥니다.

      잠시 멈추는 동안 시장 참여자는 뉴스와 가격을 다시 확인할 수 있지만,
      원인이 사라지는 것은 아니므로 재개 뒤 가격이 같은 방향으로 계속 움직일 수도 있습니다.
    bakeryExample: >-
      빵 원재료 선물가격이 갑자기 움직여 자동 주문이 빵집 지분시장에 몰릴 때,
      자동 주문만 잠시 대기시켜 충격을 늦추는 교통 신호와 비슷합니다.

      빵집 시장의 일반 손님은 계속 주문할 수 있지만 선물가격을 보고 자동으로 수백 건을 내는 대형 주문만 잠시 대기시키는 상황입니다.
      신호가 다시 열렸을 때 주문이 사라졌다는 뜻은 아니므로 가격은 다시 크게 움직일 수 있습니다.
    marketImpact: >-
      사이드카가 발동되면 프로그램 매매 주문의 효력이 잠시 정지되어 한꺼번에 쏟아지던 기계적 매수·매도 압력이 잠깐 느려집니다.
      시장 참여자는 그 시간 동안 가격과 주문을 다시 확인할 수 있지만, 이미 접수된 투자 판단 자체가 사라지는 것은 아닙니다.

      시장 영향: 거래가 재개되면 보류됐던 주문이나 새 주문이 다시 들어오면서 거래량과 가격 변동이 커질 수 있습니다.
      다만 사이드카는 과열된 속도를 늦추는 장치이지 주가를 특정 방향으로 되돌리는 장치는 아닙니다.

      초보자 핵심: 사이드카 발동은 시장 변동성이 매우 커졌다는 신호로 이해해야 합니다.
      발동됐다는 사실만으로 곧 반등하거나 곧 하락한다고 판단해서는 안 됩니다.
    caution: >-
      사이드카가 발동했다고 반드시 시장이 반등하거나 하락이 끝난 것은 아닙니다.
      발동 대상, 시간, 횟수와 해제 기준은 KRX 최신 규정을 확인해야 합니다.

  - conceptCode: CIRCUIT_BREAKER
    title: "서킷브레이커: 시장 전체가 멈추는 단계별 안전장치"
    summary: >-
      서킷브레이커는 주가지수가 급락할 때 시장 전체 거래를 단계적으로 정지해 공포성 주문을 진정시키는 제도입니다.
    detailedExplanation: >-
      서킷브레이커는 전기 회로가 과부하 때 차단되는 것처럼 시장 급락이 일정 기준을 넘으면 거래를 멈춥니다.
      사이드카보다 적용 범위가 넓고 시장 전체의 매매거래 정지가 핵심입니다.

      국내 시장은 하락 폭과 지속 조건에 따라 여러 단계로 운영됩니다.
      초기 단계는 일정 시간 거래를 정지한 뒤 단일가매매로 재개할 수 있고,
      가장 높은 단계에서는 그날 거래가 종료될 수 있습니다.

      정지는 투자자에게 정보를 판단하고 주문을 다시 검토할 시간을 주지만 기업가치나 손실을 보장하지는 않습니다.

      핵심 차이: 사이드카는 프로그램매매의 충격을 잠시 늦추고,
      서킷브레이커는 시장 전체의 급락이 심할 때 더 넓은 거래를 단계적으로 멈춥니다.

      거래가 재개되면 쌓인 주문을 한 가격에서 최대한 많이 체결시키는 단일가 방식이 사용될 수 있습니다.
      이는 서둘러 들어온 주문을 시간 순서대로 바로 처리하기보다 시장이 다시 균형가격을 찾을 시간을 주기 위한 것입니다.
    bakeryExample: >-
      시장 전체에 주문이 너무 몰리면 모든 계산대를 잠시 닫아 주문을 정리한 뒤 다시 여는 것과 비슷합니다.
      마지막 단계에서는 그날 영업을 종료할 수도 있습니다.

      빵집 한 곳의 계산대만 멈추는 것이 아니라 쇼핑몰 전체 계산대가 잠시 닫히는 상황에 가깝습니다.
      문을 다시 열기 전에 사고 싶은 사람과 팔고 싶은 사람의 주문을 모아 한 번에 균형가격을 찾습니다.
    marketImpact: >-
      서킷브레이커가 발동되면 시장 전체 거래가 멈추므로 당장 주식을 사고팔아 현금화하는 것이 어려워집니다.
      정지 시간 동안 뉴스가 더 나오거나 투자자의 판단이 바뀌면 재개 시점에 매수·매도 주문이 한쪽으로 크게 몰릴 수 있습니다.

      시장 영향: 거래 재개 때에는 모인 주문으로 새로운 균형가격을 찾기 때문에 정지 전 마지막 가격과 크게 벌어진 가격에서 거래가 시작될 수 있습니다.
      서킷브레이커는 공포 속 즉시 주문을 잠시 멈춰 판단 시간을 주지만 손실이나 가격 하락 자체를 막아주지는 않습니다.

      초보자 핵심: 거래가 멈췄다고 가격이 고정되거나 위험이 사라진 것은 아닙니다.
      재개 후 가격 공백과 유동성 부족 가능성까지 생각해야 합니다.
    caution: >-
      단계별 지수 하락률, 지속시간, 발동 가능 시간은 제도 개정 대상입니다.
      실제 투자 화면에서는 KRX 공지와 증권사 안내를 기준으로 확인해야 합니다.

  - conceptCode: SHORT_SELLING
    title: "공매도: 빌린 주식을 먼저 팔고 나중에 갚기"
    summary: >-
      공매도는 주식을 빌려 먼저 판 뒤 나중에 다시 사서 갚는 거래로,
      가격이 하락하면 이익 가능성이 있지만 상승하면 손실이 커집니다.
    detailedExplanation: >-
      일반 매수는 싸게 사서 비싸게 파는 순서입니다. 공매도는 주식을 빌려 먼저 매도하고
      나중에 주식을 매수해 빌린 주식을 돌려주는 순서입니다. 이 되사기를 숏커버링이라고도 합니다.

      매도가격보다 낮은 가격에 되사면 차액에서 대여료와 거래비용을 뺀 만큼 이익이 날 수 있습니다.
      반대로 가격이 오르면 더 비싸게 사서 갚아야 하므로 손실이 발생합니다.
      주가는 이론상 상승 한도가 없어 공매도 손실도 크게 확대될 수 있습니다.

      공매도 거래량은 그날 공매도로 체결된 규모이고 공매도 잔고는 아직 상환되지 않은 포지션입니다.
      대차잔고는 빌려 간 주식의 규모로 실제 공매도 잔고와 같지 않습니다. 세 지표를 구분해야 합니다.

      핵심 흐름: 주식 차입 → 시장에서 먼저 매도 → 나중에 다시 매수 → 빌린 주식 반환입니다.
      비용 전 손익은 대략 (공매도 가격 - 되사는 가격) × 주식 수이며,
      실제 손익에서는 대여료, 수수료, 세금과 배당 상당액 등을 고려해야 합니다.

      공매도 잔고가 늘었다면 아직 갚지 않은 하락 포지션이 늘었다는 뜻이지만 이유는 하나가 아닙니다.
      가격 하락 전망뿐 아니라 보유 주식의 헤지, 전환사채 차익거래, 시장조성 등 여러 거래가 섞일 수 있습니다.

      이후 주가가 오르면 손실을 줄이기 위해 주식을 되사는 숏커버링이 몰릴 수 있습니다.
      이 매수가 상승을 더 빠르게 만드는 현상을 숏스퀴즈라고 부르지만, 잔고가 많다고 반드시 발생하는 것은 아닙니다.
    bakeryExample: >-
      빵집 주식 1주를 빌려 10만 원에 먼저 팔고 8만 원에 사서 돌려주면 비용 전 차익은 2만 원입니다.
      반대로 15만 원으로 오르면 5만 원을 더 내고 사서 갚아야 합니다.

      공식: 공매도 비용 전 손익 = (공매도 가격 - 되사는 가격) × 주식 수
      숫자 대입: (10만 원 - 8만 원) × 10주 = +20만 원
      결과: 대여료와 거래비용을 빼기 전 20만 원의 이익입니다.

      숫자 대입: (10만 원 - 20만 원) × 10주 = -100만 원
      결과: 주가가 두 배가 되면 처음 받은 매도대금 100만 원과 같은 크기의 손실이 발생합니다.

      처음 받은 매도대금이 내 돈으로 확정되는 것은 아닙니다.
      결국 같은 수량의 주식을 되사서 빌려준 사람에게 돌려줘야 거래가 끝납니다.
    marketImpact: >-
      공매도 거래가 늘면 하락을 예상하는 투자자가 많아졌을 가능성이 있지만, 그것만이 유일한 이유는 아닙니다.
      기관은 보유 포트폴리오의 위험을 줄이거나 선물·ETF와의 가격 차이를 거래하고, 시장조성자는 유동성을 공급하기 위해 공매도를 사용할 수도 있습니다.

      시장 영향: 공매도 매도가 한꺼번에 늘면 단기 매도 압력이 커질 수 있지만, 이후 포지션을 끝내려면 반드시 주식을 다시 사야 합니다.
      주가가 예상과 반대로 급등하면 공매도 투자자의 되사기인 숏커버가 추가 매수 압력이 되고, 심하면 숏스퀴즈로 상승폭이 커질 수 있습니다.

      초보자 핵심: 공매도 거래량은 그날 새로 거래된 규모이고 공매도 잔고는 아직 갚지 않은 누적 포지션에 가깝습니다.
      절대 수량만 보지 말고 전체 거래량 대비 공매도 비중, 시가총액 대비 잔고 비중, 주가와 잔고의 동반 변화를 함께 봐야 합니다.
    caution: >-
      공매도 거래가 많다고 반드시 시장 참여자 모두가 고점이라고 판단한 것은 아닙니다.
      헤지, 차익거래와 시장조성 목적도 섞이며 거래량은 잔고나 향후 매수 의무의 정확한 크기가 아닙니다.
      규제 대상, 가능 종목과 업틱룰 등은 최신 시장 규정을 확인해야 합니다.

  - conceptCode: FUTURES
    title: "선물: 미래 거래가격을 오늘 정하는 계약"
    summary: >-
      선물은 특정 자산을 미래의 정해진 시점에 약속한 가격으로 사고팔기로 한 표준화 계약입니다.
    detailedExplanation: >-
      선물 매수자는 미래에 약속한 가격으로 사는 쪽, 매도자는 파는 쪽의 의무를 집니다.
      계약 전체 금액을 내지 않고 일부 증거금으로 큰 명목금액을 거래하므로 레버리지가 발생합니다.

      거래소 선물은 매일 시장가격으로 손익을 정산합니다. 손실로 증거금이 유지 기준 아래로 내려가면
      추가 증거금을 요구받거나 포지션이 강제 청산될 수 있습니다.

      생산자와 투자자는 가격을 미리 고정하는 헤지에 사용할 수 있고,
      방향을 예상하는 투기나 현물과 선물의 가격 차이를 이용하는 차익거래에도 사용할 수 있습니다.

      선물가격은 미래 가격을 정확히 예언한 숫자가 아니라 현재 시장 참여자들이 금리, 보관비용,
      배당과 수급 등을 반영해 거래하는 계약가격입니다. 현물가격과의 차이를 베이시스라고 합니다.

      핵심 흐름: 계약 선택 → 증거금 납부 → 매일 손익 정산 → 만기 전 반대매매로 청산하거나 만기결제입니다.
      계약승수가 크면 선물가격이 조금만 움직여도 실제 손익은 크게 달라집니다.
    bakeryExample: >-
      빵집이 세 달 뒤 밀가루를 포대당 5만 원에 사기로 지금 계약하면 원가 상승 위험을 줄일 수 있습니다.
      실제 가격이 6만 원이면 계약이 유리하고 4만 원이면 더 싼 시장가격 기회를 놓칩니다.

      공식: 선물 명목금액 = 약속한 가격 × 계약수량
      숫자 대입: 5만 원 × 100포대 = 500만 원
      증거금 50만 원만 맡겼더라도 손익은 50만 원이 아니라 500만 원 규모의 가격 변화에 따라 계산됩니다.

      공식: 단순화한 선물 손익 = (현재 시장가격 - 약속한 가격) × 계약수량
      숫자 대입: (6만 원 - 5만 원) × 100포대 = +100만 원
      결과: 50만 원의 증거금으로 100만 원의 평가이익이 생길 수 있으며, 반대 방향이면 같은 크기의 손실이 생깁니다.
      적은 증거금으로 큰 손익이 생기는 레버리지를 숫자로 이해해야 합니다.
    marketImpact: >-
      국민연금 같은 연기금이나 대형기관은 보유 주식을 모두 팔지 않고도 시장 하락 위험을 줄이기 위해 주가지수 선물을 매도할 수 있습니다.
      따라서 대규모 선물 매도가 반드시 현물 주식을 부정적으로 본다는 뜻은 아니며, 기존 포트폴리오를 보호하는 헤지일 수 있습니다.

      시장 영향: 선물가격과 현물지수의 차이가 커지면 차익거래자가 싼 쪽을 사고 비싼 쪽을 팔면서 현물 주식 바구니에도 대규모 프로그램 주문이 들어올 수 있습니다.
      선물 만기나 다음 만기로 포지션을 옮기는 롤오버 시기에는 기업 뉴스와 관계없이 거래량과 장중 변동성이 커질 수 있습니다.

      초보자 핵심: 선물의 대량 매수·매도를 바로 상승·하락 전망으로 해석하지 말고 헤지, 차익거래, 만기 이전 같은 거래 목적을 먼저 구분해야 합니다.
    caution: >-
      적은 증거금으로 큰 금액을 거래해 손익 변동이 빠릅니다.
      만기, 결제방식, 계약승수, 증거금과 일일정산 구조를 이해하지 않고 거래하면 안 됩니다.

  - conceptCode: OPTIONS
    title: "옵션: 미래에 사고팔 수 있는 권리"
    summary: >-
      옵션은 정해진 기간 안에 특정 가격으로 기초자산을 사거나 팔 수 있는 권리를 거래하는 계약입니다.
    detailedExplanation: >-
      살 수 있는 권리는 콜옵션, 팔 수 있는 권리는 풋옵션입니다.
      옵션 매수자는 프리미엄을 내고 권리를 얻으며 불리하면 행사하지 않을 수 있습니다.

      옵션 매도자는 프리미엄을 받는 대신 매수자가 권리를 행사할 때 계약을 이행할 의무를 집니다.
      따라서 매수자와 매도자의 손익 구조가 비대칭이며 특히 무담보 옵션 매도는 큰 손실 위험이 있습니다.

      옵션 가격은 기초자산 가격뿐 아니라 행사가격, 만기까지 남은 시간, 변동성, 금리 등에 영향을 받습니다.
      방향이 맞아도 시간이 지나거나 기대 변동성이 낮아지면 손실이 날 수 있습니다.

      콜옵션 매수자는 가격 상승에 대비한 권리, 풋옵션 매수자는 가격 하락에 대비한 권리를 삽니다.
      권리의 가격인 프리미엄은 내재가치와 시간가치로 이해할 수 있으며 만기가 가까워지면 시간가치가 줄어드는 경향이 있습니다.

      핵심 관계: 옵션 매수자 = 프리미엄을 내고 선택권을 가짐,
      옵션 매도자 = 프리미엄을 받고 상대방의 선택을 이행할 의무를 짐입니다.
      같은 옵션이라도 매수와 매도의 위험이 크게 다른 이유입니다.
    bakeryExample: >-
      한 달 안에 빵집 주식을 10만 원에 살 수 있는 권리를 5천 원에 샀다고 가정해봅시다.
      주가가 13만 원이면 권리 가치가 생기지만 9만 원이면 굳이 행사하지 않고 프리미엄을 잃을 수 있습니다.

      공식: 콜옵션 만기 내재가치 = max(만기 주가 - 행사가격, 0)
      숫자 대입: max(13만 원 - 10만 원, 0) = 3만 원
      공식: 콜옵션 매수자의 비용 전 순손익 = 내재가치 - 지급한 프리미엄
      숫자 대입: 3만 원 - 5천 원 = +2만 5천 원

      공식: 콜옵션 매수자의 손익분기 주가 = 행사가격 + 지급한 프리미엄
      숫자 대입: 10만 원 + 5천 원 = 10만 5천 원
      결과: 만기 주가가 10만 5천 원이면 권리 가치와 지급한 프리미엄이 같아 비용 전 손익분기 수준입니다.
      주가가 9만 원이면 권리를 포기하고 프리미엄 5천 원을 잃는 편이 10만 원에 억지로 사는 것보다 낫습니다.
    marketImpact: >-
      옵션을 판매한 증권사나 시장조성자는 주가가 움직일 때 손실 위험을 줄이려고 기초주식이나 선물을 계속 사고파는 델타 헤지를 합니다.
      특히 만기가 가깝고 특정 행사가격 주변에 옵션 거래가 많이 쌓여 있으면 작은 가격 변화에도 헤지 물량이 커질 수 있습니다.

      시장 영향: 풋옵션 수요가 급증하면 하락 위험에 대비하려는 투자자가 늘었다는 의미일 수 있고 내재변동성도 높아질 수 있습니다.
      그러나 보험을 많이 샀다는 사실이 실제 사고를 확정하지 않듯, 풋옵션 거래 증가가 주가 하락을 확정하는 것은 아닙니다.

      초보자 핵심: 옵션 거래량만으로 시장 방향을 맞히기보다 콜·풋의 행사가격과 만기, 내재변동성, 매수인지 매도인지와 시장조성자의 헤지 가능성을 함께 봐야 합니다.
    caution: >-
      옵션 매수자의 최대손실은 일반적으로 지급한 프리미엄으로 제한되지만 옵션 매도자의 위험은 훨씬 클 수 있습니다.
      만기와 시간가치 감소, 변동성 변화 및 자동 행사·결제 기준을 반드시 확인해야 합니다.
