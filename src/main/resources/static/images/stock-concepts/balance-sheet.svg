<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 720 360" role="img" aria-labelledby="title desc">
  <title id="title">재무상태표의 균형</title>
  <desc id="desc">회사가 가진 자산은 채권자에게 갚아야 할 부채와 주주의 몫인 자기자본의 합과 같습니다.</desc>
  <rect width="720" height="360" rx="24" fill="#f7faff"/>
  <text x="36" y="44" fill="#1e3a8a" font-family="Pretendard, sans-serif" font-size="22" font-weight="800">회사가 가진 것 = 빌린 돈 + 주주의 몫</text>
  <text x="36" y="70" fill="#64748b" font-family="Pretendard, sans-serif" font-size="14">재무상태표는 특정 시점의 자산과 그 자금을 어디서 마련했는지 보여줍니다.</text>
  <g font-family="Pretendard, sans-serif">
    <rect x="70" y="111" width="230" height="174" rx="22" fill="#2563eb"/>
    <text x="185" y="151" text-anchor="middle" fill="#dbeafe" font-size="14" font-weight="800">회사가 가진 경제적 자원</text>
    <text x="185" y="192" text-anchor="middle" fill="#fff" font-size="28" font-weight="900">자산 1억</text>
    <text x="185" y="228" text-anchor="middle" fill="#dbeafe" font-size="13" font-weight="700">현금·재고·건물·설비</text>
    <text x="185" y="254" text-anchor="middle" fill="#fff" font-size="18" font-weight="900">100%</text>
    <text x="336" y="207" text-anchor="middle" fill="#2563eb" font-size="34" font-weight="900">=</text>
    <rect x="372" y="111" width="278" height="78" rx="18" fill="#fff" stroke="#fecaca"/>
    <text x="398" y="143" fill="#64748b" font-size="13" font-weight="700">갚아야 할 돈</text>
    <text x="624" y="158" text-anchor="end" fill="#dc2626" font-size="23" font-weight="900">부채 4천만</text>
    <rect x="372" y="207" width="278" height="78" rx="18" fill="#eff6ff" stroke="#93c5fd"/>
    <text x="398" y="239" fill="#64748b" font-size="13" font-weight="700">주주에게 남는 몫</text>
    <text x="624" y="254" text-anchor="end" fill="#2563eb" font-size="23" font-weight="900">자기자본 6천만</text>
    <rect x="168" y="310" width="384" height="34" rx="17" fill="#dbeafe"/>
    <text x="360" y="332" text-anchor="middle" fill="#1e40af" font-size="14" font-weight="800">자산 1억 = 부채 4천만 + 자기자본 6천만</text>
  </g>
</svg>
