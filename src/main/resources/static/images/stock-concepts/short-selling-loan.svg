<svg xmlns="http://www.w3.org/2000/svg" width="960" height="520" viewBox="0 0 960 520" role="img" aria-labelledby="title desc">
  <title id="title">대차거래와 공매도, 숏커버링의 관계</title>
  <desc id="desc">주식을 빌려 대차잔고가 생기고 일부를 공매도한 뒤 다시 사서 반환하는 흐름을 보여줍니다.</desc>
  <defs>
    <linearGradient id="bg" x1="0" x2="1" y1="0" y2="1">
      <stop offset="0" stop-color="#eff6ff"/>
      <stop offset="1" stop-color="#ecfeff"/>
    </linearGradient>
    <filter id="shadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="8" stdDeviation="10" flood-color="#1e3a8a" flood-opacity=".10"/>
    </filter>
    <marker id="arrow" markerWidth="10" markerHeight="10" refX="8" refY="5" orient="auto">
      <path d="M0 0L10 5L0 10Z" fill="#3b82f6"/>
    </marker>
  </defs>
  <rect width="960" height="520" rx="28" fill="url(#bg)"/>
  <text x="54" y="62" font-family="sans-serif" font-size="29" font-weight="800" fill="#0f172a">빌린 주식과 실제 공매도는 같은 수량이 아닙니다</text>
  <text x="54" y="94" font-family="sans-serif" font-size="16" fill="#64748b">대차잔고는 남아 있는 빌린 주식, 공매도 거래량은 시장에서 실제로 판 수량입니다.</text>

  <g filter="url(#shadow)">
    <rect x="54" y="142" width="226" height="202" rx="22" fill="#fff" stroke="#bfdbfe" stroke-width="2"/>
    <circle cx="167" cy="197" r="34" fill="#dbeafe"/>
    <path d="M150 199h34M155 187h24M156 211h22" stroke="#2563eb" stroke-width="6" stroke-linecap="round"/>
    <text x="167" y="257" text-anchor="middle" font-family="sans-serif" font-size="20" font-weight="800" fill="#0f172a">주식 20주 빌리기</text>
    <text x="167" y="288" text-anchor="middle" font-family="sans-serif" font-size="16" fill="#475569">대차잔고 20주</text>
    <text x="167" y="317" text-anchor="middle" font-family="sans-serif" font-size="14" fill="#64748b">아직 반환하지 않은 잔량</text>

    <rect x="367" y="142" width="226" height="202" rx="22" fill="#fff" stroke="#fecaca" stroke-width="2"/>
    <circle cx="480" cy="197" r="34" fill="#fee2e2"/>
    <path d="M461 189h38M461 205h29" stroke="#ef4444" stroke-width="6" stroke-linecap="round"/>
    <text x="480" y="257" text-anchor="middle" font-family="sans-serif" font-size="20" font-weight="800" fill="#0f172a">12주 먼저 팔기</text>
    <text x="480" y="288" text-anchor="middle" font-family="sans-serif" font-size="16" fill="#dc2626">공매도 거래량 12주</text>
    <text x="480" y="317" text-anchor="middle" font-family="sans-serif" font-size="14" fill="#64748b">그날 실제 시장에서 판 수량</text>

    <rect x="680" y="142" width="226" height="202" rx="22" fill="#fff" stroke="#bbf7d0" stroke-width="2"/>
    <circle cx="793" cy="197" r="34" fill="#dcfce7"/>
    <path d="M778 187l-10 10 10 10M768 197h36M808 187l10 10-10 10" stroke="#16a34a" stroke-width="5" fill="none" stroke-linecap="round" stroke-linejoin="round"/>
    <text x="793" y="257" text-anchor="middle" font-family="sans-serif" font-size="20" font-weight="800" fill="#0f172a">다시 사서 반환</text>
    <text x="793" y="288" text-anchor="middle" font-family="sans-serif" font-size="16" fill="#15803d">숏커버링</text>
    <text x="793" y="317" text-anchor="middle" font-family="sans-serif" font-size="14" fill="#64748b">매수 후 빌린 주식을 갚음</text>
  </g>

  <path d="M294 243H349" stroke="#3b82f6" stroke-width="4" marker-end="url(#arrow)"/>
  <path d="M607 243H662" stroke="#3b82f6" stroke-width="4" marker-end="url(#arrow)"/>
  <rect x="164" y="390" width="632" height="76" rx="24" fill="#dbeafe"/>
  <text x="480" y="422" text-anchor="middle" font-family="sans-serif" font-size="18" font-weight="800" fill="#1e40af">대차잔고 20주 ≠ 공매도 거래량 12주</text>
  <text x="480" y="450" text-anchor="middle" font-family="sans-serif" font-size="15" fill="#475569">대차는 빌린 상태, 공매도는 실제 매도 흐름이므로 가격·거래량과 함께 봅니다.</text>
</svg>
