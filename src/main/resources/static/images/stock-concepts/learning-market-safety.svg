<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 420" role="img" aria-labelledby="title desc"><title id="title">사이드카와 서킷브레이커</title><desc id="desc">급격한 시장 변동 때 프로그램매매를 제한하거나 시장 전체 거래를 멈추는 안전장치</desc><rect width="900" height="420" rx="28" fill="#fff7ed"/><text x="48" y="60" font-size="28" font-weight="700" fill="#7c2d12">급격한 충격에 시장이 숨을 고르는 장치</text><rect x="65" y="125" width="340" height="210" rx="25" fill="#fff" stroke="#fdba74" stroke-width="4"/><text x="235" y="177" text-anchor="middle" font-size="26" font-weight="700" fill="#c2410c">사이드카</text><text x="235" y="226" text-anchor="middle" font-size="19" fill="#475569">프로그램매매 호가 효력</text><text x="235" y="259" text-anchor="middle" font-size="19" fill="#475569">일시 정지</text><text x="235" y="305" text-anchor="middle" font-size="18" font-weight="700" fill="#ea580c">충격 전파 속도를 늦춤</text><rect x="495" y="125" width="340" height="210" rx="25" fill="#fff" stroke="#fb7185" stroke-width="4"/><text x="665" y="177" text-anchor="middle" font-size="26" font-weight="700" fill="#be123c">서킷브레이커</text><text x="665" y="226" text-anchor="middle" font-size="19" fill="#475569">시장 전체 거래</text><text x="665" y="259" text-anchor="middle" font-size="19" fill="#475569">단계적 정지</text><text x="665" y="305" text-anchor="middle" font-size="18" font-weight="700" fill="#e11d48">공포성 거래를 진정</text></svg>
